<script>(function () {
  var root = document.documentElement, parentDoc = null;
  try { if (window.parent && window.parent !== window) parentDoc = window.parent.document; } catch (e) {}
  function applyTheme() {
    var t = parentDoc ? parentDoc.documentElement.getAttribute("data-theme") : null;
    if (t !== "dark" && t !== "light") {
      t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    if (root.getAttribute("data-theme") !== t) root.setAttribute("data-theme", t);
    var light = document.getElementById("highlight_theme_light"), dark = document.getElementById("highlight_theme_dark");
    if (light && dark) { light.media = t === "dark" ? "none" : ""; dark.media = t === "dark" ? "" : "none"; }
  }
  function applyType() {
    if (!parentDoc) return;
    var view = parentDoc.defaultView;
    var article = parentDoc.querySelector("d-article") || parentDoc.body;
    var a = view.getComputedStyle(article), r = view.getComputedStyle(parentDoc.documentElement);
    root.style.fontSize = r.fontSize;
    root.style.fontFamily = a.fontFamily;
    // keep a relative line height relative: measure how it scales with the font size
    var lineHeight = a.lineHeight;
    if (parentDoc.querySelector("d-article")) {
      var probe = parentDoc.createElement("span");
      probe.style.fontSize = "100px";
      article.appendChild(probe);
      var probed = view.getComputedStyle(probe).lineHeight;
      article.removeChild(probe);
      if (probed !== lineHeight && probed.slice(-2) === "px") lineHeight = String(parseFloat(probed) / 100);
    }
    [document.body, document.querySelector("#frame-root > d-article")].forEach(function (target) {
      if (!target) return;
      target.style.fontSize = a.fontSize;
      target.style.lineHeight = lineHeight;
      target.style.fontWeight = a.fontWeight;
      target.style.fontFamily = a.fontFamily;
    });
    document.body.style.color = "var(--global-text-color)";
  }
  applyTheme();
  window.applyArticleType = applyType;
  document.addEventListener("DOMContentLoaded", function () {
    applyType();
    if (parentDoc) {
      new MutationObserver(function () { applyTheme(); setTimeout(applyType, 0); })
        .observe(parentDoc.documentElement, { attributes: true, attributeFilter: ["data-theme", "class"] });
    }
    var holder = document.getElementById("frame-root");
    function fit() {
      var h = Math.ceil(holder.getBoundingClientRect().height);
      if (window.frameElement && h > 0) window.frameElement.style.height = h + "px";
    }
    if (window.ResizeObserver) new ResizeObserver(fit).observe(holder);
    window.addEventListener("load", fit);
    window.addEventListener("resize", fit);
    fit();
  });
})();</script>

<section id="sudoku-results" aria-label="Sudoku generation results" aria-busy="false">
  <div class="interactive-results" hidden>
    <div class="metric-charts">
      <div class="chart-panel">
        <div class="chart-title">Exact Solution Match</div>
        <div class="chart" data-metric="exact_match_percent" role="img" aria-label="Exact Sudoku matches by clue count: three evaluation schedule bars, with solid MDM scores and dashed, diagonally hatched extensions to ReMDM-conf scores"></div>
      </div>
      <div class="chart-panel">
        <div class="chart-title">Valid Sudoku Solutions</div>
        <div class="chart" data-metric="solved_percent" role="img" aria-label="Valid Sudoku solutions by clue count: three evaluation schedule bars, with solid MDM scores and dashed, diagonally hatched extensions to ReMDM-conf scores"></div>
      </div>
    </div>
    <div class="plot-keys">
      <div class="schedule-key" role="group" aria-label="Evaluation schedule colours"><span class="key-label">Evaluation Schedule:</span></div>
      <div class="sampler-key" role="group" aria-label="Model key">
        <span class="key-label">Model:</span>
        <span class="key-item"><span class="sampler-swatch" aria-hidden="true"></span>MDM</span>
        <span class="key-item"><span class="sampler-swatch improvement" aria-hidden="true"></span>ReMDM-conf</span>
      </div>
    </div>
  </div>
  <p class="load-status" role="status"></p>
  <button class="retry" type="button" hidden>Retry</button>
  <script type="application/json" class="results-data">{"model":"DDiT","sampling_steps":50,"dataset_split":"official test set","groups":["17–33","34–40","41–80","Overall"],"puzzle_counts":[7648,20462,21890,50000],"runs":[{"model":"MDM","schedule":"Log-linear","exact_match_percent":["62.55","89.94","98.65","89.56"],"solved_percent":["73.20","91.85","99.63","92.41"]},{"model":"ReMDM-conf","schedule":"Log-linear","exact_match_percent":["69.25","92.75","98.84","91.82"],"solved_percent":["81.26","94.74","99.75","94.87"]},{"model":"MDM","schedule":"Cosine","exact_match_percent":["60.89","89.19","98.68","89.02"],"solved_percent":["70.14","91.07","99.58","91.59"]},{"model":"ReMDM-conf","schedule":"Cosine","exact_match_percent":["68.72","92.30","98.87","91.57"],"solved_percent":["80.56","94.41","99.76","94.63"]},{"model":"MDM","schedule":"Cosine (DUO)","exact_match_percent":["62.07","88.37","97.40","88.30"],"solved_percent":["72.88","90.33","98.33","91.16"]},{"model":"ReMDM-conf","schedule":"Cosine (DUO)","exact_match_percent":["68.15","92.11","98.78","91.37"],"solved_percent":["79.34","94.11","99.72","94.31"]}]}</script>
</section>

<script>
  (() => {
    const root = document.getElementById("sudoku-results");
    const results = JSON.parse(root.querySelector(".results-data").textContent);
    const interactive = root.querySelector(".interactive-results");
    const charts = Array.from(root.querySelectorAll(".chart"));
    const status = root.querySelector(".load-status");
    const retry = root.querySelector(".retry");
    const schedules = ["Log-linear", "Cosine", "Cosine (DUO)"];
    const colors = { "Log-linear": "#e69f00", Cosine: "#a855f7", "Cosine (DUO)": "#0f9e9e" };
    let renderQueue = Promise.resolve();
    let observersReady = false;

    const legend = root.querySelector(".schedule-key");
    schedules.forEach((schedule) => {
      const item = document.createElement("span");
      item.className = "key-item";
      const swatch = document.createElement("span");
      swatch.className = "swatch";
      swatch.style.backgroundColor = colors[schedule];
      swatch.setAttribute("aria-hidden", "true");
      item.append(swatch, schedule);
      legend.appendChild(item);
    });

    function render() {
      const job = renderQueue.then(async () => {
        const style = getComputedStyle(root);
        const color = style.getPropertyValue("--global-text-color").trim() || "#17181a";
        const grid = style.getPropertyValue("--global-divider-color").trim() || "#d1d5db";
        const background = style.getPropertyValue("--global-bg-color").trim() || "#fff";
        for (const chart of charts) {
          const metric = chart.dataset.metric;
          const metricLabel = metric === "exact_match_percent" ? "Exact solution match" : "Valid Sudoku solutions";
          const traces = schedules.flatMap((schedule) => {
            const mdm = results.runs.find((run) => run.schedule === schedule && run.model === "MDM")[metric].map(Number);
            const remdm = results.runs.find((run) => run.schedule === schedule && run.model === "ReMDM-conf")[metric].map(Number);
            const gains = remdm.map((value, index) => Number((value - mdm[index]).toFixed(2)));
            const common = {
              type: "bar", x: results.groups, offsetgroup: schedule, alignmentgroup: "sudoku-schedules",
              customdata: results.groups.map((group, index) => [mdm[index], remdm[index], gains[index], results.puzzle_counts[index], group === "Overall" ? group : `${group} clues`]),
            };
            return [
              // Hover shows only the raw score at the top of the hovered segment.
              { ...common, name: `${schedule}: MDM`, y: mdm, marker: { color: colors[schedule] }, hovertemplate: "%{customdata[0]}%<extra></extra>" },
              // Explicit bases put each gain directly above its matching MDM bar.
              { ...common, name: `${schedule}: ReMDM-conf improvement`, y: gains, base: mdm, hovertemplate: "%{customdata[1]}%<extra></extra>",
                marker: { color: "rgba(0,0,0,0)", line: { color: colors[schedule], width: 1.5 },
                  pattern: { shape: "/", fillmode: "replace", fgcolor: colors[schedule], bgcolor: "rgba(0,0,0,0)", fgopacity: 0.8, size: 5, solidity: 0.15 } } },
            ];
          });
          const size = chart.getBoundingClientRect();
          await Plotly.react(chart, traces, {
            width: Math.round(size.width), height: Math.round(size.height), margin: { l: 58, r: 6, t: 8, b: 52 },
            font: { family: style.fontFamily, size: 11, color },
            paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
            barmode: "group", bargap: 0.25, bargroupgap: 0.08, showlegend: false, hovermode: "closest", dragmode: false,
            hoverlabel: { bgcolor: background, bordercolor: grid, font: { size: 13, color } },
            xaxis: {
              type: "category", categoryorder: "array", categoryarray: results.groups,
              fixedrange: true, showgrid: false, zeroline: false, tickangle: 0, tickfont: { size: 11 }, automargin: true,
              title: { text: "Number of clues", standoff: 10, font: { size: 11 } },
            },
            yaxis: { range: [0, 100], ticksuffix: "%", dtick: 25, fixedrange: true, gridcolor: grid, zerolinecolor: grid, automargin: true,
              title: { text: `${metricLabel} (%)`, standoff: 8, font: { size: 11 } } },
            shapes: [{ type: "line", x0: 2.5, x1: 2.5, y0: 0, y1: 1, yref: "paper", line: { color: grid, width: 1, dash: "dot" } }],
          }, { displayModeBar: false, displaylogo: false, scrollZoom: false });
        }
      });
      renderQueue = job.catch(() => {});
      return job;
    }

    function fail() {
      root.setAttribute("aria-busy", "false");
      interactive.hidden = true;
      status.textContent = "Charts unavailable.";
      retry.hidden = false;
    }

    async function ensurePlotly() {
      if (window.Plotly) return;
      const library = document.querySelector('script[src*="plotly.js@"]');
      if (!library) throw new Error("Plotly is unavailable");
      await new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = library.src;
        script.integrity = library.integrity;
        script.crossOrigin = library.crossOrigin;
        script.async = true;
        script.addEventListener("load", resolve, { once: true });
        script.addEventListener("error", reject, { once: true });
        document.head.appendChild(script);
      });
    }

    async function initialize() {
      retry.hidden = true;
      root.setAttribute("aria-busy", "true");
      status.textContent = "Loading charts...";
      try {
        await ensurePlotly();
        interactive.hidden = false;
        await render();
        root.setAttribute("aria-busy", "false");
        status.textContent = "";
        if (observersReady) return;
        const resizeObserver = new ResizeObserver((entries) => {
          entries.forEach(({ target, contentRect }) => {
            const width = Math.round(contentRect.width);
            const height = Math.round(contentRect.height);
            if (target.layout && width > 0 && height > 0 && (target.layout.width !== width || target.layout.height !== height)) {
              Plotly.relayout(target, { width, height }).catch(fail);
            }
          });
        });
        charts.forEach((chart) => resizeObserver.observe(chart));
        new MutationObserver(() => render().catch(fail)).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme", "class"] });
        observersReady = true;
      } catch (error) {
        fail();
      }
    }

    retry.addEventListener("click", initialize);
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", initialize, { once: true });
    else initialize();
  })();
</script>
