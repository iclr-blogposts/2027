<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Likelihood curves</title>
<style>
:root{color-scheme:light;--global-bg-color: #ffffff;--global-code-bg-color: rgba(181, 9, 172, 0.05);--global-text-color: #000000;--global-text-color-light: #828282;--global-theme-color: #b509ac;--global-hover-color: #b509ac;--global-hover-text-color: #ffffff;--global-footer-bg-color: #1c1c1d;--global-footer-text-color: #e8e8e8;--global-footer-link-color: #ffffff;--global-distill-app-color: #828282;--global-divider-color: rgba(0, 0, 0, 0.1);--global-card-bg-color: #ffffff;--global-highlight-color: #b71c1c;--global-back-to-top-bg-color: rgba( 0, 0, 0, 0.4 );--global-back-to-top-text-color: #ffffff;--global-newsletter-bg-color: #ffffff;--global-newsletter-text-color: #000000;--global-tip-block: #42b983;--global-tip-block-bg: #e2f5ec;--global-tip-block-text: #215d42;--global-tip-block-title: #359469;--global-warning-block: #e7c000;--global-warning-block-bg: #fff8d8;--global-warning-block-text: #6b5900;--global-warning-block-title: #b29400;--global-danger-block: #c00;--global-danger-block-bg: #ffe0e0;--global-danger-block-text: #600;--global-danger-block-title: #c00}
:root{--global-theme-color: #2698ba;--global-hover-color: #1688aa}
html[data-theme=dark]{color-scheme:dark;--global-bg-color: #1c1c1d;--global-code-bg-color: #2c3237;--global-text-color: #e8e8e8;--global-text-color-light: #828282;--global-theme-color: #2698ba;--global-hover-color: #2698ba;--global-hover-text-color: #ffffff;--global-footer-bg-color: #e8e8e8;--global-footer-text-color: #1c1c1d;--global-footer-link-color: #000000;--global-distill-app-color: #e8e8e8;--global-divider-color: #424246;--global-card-bg-color: #212529;--global-back-to-top-bg-color: rgba( 255, 255, 255, 0.5 );--global-back-to-top-text-color: #000000;--global-newsletter-bg-color: #e8e8e8;--global-newsletter-text-color: #1c1c1d;--global-tip-block: #42b983;--global-tip-block-bg: #215d42;--global-tip-block-text: #beffe2;--global-tip-block-title: #e2f5ec;--global-warning-block: #e7c000;--global-warning-block-bg: #6b5900;--global-warning-block-text: #fff2af;--global-warning-block-title: #fff8d8;--global-danger-block: #c00;--global-danger-block-bg: #600;--global-danger-block-text: #ffb9b9;--global-danger-block-title: #ffe0e0}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&amp;display=swap">
<link rel="stylesheet" href="../../css/tailwind.css">
<link rel="stylesheet" href="../../css/main.css">
<style>
html{overflow:hidden}
body{margin:0;padding:0;background:var(--global-bg-color);color:var(--global-text-color);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,"Fira Sans","Droid Sans","Helvetica Neue",Arial,sans-serif}
#frame-root{display:flow-root}
details{color:var(--global-text-color);background-color:var(--global-code-bg-color);margin-top:0;padding:8px 12px;position:relative;border-radius:6px;display:block;margin-bottom:20px;overflow:auto;max-width:100%}
details summary{color:var(--global-theme-color)}
li{margin-bottom:1em;margin-left:0;padding-left:0}
li:last-child{margin-bottom:0}
ul,ol{margin:0 0 1em 0;padding-left:24px}
details p{margin-top:.5rem;margin-bottom:.5rem}
#frame-root > section, #frame-root > figure, #frame-root > div {margin-top:0 !important;margin-bottom:0 !important}
</style>
<script>(function () {
  var root = document.documentElement, parentDoc = null;
  try { if (window.parent && window.parent !== window) parentDoc = window.parent.document; } catch (e) {}
  function applyTheme() {
    var t = parentDoc ? parentDoc.documentElement.getAttribute("data-theme") : null;
    if (t !== "dark" && t !== "light") {
      t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    if (root.getAttribute("data-theme") !== t) root.setAttribute("data-theme", t);
  }
  function applyType() {
    if (!parentDoc) return;
    var view = parentDoc.defaultView;
    var article = parentDoc.querySelector("d-article") || parentDoc.body;
    var a = view.getComputedStyle(article), r = view.getComputedStyle(parentDoc.documentElement);
    root.style.fontSize = r.fontSize;
    root.style.fontFamily = a.fontFamily;
    document.body.style.fontSize = a.fontSize;
    document.body.style.lineHeight = a.lineHeight;
    document.body.style.fontWeight = a.fontWeight;
    document.body.style.fontFamily = a.fontFamily;
    document.body.style.color = "var(--global-text-color)";
  }
  applyTheme();
  document.addEventListener("DOMContentLoaded", function () {
    applyType();
    if (parentDoc) {
      new MutationObserver(function () { applyTheme(); setTimeout(applyType, 0); })
        .observe(parentDoc.documentElement, { attributes: true, attributeFilter: ["data-theme", "class"] });
    }
    var holder = document.getElementById("frame-root");
    function fit() {
      var h = Math.ceil(holder.getBoundingClientRect().height);
      if (window.frameElement && h > 0) window.frameElement.style.height = h + "px";
    }
    if (window.ResizeObserver) new ResizeObserver(fit).observe(holder);
    window.addEventListener("load", fit);
    window.addEventListener("resize", fit);
    fit();
  });
})();</script>
<script src="https://cdn.jsdelivr.net/npm/plotly.js@3.0.1/dist/plotly.min.js" integrity="sha256-oy6Be7Eh6eiQFs5M7oXuPxxm9qbJXEtTpfSI93dW16Q=" crossorigin="anonymous"></script>
</head>
<body>
<div id="frame-root">
<style>
  #image-likelihood-curves { margin: 1.5rem 0 2rem; min-width: 0; container-type: inline-size; color: var(--global-text-color, #17181a); font-size: 0.85rem; }
  #image-likelihood-curves [hidden] { display: none !important; }
  #image-likelihood-curves .curve-controls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.25rem 1.5rem; margin-bottom: 1rem; }
  #image-likelihood-curves fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  #image-likelihood-curves legend { float: none; width: auto; margin: 0 0 0.5rem; padding: 0; border: 0; font-size: 0.85rem; line-height: 1.4; text-align: left; color: var(--global-text-color-light, #6b7280); }
  #image-likelihood-curves .curve-segments { display: flex; gap: 0.25rem; padding: 3px; border: 1px solid var(--global-divider-color, #d1d5db); border-radius: 8px; }
  #image-likelihood-curves .curve-option { position: relative; flex: 1 1 0; min-width: 0; margin: 0; cursor: pointer; }
  #image-likelihood-curves .curve-option input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  #image-likelihood-curves .curve-option span { display: flex; align-items: center; justify-content: center; min-height: 38px; height: 100%; padding: 0.45rem 0.5rem; border-radius: 5px; color: var(--global-text-color-light, #6b7280); font-size: 0.9rem; font-weight: 400; line-height: 1.4; text-align: center; overflow-wrap: anywhere; }
  #image-likelihood-curves .curve-option input:checked + span { background: color-mix(in srgb, var(--global-text-color, #17181a) 9%, transparent); color: var(--global-text-color, #17181a); font-weight: 600; }
  #image-likelihood-curves .curve-option input:disabled + span { opacity: 0.4; cursor: not-allowed; }
  #image-likelihood-curves .curve-option input:focus-visible + span, #image-likelihood-curves button:focus-visible, #image-likelihood-curves input[type="range"]:focus-visible { outline: 2px solid var(--global-theme-color, #6f4fd0); outline-offset: 3px; }
  #image-likelihood-curves .curve-schedule-key { display: flex; align-items: center; flex-wrap: wrap; gap: 0.5rem 1.25rem; margin: 1.5rem 0; font-size: 0.85rem; line-height: 1.5; }
  #image-likelihood-curves .curve-legend-title { color: var(--global-text-color-light, #6b7280); }
  #image-likelihood-curves .curve-legend-item { display: inline-flex; align-items: center; gap: 0.35rem; }
  #image-likelihood-curves .curve-swatch { width: 10px; height: 10px; flex: 0 0 10px; border-radius: 2px; }
  #image-likelihood-curves .curve-area-name { display: inline-flex; align-items: center; gap: 0.4rem; }
  #image-likelihood-curves .curve-line { display: inline-block; width: 19px; flex: 0 0 19px; border-top: 2px solid var(--curve-color); }
  #image-likelihood-curves .curve-line.dash { border-top-style: dashed; }
  #image-likelihood-curves .curve-line.dot { border-top-style: dotted; }
  #image-likelihood-curves .curve-panels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.5rem 2rem; }
  #image-likelihood-curves .curve-panel { min-width: 0; }
  #image-likelihood-curves .curve-plot { position: relative; height: 245px; isolation: isolate; }
  #image-likelihood-curves .likelihood-chart { position: relative; z-index: 1; width: 100%; height: 100%; }
  #image-likelihood-curves .curve-layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
  #image-likelihood-curves .curve-area-layer { z-index: 0; }
  #image-likelihood-curves .curve-marker-layer { z-index: 2; }
  #image-likelihood-curves .curve-area-title { margin: 0.65rem 0 0.4rem; font-size: 0.72rem; line-height: 1.5; color: var(--global-text-color-light, #6b7280); }
  #image-likelihood-curves .curve-area-row { display: grid; grid-template-columns: minmax(0, 1fr) max-content; align-items: center; gap: 0.5rem; min-height: 1.75rem; font-size: 0.74rem; line-height: 1.5; }
  #image-likelihood-curves .curve-area-number { margin: 0; padding: 0; font: inherit; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #image-likelihood-curves .curve-time { margin-top: 1rem; }
  #image-likelihood-curves .curve-time-label { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.4rem; }
  #image-likelihood-curves .curve-time-value, #image-likelihood-curves .curve-current-time { font-variant-numeric: tabular-nums; }
  #image-likelihood-curves input[type="range"] { display: block; width: 100%; margin: 0; accent-color: var(--global-text-color, #17181a); cursor: pointer; }
  #image-likelihood-curves .curve-time-meta { display: flex; justify-content: space-between; margin-top: 0.4rem; font-size: 0.72rem; color: var(--global-text-color-light, #6b7280); }
  #image-likelihood-curves .curve-status { margin: 0.75rem 0 0; font-size: 0.8rem; color: var(--global-text-color-light, #6b7280); }
  #image-likelihood-curves .curve-status:empty { display: none; }
  #image-likelihood-curves .curve-estimate-note { margin: 0.75rem 0 0; font-size: 0.72rem; color: var(--global-text-color-light, #6b7280); }
  #image-likelihood-curves .curve-retry { margin-top: 0.5rem; }
  @container (max-width: 620px) { #image-likelihood-curves .curve-panels { grid-template-columns: minmax(0, 1fr); gap: 1.5rem; } }
  @container (max-width: 520px) { #image-likelihood-curves .curve-controls { grid-template-columns: minmax(0, 1fr); gap: 1rem; } }
</style>
<figure id="image-likelihood-curves" aria-label="Image likelihood integrals by evaluation schedule" aria-busy="true"
  data-vdm-url="data/vdm-logsnr-likelihood/curves.json"
  data-mdm-url="data/mdm-likelihood-curves/curves.json">
  <div class="curve-controls">
    <fieldset disabled>
      <legend>Diffusion family</legend>
      <div class="curve-segments">
        <label class="curve-option"><input type="radio" name="likelihood-curve-family" value="VDM" checked><span>VDM</span></label>
        <label class="curve-option"><input type="radio" name="likelihood-curve-family" value="MDM"><span>MDM</span></label>
      </div>
    </fieldset>
    <fieldset disabled>
      <legend>Integration process</legend>
      <div class="curve-segments">
        <label class="curve-option"><input type="radio" name="likelihood-curve-integration" value="time" checked><span>Time t</span></label>
        <label class="curve-option"><input type="radio" name="likelihood-curve-integration" value="nu"><span>Noise level &nu;</span></label>
      </div>
    </fieldset>
  </div>
  <div class="curve-schedule-key" aria-label="Evaluation schedules"></div>
  <div class="curve-panels">
    
    
    <div class="curve-panel" data-metric="time_curve">
      <div class="curve-plot">
        <svg class="curve-layer curve-area-layer" aria-hidden="true"></svg>
        <div class="likelihood-chart" role="img" aria-label="time curve"></div>
        <svg class="curve-layer curve-marker-layer" aria-hidden="true"></svg>
      </div>
      <div class="curve-area-title">Area up to <span class="curve-area-coordinate">t</span> (nats/dim)</div>
      <div class="curve-areas"></div>
    </div>
    
    <div class="curve-panel" data-metric="nu_curve">
      <div class="curve-plot">
        <svg class="curve-layer curve-area-layer" aria-hidden="true"></svg>
        <div class="likelihood-chart" role="img" aria-label="nu curve"></div>
        <svg class="curve-layer curve-marker-layer" aria-hidden="true"></svg>
      </div>
      <div class="curve-area-title">Area up to <span class="curve-area-coordinate">t</span> (nats/dim)</div>
      <div class="curve-areas"></div>
    </div>
    
  </div>
  <div class="curve-time">
    <div class="curve-time-label"><label for="likelihood-curve-time">Integration progress</label><output class="curve-time-value" for="likelihood-curve-time">50%</output></div>
    <input id="likelihood-curve-time" type="range" min="0" max="100" step="1" value="50" disabled aria-label="Integration progress">
    <div class="curve-time-meta"><output class="curve-current-time" for="likelihood-curve-time">t = 0.50</output><span>Low to high corruption</span></div>
  </div>
  <figcaption class="curve-estimate-note">The &nu;-curve is an area-preserving transformation of the 40 time-bin averages. Lines are smoothed for display.</figcaption>
  <p class="curve-status" role="status">Loading likelihood curves...</p>
  <button type="button" class="curve-retry" hidden>Retry</button>
  <noscript>
    <p>Likelihood curves unavailable without JavaScript.</p>
  </noscript>
</figure>
<script type="module" src="js/likelihood-curves.js"></script>


</div>
</body>
</html>
