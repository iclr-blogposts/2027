<script>(function () {
  var root = document.documentElement, parentDoc = null;
  try { if (window.parent && window.parent !== window) parentDoc = window.parent.document; } catch (e) {}
  function applyTheme() {
    var t = parentDoc ? parentDoc.documentElement.getAttribute("data-theme") : null;
    if (t !== "dark" && t !== "light") {
      t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    if (root.getAttribute("data-theme") !== t) root.setAttribute("data-theme", t);
    var light = document.getElementById("highlight_theme_light"), dark = document.getElementById("highlight_theme_dark");
    if (light && dark) { light.media = t === "dark" ? "none" : ""; dark.media = t === "dark" ? "" : "none"; }
  }
  function applyType() {
    if (!parentDoc) return;
    var view = parentDoc.defaultView;
    var article = parentDoc.querySelector("d-article") || parentDoc.body;
    var a = view.getComputedStyle(article), r = view.getComputedStyle(parentDoc.documentElement);
    root.style.fontSize = r.fontSize;
    root.style.fontFamily = a.fontFamily;
    // keep a relative line height relative: measure how it scales with the font size
    var lineHeight = a.lineHeight;
    if (parentDoc.querySelector("d-article")) {
      var probe = parentDoc.createElement("span");
      probe.style.fontSize = "100px";
      article.appendChild(probe);
      var probed = view.getComputedStyle(probe).lineHeight;
      article.removeChild(probe);
      if (probed !== lineHeight && probed.slice(-2) === "px") lineHeight = String(parseFloat(probed) / 100);
    }
    [document.body, document.querySelector("#frame-root > d-article")].forEach(function (target) {
      if (!target) return;
      target.style.fontSize = a.fontSize;
      target.style.lineHeight = lineHeight;
      target.style.fontWeight = a.fontWeight;
      target.style.fontFamily = a.fontFamily;
    });
    document.body.style.color = "var(--global-text-color)";
  }
  applyTheme();
  window.applyArticleType = applyType;
  document.addEventListener("DOMContentLoaded", function () {
    applyType();
    if (parentDoc) {
      new MutationObserver(function () { applyTheme(); setTimeout(applyType, 0); })
        .observe(parentDoc.documentElement, { attributes: true, attributeFilter: ["data-theme", "class"] });
    }
    var holder = document.getElementById("frame-root");
    function fit() {
      var h = Math.ceil(holder.getBoundingClientRect().height);
      if (window.frameElement && h > 0) window.frameElement.style.height = h + "px";
    }
    if (window.ResizeObserver) new ResizeObserver(fit).observe(holder);
    window.addEventListener("load", fit);
    window.addEventListener("resize", fit);

  });

<style>

  #di[data-process="sample"] { --accent: var(--smp); }

  #di button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #di ul { list-style: none; margin: 0; padding: 0; }
  #di [hidden] { display: none !important; }

  /* controls: filled segmented toggles, the selected option is a solid accent chip */
  #di .di-controls { display: flex; flex-wrap: wrap; gap: 0.6rem 1rem; justify-content: center; align-items: center; margin-bottom: 1.3rem; }
  #di .di-group { display: inline-flex; gap: 0.2rem; padding: 0.22rem; border-radius: 999px; background: var(--di-neutral); }
  #di .di-group button { min-height: 32px; padding: 0.25rem 1rem; border-radius: 999px; font-size: 0.85rem; color: var(--di-muted); transition: background 0.15s, color 0.15s; }

  #di .di-stage { position: relative; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); column-gap: 112px; align-items: start; }

  "c": "@torch.no_grad()\ndef denoising_bound(\n    self,\n    x: torch.Tensor,\n    mc_draws: int = 10,\n    keep: torch.Tensor | None = None,\n    **model_kwargs,\n) -> tuple[torch.Tensor, torch.Tensor]:\n    \"\"\"Return each example's MC mean BPD and unbiased sample variance.\"\"\"\n    assert mc_draws >= 2\n    per_example_mean = torch.zeros(x.shape[0], device=x.device)\n    per_example_var = torch.zeros(x.shape[0], device=x.device)\n    for draw in range(mc_draws):\n        t = torch.rand(x.shape[0], device=x.device)\n        state_t = self.schedule(t)\n        z_t = self.sample_forward_marginal(x, state_t, keep=keep)\n        x_pred = self.predict_clean(z_t, state_t, **model_kwargs)\n        weighted_error = self.loss_weight(state_t) * self.error(x_pred, x, z_t)\n        bpd = weighted_error / math.log(2)\n        delta = bpd - per_example_mean\n        per_example_mean += delta / (draw + 1)\n        per_example_var += delta * (bpd - per_example_mean)\n    return per_example_mean, per_example_var / (mc_draws - 1)"

  "c": "def sample_reverse_transition(\n    self,\n    z_t: torch.Tensor,\n    state_t: ScheduleState,\n    state_s: ScheduleState,\n    **model_kwargs,\n) -> torch.Tensor:\n    \"\"\"Confidence-based ReMDM reverse transition\"\"\"\n    remask_strategy = model_kwargs.pop(\"remask_strategy\", \"confidence\")\n    confidence = model_kwargs[\"confidence\"]\n    fixed_mask = model_kwargs.get(\"fixed_mask\")\n    predict_kwargs = {\n        key: value\n        for key, value in model_kwargs.items()\n        if key not in {\"confidence\", \"fixed_mask\"}\n    }\n\n    # ReMDM Eq 7\n    xi_max = torch.where(\n        state_t.alpha > 0,\n        ((1 - state_s.alpha) / state_t.alpha).clamp(max=1),\n        torch.ones_like(state_t.alpha),\n    )\n\n    # The standard sampler starts fully masked. With fixed clues (for Sudoku),\n    # the first confidence vector can be entirely -inf despite visible tokens.\n    # Only generated, currently visible tokens can be remasked.\n    eligible = z_t != self.mask_token_id\n    if fixed_mask is not None:\n        eligible = eligible & ~fixed_mask\n    \n    if remask_strategy == \"confidence\":\n        # Stored confidence is -p, so weights are proportional to exp(-p).\n        scores = confidence\n    elif remask_strategy == \"uniform\":\n        # Equal scores give equal probabilities over eligible positions.\n        scores = torch.zeros_like(confidence)\n    else:\n        raise ValueError(f\"Unknown remasking strategy: {remask_strategy!r}\")\n    \n    eta = scores.masked_fill(~eligible, -torch.inf).softmax(dim=-1)\n    \n    # No eligible positions: assign zero remasking probability everywhere.\n    eta = torch.nan_to_num(eta, nan=0.0)\n    \n    xi = eta * bcast(xi_max, eta)\n\n    # Sample z_s\n    x_pred_logits = self.predict_clean(z_t, state_t, **predict_kwargs)\n    z_s = self.sample_forward_posterior(\n        z_t,\n        x_pred_logits,\n        state_t,\n        state_s,\n        xi=xi,\n    )\n    if fixed_mask is not None:\n        z_s = torch.where(fixed_mask, z_t, z_s)\n\n    # Update the confidence\n    x_probs = x_pred_logits.softmax(dim=-1).gather(-1, z_s.unsqueeze(-1)).squeeze(-1)\n    unmasked = (z_t == self.mask_token_id) & (z_s != self.mask_token_id)\n    remasked = (z_t != self.mask_token_id) & (z_s == self.mask_token_id)\n    confidence[unmasked] = -x_probs[unmasked]\n    confidence[remasked] = -torch.inf\n    if fixed_mask is not None:\n        confidence[fixed_mask] = -torch.inf\n\n    return z_s"

  "c": "def sample_forward_posterior(\n    self,\n    z_t: torch.Tensor,\n    x: torch.Tensor,\n    state_t: ScheduleState,\n    state_s: ScheduleState,\n    **kwargs,\n) -> torch.Tensor:\n    xi = kwargs.get(\"xi\", 0)\n\n    x_hat = torch.distributions.Categorical(logits=x).sample()\n    if not torch.is_tensor(xi):\n        xi = torch.full_like(x_hat, xi, dtype=x.dtype)\n    else:\n        xi = bcast(xi, x_hat).expand_as(x_hat)\n\n    alpha_t = bcast(state_t.alpha, x_hat).expand_as(x_hat)\n    alpha_s = bcast(state_s.alpha, x_hat).expand_as(x_hat)\n\n    # unmask prob when z_t = mask\n    unmask_prob_masked = (alpha_s - (1 - xi) * alpha_t) / (1 - alpha_t)\n\n    # unmask prob when z_t ≠ mask\n    unmask_prob_visible = 1 - xi\n\n    # unmask prob in both cases (z_t = mask and z_t ≠ mask)\n    visible = z_t != self.mask_token_id\n    unmask_prob = torch.where(visible, unmask_prob_visible, unmask_prob_masked)\n\n    # positions which are unmasked\n    unmask_mask = torch.bernoulli(unmask_prob).bool()\n\n    # ReMDM Eq 6\n    candidates = torch.where(visible, z_t, x_hat)\n    z_s = torch.where(unmask_mask, candidates, self.mask_token_id)\n\n    return z_s"

      "diff:loss": { name: "Diffusion.loss()", own: "Diffusion · shared", tex: "\\mathcal{L}(\\theta)=\\mathbb{E}_{t,\\,\\mathbf{x},\\,\\mathbf{z}_t}\\big[\\,\\omega(t)\\,\\mathcal{E}(\\mathbf{x},\\hat{\\mathbf{x}})\\big]", note: "One training step. Written once: it draws t, corrupts x, predicts the clean data and averages weight × error. The model-specific pieces come from the slots." },

      "vdm:weight": { name: "VDM.loss_weight()", own: "VDM · fills slot", tex: "\\omega(t)=-\\tfrac{1}{2}\\operatorname{SNR}'(t)", note: "Minus half the derivative of the signal-to-noise ratio." },

      "vdm:terminal": { name: "VDM.sample_terminal()", own: "VDM · fills slot", tex: "\\mathbf{z}_1\\sim\\mathcal{N}(\\mathbf{0},\\mathbf{I})", note: "Pure Gaussian noise." },
      "mdm:marginal": { name: "MDM.sample_forward_marginal()", own: "MDM · fills slot", tex: "\\begin{gathered}z_{t,i}=b_{t,i}\\,x_i+(1-b_{t,i})\\,m\\\\ b_{t,i}=1\\ \\text{ if }i\\in\\mathcal{K}\\ \\text{ else}\\\\ b_{t,i}\\overset{\\mathrm{iid}}{\\sim}\\mathrm{Bernoulli}(\\alpha_t)\\end{gathered}", note: "Keep each position with probability α_t, otherwise replace it with the mask value m. Positions in K are always kept." },
      "mdm:predict": { name: "MDM.predict_clean()", own: "MDM · fills slot", tex: "\\hat{x}_i=\\operatorname{Cat}\\big(\\operatorname{softmax}(\\mathbf{h}_{t,i}^{\\mathrm{out}})\\big)", note: "The network returns logits over the clean token at every position." },
      "mdm:weight": { name: "MDM.loss_weight()", own: "MDM · fills slot", tex: "\\omega(t)=-\\frac{\\alpha_t'}{1-\\alpha_t}", note: "The standard masked-diffusion ELBO weight." },
      "mdm:error": { name: "MDM.error()", own: "MDM · fills slot", tex: "\\begin{aligned}&\\mathcal{E}(\\mathbf{x},\\hat{\\mathbf{x}})=\\\\ &\\;-\\frac{1}{N}\\sum_{i=1}^{N}\\mathbf{1}[z_{t,i}=m]\\log\\hat{x}_i(x_i)\\end{aligned}", note: "Cross-entropy on the masked positions only." },
      "mdm:posterior": { name: "MDM.sample_forward_posterior()", own: "MDM · fills slot", tex: "\\begin{gathered}z_{s,i}=z_{t,i}\\ \\text{ if }z_{t,i}\\neq m\\\\ \\text{else }\\ c_i\\,x_i+(1-c_i)\\,m\\\\ c_i\\overset{\\mathrm{iid}}{\\sim}\\mathrm{Bernoulli}(\\rho_{s\\mid t})\\end{gathered}", note: "Visible tokens are copied; masked ones are revealed with probability (α_s − α_t)/(1 − α_t)." },

      "remdm:reverse": { name: "ReMDM.sample_reverse_transition()", own: "ReMDM · overrides MDM", tex: "\\begin{gathered}\\xi_{t,d}=\\eta_{t,d}\\min\\big\\{1,\\tfrac{1-\\alpha_s}{\\alpha_t}\\big\\},\\\\ \\mathbf{z}_s\\sim q_{\\xi}(\\mathbf{z}_s\\mid\\mathbf{z}_t,\\hat{\\mathbf{x}})\\end{gathered}", note: "Compute per-position remasking probabilities, sample the posterior, preserve fixed clues, and update confidence." },
      "remdm:posterior": { name: "ReMDM.sample_forward_posterior()", own: "ReMDM · overrides MDM", tex: "\\begin{gathered}z_{s,d}=\\begin{cases}u_d z_{t,d}+(1-u_d)m & z_{t,d}\\neq m\\\\ u_d\\tilde{x}_d+(1-u_d)m & z_{t,d}=m\\end{cases}\\\\ u_d\\sim\\mathrm{Bernoulli}(p_d),\\quad p_d=\\begin{cases}1-\\xi_{t,d} & z_{t,d}\\neq m\\\\ \\frac{\\alpha_s-(1-\\xi_{t,d})\\alpha_t}{1-\\alpha_t} & z_{t,d}=m\\end{cases}\\end{gathered}", note: "Visible tokens retain their current values unless remasked. Masked positions use a token sampled from the denoiser's categorical distribution." },
      "vp:cosine": { name: "CosineVPSchedule", own: "CosineVPSchedule · VPSchedule", tex: "\\begin{gathered}\\nu_t=2\\log\\tan\\big(\\theta_{\\max}+t(\\theta_{\\min}-\\theta_{\\max})\\big)\\\\ \\theta_{\\min}=\\arctan\\big(e^{\\nu_{\\min}/2}\\big)\\\\ \\theta_{\\max}=\\arctan\\big(e^{\\nu_{\\max}/2}\\big)\\end{gathered}", note: "Cosine log-SNR schedule." },

      "mask:loglinear": { name: "LogLinearMaskSchedule", own: "LogLinearMaskSchedule · MaskSchedule", tex: "\\begin{gathered}\\alpha_t=1-t,\\\\ t\\mapsto(1-\\epsilon)\\,t\\end{gathered}", note: "Tokens are kept with probability falling linearly from 1 to ε." },
      "mask:cosine": { name: "CosineMaskSchedule", own: "CosineMaskSchedule · MaskSchedule", tex: "\\begin{gathered}\\alpha_t=\\cos\\Big(\\frac{\\pi t}{2}\\Big),\\\\ t\\mapsto(1-\\epsilon)\\,t\\end{gathered}", note: "Cosine retention schedule." },

    const resolve = (key) => key.indexOf("model:") === 0 ? MODELS[state.model].family + ":" + key.slice(6) : key;

    /* math: MathJax when the page has it, plain TeX source otherwise */
    const mathReady = () => !!(window.MathJax && window.MathJax.typesetPromise);
    function typeset(els) {
      if (!mathReady() || !els.length) return;
      els.forEach((el) => { el.innerHTML = (el.dataset.disp ? "\\[" : "\\(") + el.dataset.tex + (el.dataset.disp ? "\\]" : "\\)"); });
      window.MathJax.typesetPromise(els).then(() => { fitEquation(); schedule(); }, () => {});
    }
    // Shrink an equation that is wider than its column, so it never runs over.
    function fitEquation() {
      const box = $("di-d-eq");
      box.style.fontSize = "";
      for (let pass = 0; pass < 3 && box.scrollWidth > box.clientWidth + 1; pass += 1) {
        const current = parseFloat(getComputedStyle(box).fontSize);
        box.style.fontSize = (current * box.clientWidth / box.scrollWidth) * 0.98 + "px";
      }
    }
    let fittedWidth = 0;
    new ResizeObserver(([entry]) => {
      const width = Math.round(entry.contentRect.width);
      if (width !== fittedWidth) { fittedWidth = width; requestAnimationFrame(fitEquation); }
    }).observe($("di-d-eq"));
    function setTex(el, tex, disp, fallback) {
      el.dataset.tex = tex;
      el.dataset.disp = disp ? "1" : "";
      if (mathReady()) typeset([el]);
      else el.innerHTML = fallback;
    }
    let tries = 0;
    const poll = setInterval(() => {
      tries += 1;
      if (mathReady()) { clearInterval(poll); typeset(Array.from(root.querySelectorAll("[data-tex]"))); }
      else if (tries > 40) clearInterval(poll);
    }, 300);

    function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
    const sp = (c, t) => '<span class="' + c + '">' + t + "</span>";

    function highlight(src) {

    function renderModelBox() {

    }

    function renderDetail() {
      const key = resolve(state.sel);
      const meta = META[key];
      const src = CODE[key];
      const classMethod = key === "nn" ? "forward" : key.startsWith("vp:") ? "logsnr" : key.startsWith("mask:") ? "alpha" : "__call__";
      const [className, methodName = classMethod] = meta.name.split(".");
      $("di-d-class").textContent = className;
      $("di-d-name").textContent = methodName.replace(/\(\)$/, "");
      const tex = typeof meta.tex === "string" ? meta.tex : meta.tex[MODELS[state.model].family];
      setTex($("di-d-eq"), tex, true, "<code>" + esc(tex) + "</code>");
      $("di-d-file").textContent = src ? src.f + ":" + src.l[0] + "–" + src.l[1] : "";
      $("di-d-code").innerHTML = src ? highlight(src.c) : "";
    }

    function apply() {
      const remdm = state.model === "remdm";
      const mdm = MODELS[state.model].family === "mdm";
      if (remdm) state.process = "sample";
      root.dataset.process = state.process;
      root.dataset.model = state.model;
      renderModelBox();
      $("di-remdm").hidden = !remdm;
      const modelHead = root.querySelector('[data-toggle="di-model-body"]');
      modelHead.disabled = remdm;
      setExpanded(modelHead, !remdm && state.modelExpanded);
      const stale = (mdm && /^vp/.test(state.sel)) || (!mdm && /^mask/.test(state.sel))
        || (!remdm && state.sel.startsWith("remdm:"));
      if (stale) state.sel = DEFAULT_SEL[state.process];
      $("di-col-vp").hidden = mdm;
      $("di-col-mask").hidden = !mdm;
      const active = ACTIVE[state.process];
      root.querySelectorAll("[data-k]").forEach((el) => {
        const on = active.indexOf(el.dataset.k) >= 0 && !(remdm && el.dataset.d === "diff:reverse");
        el.classList.toggle("on", on);
        if (el.classList.contains("di-box")) el.classList.toggle("off", !on);
        if (el.matches("button.di-row")) el.disabled = !on;
      });
      ["vp", "mask"].forEach((k) => {
        const on = MODELS[state.model].sched === k;
        $("di-" + k).classList.toggle("on", on);
        $("di-" + k).classList.toggle("off", !on);
      });
      root.querySelectorAll(".di-leaf").forEach((lf) => lf.classList.add("on"));
      root.querySelectorAll("button[data-process]").forEach((b) => {
        b.disabled = remdm && b.dataset.process !== "sample";
        b.setAttribute("aria-pressed", String(b.dataset.process === state.process));

      root.querySelectorAll("button[data-model]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.model === state.model)));

    }

    function canSelect(raw) {
      if (raw.startsWith("remdm:") && state.model !== "remdm") return false;
      if (raw.startsWith("model:") && state.model === "remdm") return false;
      const target = root.querySelector(`[data-d="${raw}"]`);
      return target && !target.disabled && (!target.dataset.k || ACTIVE[state.process].includes(target.dataset.k));
    }

    function select(raw) {
      if (!canSelect(raw)) return;
      state.sel = raw;
      root.querySelectorAll("[data-d]").forEach((el) => el.classList.toggle("sel", el.dataset.d === raw));

      schedule();
    }

    /* geometry */
    function rect(el) {
      const a = el.getBoundingClientRect();
      const s = stage.getBoundingClientRect();
      return { l: a.left - s.left, r: a.right - s.left, t: a.top - s.top, b: a.bottom - s.top, w: a.width, h: a.height };
    }
    const shown = (el) => el && el.offsetParent !== null;
    function path(cls, d, extra) {
      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", d);
      p.setAttribute("class", cls);
      Object.keys(extra || {}).forEach((k) => p.setAttribute(k, extra[k]));
      layer.appendChild(p);
    }

    function draw() {
      layer.replaceChildren();
      const arrows = root.querySelector(".di-arrows");
      const modelBox = $("di-model");
      const scheduleBox = $("di-schedule");
      modelBox.style.marginTop = "";
      scheduleBox.style.marginTop = "";
      if (getComputedStyle(arrows).display === "none") return;
      // Keep the second row aligned while allowing Diffusion to size to its contents.
      const networkParts = $("di-nn-parts");
      const networkBottom = (shown(networkParts) ? networkParts : $("di-nn")).getBoundingClientRect().bottom;
      const modelTop = modelBox.getBoundingClientRect().top;
      const rowTop = Math.max(modelTop, networkBottom + 24);
      modelBox.style.marginTop = (rowTop - modelTop) + "px";
      scheduleBox.style.marginTop = (rowTop - networkBottom) + "px";
      const D = rect($("di-diffusion"));
      const M = rect($("di-model"));
      const N = rect($("di-nn"));
      const S = rect($("di-schedule"));
      const tri = (sel) => "url(#di-mk-tri" + (sel ? "-s" : "") + ")";

      // inheritance: subclass -> superclass, triangle on the superclass
      const mx = M.l + M.w / 2;
      path("s sel", "M" + mx + " " + M.t + " V" + D.b, { "marker-end": tri(true) });
      if (shown($("di-remdm"))) {
        const R = rect($("di-remdm"));
        path("s sel di-remdm-inheritance", "M" + (R.l + R.w / 2) + " " + R.t + " V" + M.b, { "marker-end": tri(true) });
      }
      const px = S.l + S.w / 2;
      ["di-vp", "di-mask"].filter((id) => shown($(id))).forEach((id) => {
        const r = rect($(id));
        const cx = r.l + r.w / 2;
        const busY = S.b + (r.t - S.b) / 2;
        path("s sel", "M" + cx + " " + r.t + " V" + busY + " H" + px + " V" + S.b, { "marker-end": tri(true) });
      });
      // composition: ComposedDenoiser owns its three parts
      const nnParts = $("di-nn-parts");
      if (shown(nnParts)) {
        const P = rect($("di-nn"));
        nnParts.querySelectorAll(".di-part").forEach((pt) => {
          const L = rect(pt);
          path("c", "M" + L.l + " " + (L.t + L.h / 2) + " H" + (P.l + 12) + " V" + P.b, { "marker-end": "url(#di-mk-dia-e)" });
        });
      }
      root.querySelectorAll(".di-leaves").forEach((lv) => {
        if (!shown(lv)) return;
        const P = rect($(lv.dataset.parent));
        const on = $(lv.dataset.parent).classList.contains("on");
        const spine = P.l + 12;
        lv.querySelectorAll(".di-leaf").forEach((lf) => {
          const L = rect(lf);
          path("s" + (on ? " sel" : ""), "M" + L.l + " " + (L.t + L.h / 2) + " H" + spine + " V" + P.b, { "marker-end": tri(on) });
        });
      });

      // Separate header-level ports keep both links clear when Diffusion is collapsed.
      const yN = N.t + N.h / 2 - 8;
      const yS = S.t + S.h / 2;
      const schedulePortY = yN + 18;
      const scheduleRouteX = (D.r + S.l) / 2;
      path("c di-network-link", "M" + D.r + " " + yN + " H" + N.l, { "marker-start": "url(#di-mk-dia-s)" });
      path("c di-schedule-link", "M" + S.l + " " + yS + " H" + scheduleRouteX + " V" + schedulePortY + " H" + D.r, { "marker-end": "url(#di-mk-dia-e)" });
    }

    let raf = 0;
    function schedule() {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(draw);
    }

    function setExpanded(header, open) {
      header.setAttribute("aria-expanded", String(open));
      $(header.dataset.toggle).hidden = !open;
    }

    root.addEventListener("click", (e) => {
      const t = e.target.closest("button");
      if (!t || !root.contains(t) || t.disabled) return;
      if (t.dataset.toggle) {
        const open = t.getAttribute("aria-expanded") !== "true";
        setExpanded(t, open);
        const host = t.closest("[data-d]");
        if (t.dataset.toggle === "di-model-body") { state.modelExpanded = open; apply(); }
        else if (host && host.dataset.d) select(host.dataset.d);
        else schedule();
      } else if (t.dataset.d) {
        select(t.dataset.d);
      } else if (t.dataset.action === "expand") {
        const open = t.getAttribute("aria-pressed") !== "true";
        t.setAttribute("aria-pressed", String(open));
        t.textContent = open ? "Collapse" : "Expand";
        root.querySelectorAll("[data-toggle]").forEach((h) => {
          if (!h.disabled) setExpanded(h, open);
        });
        if (state.model !== "remdm") state.modelExpanded = open;
        if (!open) state.sel = DEFAULT_SEL[state.process];
        apply();
      } else if (t.dataset.process) {
        state.process = t.dataset.process;
        state.sel = DEFAULT_SEL[state.process];
        apply();
      } else if (t.dataset.model) {
        state.model = t.dataset.model;
        if (state.model === "remdm") {
          state.sel = "remdm:reverse";
          setExpanded(root.querySelector('[data-toggle="di-remdm-body"]'), true);
        }
        apply();
      }
    });
    // a pill inside a toggle header would double-fire; pills are never inside a head, so no guard is needed

    if (window.ResizeObserver) new ResizeObserver(schedule).observe(stage);
    window.addEventListener("resize", schedule);
    window.addEventListener("load", schedule);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(schedule);
    apply();
  })();
</script>


</d-article>
</div>
<script>/* the article page gives its tables this class */ document.querySelectorAll("d-article table").forEach(function (t) { t.classList.add("table"); });</script>
