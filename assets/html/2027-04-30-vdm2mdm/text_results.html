<script>(function () {
  var root = document.documentElement, parentDoc = null;
  try { if (window.parent && window.parent !== window) parentDoc = window.parent.document; } catch (e) {}
  function applyTheme() {
    var t = parentDoc ? parentDoc.documentElement.getAttribute("data-theme") : null;
    if (t !== "dark" && t !== "light") {
      t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    if (root.getAttribute("data-theme") !== t) root.setAttribute("data-theme", t);
  }
  function applyType() {
    if (!parentDoc) return;
    var view = parentDoc.defaultView;
    var article = parentDoc.querySelector("d-article") || parentDoc.body;
    var a = view.getComputedStyle(article), r = view.getComputedStyle(parentDoc.documentElement);
    root.style.fontSize = r.fontSize;
    root.style.fontFamily = a.fontFamily;
    document.body.style.fontSize = a.fontSize;
    document.body.style.lineHeight = a.lineHeight;
    document.body.style.fontWeight = a.fontWeight;
    document.body.style.fontFamily = a.fontFamily;
    document.body.style.color = "var(--global-text-color)";
  }
  applyTheme();
  document.addEventListener("DOMContentLoaded", function () {
    applyType();
    if (parentDoc) {
      new MutationObserver(function () { applyTheme(); setTimeout(applyType, 0); })
        .observe(parentDoc.documentElement, { attributes: true, attributeFilter: ["data-theme", "class"] });
    }
    var holder = document.getElementById("frame-root");
    function fit() {
      var h = Math.ceil(holder.getBoundingClientRect().height);
      if (window.frameElement && h > 0) window.frameElement.style.height = h + "px";
    }
    if (window.ResizeObserver) new ResizeObserver(fit).observe(holder);
    window.addEventListener("load", fit);
    window.addEventListener("resize", fit);
    fit();
  });
})();</script>
<script src="https://cdn.jsdelivr.net/npm/plotly.js@3.0.1/dist/plotly.min.js" integrity="sha256-oy6Be7Eh6eiQFs5M7oXuPxxm9qbJXEtTpfSI93dW16Q=" crossorigin="anonymous"></script>

<style>
  #text-results { margin: 1.5rem 0 2rem; min-width: 0; container-type: inline-size; scroll-margin-top: 5rem; }
  #text-results [hidden] { display: none !important; }
  #text-results .schedule-key { display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 0.5rem 1.5rem; margin-top: 1.25rem; font-size: 0.85rem; color: var(--global-text-color, #17181a); }
  #text-results .key-row { display: grid; grid-template-columns: max-content minmax(0, 1fr); align-items: start; gap: 0.5rem; }
  #text-results .key-label { color: var(--global-text-color, #17181a); font-weight: 700; }
  #text-results .key-items { display: flex; flex-wrap: wrap; gap: 0.5rem 0.75rem; }
  #text-results .key-item { display: inline-flex; align-items: center; gap: 0.35rem; }
  #text-results .swatch { width: 10px; height: 10px; flex: 0 0 10px; border-radius: 2px; }
  #text-results .metric-charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.25rem; }
  #text-results .chart-panel { min-width: 0; }
  #text-results .chart-title { margin: 0 0 0.35rem; text-align: center; font-size: 1.05rem; font-weight: 700; color: var(--global-text-color, #17181a); }
  #text-results .chart { width: 100%; height: 280px; }
  #text-results .load-status { margin: 0.75rem 0 0; font-size: 0.8rem; color: var(--global-text-color-light, #6b7280); }
  #text-results .load-status:empty { display: none; }
  #text-results .retry { margin-top: 0.5rem; }
  #text-results details { margin-top: 1.5rem; padding-top: 0.85rem; border-top: 1px solid var(--global-divider-color, #d1d5db); }
  #text-results summary { width: fit-content; cursor: pointer; font-size: 0.9rem; font-weight: 500; }
  #text-results .full-table { overflow-x: auto; margin-top: 1rem; }
  #text-results table { width: 100%; margin: 0; border-collapse: collapse; font-size: 0.8rem; font-variant-numeric: tabular-nums; }
  #text-results th, #text-results td { padding: 0.55rem 0.65rem; text-align: left; white-space: nowrap; }
  #text-results thead th { border-top: 3px solid currentColor; border-bottom: 3px solid currentColor !important; }
  #text-results tbody td { border-top: 0; border-bottom: 0; }
  #text-results .model-group-start:not(:first-child) td { border-top: 2px solid currentColor; }
  #text-results tbody tr:last-child td { border-bottom: 2px solid currentColor !important; }
  #text-results .metric-cell { text-align: right; }
  #text-results summary:focus-visible, #text-results .full-table:focus-visible, #text-results .retry:focus-visible { outline: 2px solid var(--global-theme-color, #2f5d50); outline-offset: 2px; }
  @media (max-width: 652px) { #text-results .metric-charts { grid-template-columns: minmax(0, 1fr); } }
  @container (max-width: 620px) { #text-results .metric-charts { grid-template-columns: minmax(0, 1fr); } }
</style>

<script>
  (() => {
    const root = document.getElementById("text-results");
    const results = JSON.parse(root.querySelector(".metrics-data").textContent);
    const interactive = root.querySelector(".interactive-metrics");
    const charts = Array.from(root.querySelectorAll(".chart"));
    const status = root.querySelector(".load-status");
    const retry = root.querySelector(".retry");
    const details = root.querySelector("details");
    const schedules = ["Log-linear", "Cosine", "Cosine (DUO)"];
    const colors = { "Log-linear": "#e69f00", Cosine: "#a855f7", "Cosine (DUO)": "#0f9e9e" };
    const models = [...new Set(results.map((row) => row.model))];
    let renderQueue = Promise.resolve();
    let observersReady = false;

    const legend = root.querySelector(".schedule-key");
    const row = document.createElement("div");
    row.className = "key-row";
    const label = document.createElement("span");
    label.className = "key-label";
    label.textContent = "Evaluation Schedule:";
    const items = document.createElement("div");
    items.className = "key-items";
    schedules.forEach((schedule) => {
      const item = document.createElement("span");
      item.className = "key-item";
      const swatch = document.createElement("span");
      swatch.className = "swatch";
      swatch.style.backgroundColor = colors[schedule];
      swatch.setAttribute("aria-hidden", "true");
      item.append(swatch, schedule);
      items.appendChild(item);
    });
    row.append(label, items);
    legend.appendChild(row);

    function render() {
      const job = renderQueue.then(async () => {
        const style = getComputedStyle(root);
        const color = style.getPropertyValue("--global-text-color").trim() || "#17181a";
        const grid = style.getPropertyValue("--global-divider-color").trim() || "#d1d5db";
        const background = style.getPropertyValue("--global-bg-color").trim() || "#fff";
        for (const chart of charts) {
          const metric = chart.dataset.metric;
          const metricLabel = metric === "ppl" ? "GPT-2 PPL" : "MAUVE";
          const precision = metric === "ppl" ? 2 : 4;
          const traces = schedules.map((schedule) => {
            const rows = models.map((model) => results.find((result) => result.model === model && result.schedule === schedule));
            return {
              type: "bar", name: schedule, x: models.map((_, index) => index), y: rows.map((result) => Number(result[metric])),
              marker: { color: colors[schedule] },
              customdata: rows.map((result) => [result.model, result.schedule]),
              hovertemplate: "%{y}<extra></extra>",
            };
          });
          const size = chart.getBoundingClientRect();
          const maximum = Math.max(...results.map((result) => Number(result[metric])));
          await Plotly.react(chart, traces, {
            width: Math.round(size.width), height: Math.round(size.height), margin: { l: 50, r: 6, t: 8, b: 52 },
            font: { family: style.fontFamily, size: 11, color },
            paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
            barmode: "group", bargap: 0.25, bargroupgap: 0.08, showlegend: false, hovermode: "closest", dragmode: false,
            hoverlabel: { bgcolor: background, bordercolor: grid, font: { size: 13, color } },
            xaxis: {
              range: [-0.5, models.length - 0.5], tickvals: models.map((_, index) => index), ticktext: models,
              fixedrange: true, showgrid: false, zeroline: false, tickangle: 0, tickfont: { size: 11 }, automargin: true,
              title: { text: "Model", standoff: 10, font: { size: 11 } },
            },
            yaxis: {
              range: [0, metric === "mauve" ? 1 : maximum * 1.12], fixedrange: true, gridcolor: grid, zerolinecolor: grid, nticks: 5, automargin: true,
              title: { text: metric === "ppl" ? "GPT-2 perplexity (PPL) \u2193" : "MAUVE \u2191", standoff: 8, font: { size: 11 } },
            },
          }, { displayModeBar: false, displaylogo: false, scrollZoom: false });
        }
      });
      renderQueue = job.catch(() => {});
      return job;
    }

    function fail() {
      root.setAttribute("aria-busy", "false");
      interactive.hidden = true;
      details.open = true;
      status.textContent = "Charts unavailable. Full results are shown in the table below.";
      retry.hidden = false;
    }

    async function ensurePlotly() {
      if (window.Plotly) return;
      const library = document.querySelector('script[src*="plotly.js@"]');
      if (!library) throw new Error("Plotly is unavailable");
      await new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = library.src;
        script.integrity = library.integrity;
        script.crossOrigin = library.crossOrigin;
        script.async = true;
        script.addEventListener("load", resolve, { once: true });
        script.addEventListener("error", reject, { once: true });
        document.head.appendChild(script);
      });
    }

    async function initialize() {
      retry.hidden = true;
      root.setAttribute("aria-busy", "true");
      status.textContent = "Loading charts...";
      try {
        await ensurePlotly();
        interactive.hidden = false;
        await render();
        root.setAttribute("aria-busy", "false");
        status.textContent = "";
        details.open = false;
        if (observersReady) return;
        const resizeObserver = new ResizeObserver((entries) => {
          entries.forEach(({ target, contentRect }) => {
            const width = Math.round(contentRect.width);
            const height = Math.round(contentRect.height);
            if (target.layout && width > 0 && height > 0 && (target.layout.width !== width || target.layout.height !== height)) {
              Plotly.relayout(target, { width, height }).catch(fail);
            }
          });
        });
        charts.forEach((chart) => resizeObserver.observe(chart));
        new MutationObserver(() => render().catch(fail)).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme", "class"] });
        observersReady = true;
      } catch (error) {
        fail();
      }
    }

    retry.addEventListener("click", initialize);
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", initialize, { once: true });
    else initialize();
  })();
</script>
