<script>(function () {
  var root = document.documentElement, parentDoc = null;
  try { if (window.parent && window.parent !== window) parentDoc = window.parent.document; } catch (e) {}
  function applyTheme() {
    var t = parentDoc ? parentDoc.documentElement.getAttribute("data-theme") : null;
    if (t !== "dark" && t !== "light") {
      t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    if (root.getAttribute("data-theme") !== t) root.setAttribute("data-theme", t);
  }
  function applyType() {
    if (!parentDoc) return;
    var view = parentDoc.defaultView;
    var article = parentDoc.querySelector("d-article") || parentDoc.body;
    var a = view.getComputedStyle(article), r = view.getComputedStyle(parentDoc.documentElement);
    root.style.fontSize = r.fontSize;
    root.style.fontFamily = a.fontFamily;
    document.body.style.fontSize = a.fontSize;
    document.body.style.lineHeight = a.lineHeight;
    document.body.style.fontWeight = a.fontWeight;
    document.body.style.fontFamily = a.fontFamily;
    document.body.style.color = "var(--global-text-color)";
  }
  applyTheme();
  document.addEventListener("DOMContentLoaded", function () {
    applyType();
    if (parentDoc) {
      new MutationObserver(function () { applyTheme(); setTimeout(applyType, 0); })
        .observe(parentDoc.documentElement, { attributes: true, attributeFilter: ["data-theme", "class"] });
    }
    var holder = document.getElementById("frame-root");
    function fit() {
      var h = Math.ceil(holder.getBoundingClientRect().height);
      if (window.frameElement && h > 0) window.frameElement.style.height = h + "px";
    }
    if (window.ResizeObserver) new ResizeObserver(fit).observe(holder);
    window.addEventListener("load", fit);
    window.addEventListener("resize", fit);
    fit();
  });
})();</script>

<script>
  (() => {
    const figure = document.getElementById("cifar10-diffusion");
    const selector = figure.querySelector(".class-selector");
    const buttons = Array.from(selector.querySelectorAll("button"));
    const slider = figure.querySelector("input[type='range']");
    const timeOutput = figure.querySelector("output");
    const status = figure.querySelector("#cifar10-load-status");
    const retry = figure.querySelector("#cifar10-retry");
    const images = new Map();
    const manifestURL = new URL(figure.dataset.manifest, window.location.href);
    const curvesURL = new URL(figure.dataset.curves, window.location.href);
    const charts = Array.from(figure.querySelectorAll(".schedule-chart"));
    let manifest;
    let scheduleCurves;
    let chartsReady = false;
    let resizeObserver;
    let themeObserver;
    let selectedClass = "airplane";
    let selectedFrame = 0;
    let selectedTime = 0.5;
    let request = 0;
    let renderQueue = Promise.resolve();

    function nearestFrame(time) {
      return manifest.times.reduce((best, value, index, times) => (
        Math.abs(value - time) < Math.abs(times[best] - time) ? index : best
      ), 0);
    }

    function scheduleValue(trace, time) {
      const times = scheduleCurves.times;
      let low = 0;
      let high = times.length - 1;
      while (high - low > 1) {
        const middle = Math.floor((low + high) / 2);
        if (times[middle] <= time) low = middle;
        else high = middle;
      }
      const fraction = (time - times[low]) / (times[high] - times[low]);
      return trace.values[low] * (1 - fraction) + trace.values[high] * fraction;
    }

    function displayProgress() {
      selectedTime = 1 - Number(slider.value) / manifest.sampling_steps;
      selectedFrame = nearestFrame(selectedTime);
      displayFrame();
    }

    function imageURL(folder, index) {
      return new URL(`${folder}/${String(index).padStart(2, "0")}.webp`, manifestURL).href;
    }

    function loadImage(url) {
      if (!images.has(url)) {
        const image = new Image();
        image.src = url;
        const promise = image.decode().then(() => image).catch((error) => {
          images.delete(url);
          throw error;
        });
        images.set(url, promise);
      }
      return images.get(url);
    }

    async function loadJSON(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error("Could not load trajectory data");
      return response.json();
    }

    async function ensurePlotly() {
      if (window.Plotly) return;
      const library = document.querySelector('script[src*="plotly.js@"]');
      if (!library) throw new Error("Plotly is unavailable");
      await new Promise((resolve, reject) => {
        const script = library.cloneNode(false);
        script.async = true;
        script.addEventListener("load", resolve, { once: true });
        script.addEventListener("error", reject, { once: true });
        document.head.appendChild(script);
      });
    }

    function chartTheme() {
      const style = getComputedStyle(figure);
      return {
        color: style.getPropertyValue("--global-text-color").trim() || "#263238",
        grid: style.getPropertyValue("--global-divider-color").trim() || "#e4e7eb",
        background: style.getPropertyValue("--global-bg-color").trim() || "#fff",
        font: style.fontFamily,
      };
    }

    async function createCharts() {
      const theme = chartTheme();
      const time = selectedTime;
      await Promise.all(charts.map(async (chart) => {
        const family = scheduleCurves[chart.dataset.family];
        const hovertemplate = `<b>%{fullData.name}</b><br>t = %{x:.3f}<br>${family.title} = %{y:.3f}<extra></extra>`;
        const lines = family.traces.map((trace) => ({
          type: "scatter", mode: "lines", name: trace.name,
          x: scheduleCurves.times, y: trace.values,
          line: { color: trace.color, width: 2 }, hovertemplate,
        }));
        const markers = family.traces.map((trace) => ({
          type: "scatter", mode: "markers", name: trace.name,
          x: [time], y: [scheduleValue(trace, time)],
          marker: { color: trace.color, size: 7, line: { color: theme.background, width: 1 } }, hovertemplate,
        }));
        const size = chart.getBoundingClientRect();
        const axis = {
          fixedrange: true, showline: false, zeroline: false,
          gridcolor: theme.grid, tickfont: { size: 10 }, ticklen: 0,
        };
        await Plotly.newPlot(chart, [...lines, ...markers], {
          width: Math.round(size.width), height: Math.round(size.height),
          margin: { l: 42, r: 5, t: 6, b: 28 },
          font: { family: theme.font, size: 10, color: theme.color },
          paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
          showlegend: false, hovermode: "closest", hoverdistance: 25, dragmode: false,
          hoverlabel: { bgcolor: theme.background, bordercolor: theme.grid, font: { size: 11 } },
          xaxis: { ...axis, range: [0, 1], tickvals: [0, 0.5, 1], title: { text: "t", standoff: 0, font: { size: 10 } } },
          yaxis: { ...axis, range: family.range, tickvals: family.ticks, automargin: true, title: { text: family.title, standoff: 2, font: { size: 10 } } },
          shapes: [{ type: "line", x0: time, x1: time, y0: 0, y1: 1, yref: "paper", line: { color: theme.color, width: 1, dash: "dot" }, opacity: 0.35 }],
        }, { displayModeBar: false, displaylogo: false, scrollZoom: false });
        chart.dataset.frame = String(selectedFrame);
        chart.dataset.time = String(time);
        chart.removeAllListeners("plotly_click");
        chart.on("plotly_click", (event) => {
          if (!event.points.length) return;
          slider.value = String(Math.max(0, Math.min(manifest.sampling_steps, Math.round((1 - event.points[0].x) * manifest.sampling_steps))));
          displayProgress();
        });
      }));
      figure.querySelectorAll(".model-title").forEach((title) => {
        title.style.setProperty("--curve-color", scheduleCurves[title.dataset.family].traces[Number(title.dataset.trace)].color);
      });
      if (resizeObserver) resizeObserver.disconnect();
      resizeObserver = new ResizeObserver((entries) => {
        entries.forEach(({ target, contentRect }) => {
          const width = Math.round(contentRect.width);
          const height = Math.round(contentRect.height);
          if (width > 0 && height > 0 && (target.layout.width !== width || target.layout.height !== height)) {
            Plotly.relayout(target, { width, height });
          }
        });
      });
      charts.forEach((chart) => resizeObserver.observe(chart));
      if (themeObserver) themeObserver.disconnect();
      themeObserver = new MutationObserver(() => {
        const theme = chartTheme();
        charts.forEach((chart) => Plotly.relayout(chart, {
          "font.color": theme.color, "xaxis.gridcolor": theme.grid, "yaxis.gridcolor": theme.grid,
          "hoverlabel.bgcolor": theme.background, "hoverlabel.bordercolor": theme.grid,
          "shapes[0].line.color": theme.color,
        }));
      });
      themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme", "class"] });
      chartsReady = true;
    }

    async function updateMarkers(time) {
      await Promise.all(charts.map(async (chart) => {
        if (Number(chart.dataset.time) === time) return;
        const family = scheduleCurves[chart.dataset.family];
        await Plotly.restyle(chart, {
          x: [[time], [time], [time]],
          y: family.traces.map((trace) => [scheduleValue(trace, time)]),
        }, [3, 4, 5]);
        await Plotly.relayout(chart, { "shapes[0].x0": time, "shapes[0].x1": time });
        chart.dataset.time = String(time);
        chart.dataset.frame = String(nearestFrame(time));
      }));
    }

    async function displayFrame() {
      const currentRequest = ++request;
      const className = selectedClass;
      const index = selectedFrame;
      const time = selectedTime;
      const modelURL = imageURL(className, index);
      figure.setAttribute("aria-busy", "true");
      status.textContent = "Loading...";
      retry.hidden = true;
      try {
        await loadImage(modelURL);
        if (currentRequest !== request) return;
        // Finish each chart/image pair before another update can change its markers.
        const render = renderQueue.then(async () => {
          if (currentRequest !== request) return;
          await updateMarkers(time);
          figure.style.setProperty("--frame-models", `url("${modelURL}")`);
          figure.dataset.class = className;
          figure.dataset.frame = String(index);
          figure.dataset.time = String(time);
          figure.dataset.frameTime = String(manifest.times[index]);
          figure.querySelectorAll(".plot-image").forEach((image) => { image.title = `Cached image at t \u2248 ${manifest.times[index].toFixed(3)}`; });
          buttons.forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.class === className)));
          timeOutput.textContent = `t = ${time.toFixed(3)}`;
          const progress = Math.round((1 - time) * 100);
          slider.setAttribute("aria-valuetext", `Sampling progress ${progress}%, time ${time.toFixed(3)}`);
          if (currentRequest === request) {
            status.textContent = "";
            figure.setAttribute("aria-busy", "false");
          }
          for (const neighbor of [index - 1, index + 1]) {
            if (neighbor >= 0 && neighbor < manifest.frame_count) {
              loadImage(imageURL(className, neighbor)).catch(() => {});
            }
          }
        });
        renderQueue = render.catch(() => {});
        await render;
      } catch (error) {
        if (currentRequest !== request) return;
        figure.setAttribute("aria-busy", "false");
        status.textContent = "Image unavailable.";
        retry.hidden = false;
      }
    }

    async function initialize() {
      retry.hidden = true;
      status.textContent = "Loading...";
      try {
        const [metadata, curves] = await Promise.all([loadJSON(manifestURL), loadJSON(curvesURL), ensurePlotly()]);
        if (metadata.frame_count !== 50 || metadata.times.length !== metadata.frame_count ||
            !curves.snapshot_times.every((time, index) => time === metadata.times[index])) {
          throw new Error("Invalid trajectory metadata");
        }
        manifest = metadata;
        scheduleCurves = curves;
        slider.max = String(manifest.sampling_steps);
        selectedTime = 1 - Number(slider.value) / manifest.sampling_steps;
        selectedFrame = nearestFrame(selectedTime);
        await createCharts();
        slider.disabled = false;
        selector.hidden = false;
        await displayFrame();
      } catch (error) {
        figure.setAttribute("aria-busy", "false");
        status.textContent = "Trajectories unavailable.";
        retry.hidden = false;
      }
    }

    slider.addEventListener("input", displayProgress);
    selector.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-class]");
      if (!button || !manifest.classes.includes(button.dataset.class)) return;
      selectedClass = button.dataset.class;
      displayFrame();
    });
    retry.addEventListener("click", () => chartsReady ? displayFrame() : initialize());
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initialize, { once: true });
    } else {
      initialize();
    }
  })();
</script>


</div>
</body>
</html>
