<script>(function () {
  var root = document.documentElement, parentDoc = null;
  try { if (window.parent && window.parent !== window) parentDoc = window.parent.document; } catch (e) {}
  function applyTheme() {
    var t = parentDoc ? parentDoc.documentElement.getAttribute("data-theme") : null;
    if (t !== "dark" && t !== "light") {
      t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    if (root.getAttribute("data-theme") !== t) root.setAttribute("data-theme", t);
    var light = document.getElementById("highlight_theme_light"), dark = document.getElementById("highlight_theme_dark");
    if (light && dark) { light.media = t === "dark" ? "none" : ""; dark.media = t === "dark" ? "" : "none"; }
  }
  function applyType() {
    if (!parentDoc) return;
    var view = parentDoc.defaultView;
    var article = parentDoc.querySelector("d-article") || parentDoc.body;
    var a = view.getComputedStyle(article), r = view.getComputedStyle(parentDoc.documentElement);
    root.style.fontSize = r.fontSize;
    root.style.fontFamily = a.fontFamily;
    // keep a relative line height relative: measure how it scales with the font size
    var lineHeight = a.lineHeight;
    if (parentDoc.querySelector("d-article")) {
      var probe = parentDoc.createElement("span");
      probe.style.fontSize = "100px";
      article.appendChild(probe);
      var probed = view.getComputedStyle(probe).lineHeight;
      article.removeChild(probe);
      if (probed !== lineHeight && probed.slice(-2) === "px") lineHeight = String(parseFloat(probed) / 100);
    }
    [document.body, document.querySelector("#frame-root > d-article")].forEach(function (target) {
      if (!target) return;
      target.style.fontSize = a.fontSize;
      target.style.lineHeight = lineHeight;
      target.style.fontWeight = a.fontWeight;
      target.style.fontFamily = a.fontFamily;
    });
    document.body.style.color = "var(--global-text-color)";
  }
  applyTheme();
  window.applyArticleType = applyType;
  document.addEventListener("DOMContentLoaded", function () {
    applyType();
    if (parentDoc) {
      new MutationObserver(function () { applyTheme(); setTimeout(applyType, 0); })
        .observe(parentDoc.documentElement, { attributes: true, attributeFilter: ["data-theme", "class"] });
    }
    var holder = document.getElementById("frame-root");
    function fit() {
      var h = Math.ceil(holder.getBoundingClientRect().height);
      if (window.frameElement && h > 0) window.frameElement.style.height = h + "px";
    }
    if (window.ResizeObserver) new ResizeObserver(fit).observe(holder);
    window.addEventListener("load", fit);
    window.addEventListener("resize", fit);
    fit();
  });
})();</script>

<section id="sudoku-diffusion" aria-label="Recorded MDM and ReMDM-conf Sudoku sampling" aria-busy="true">
  <div class="interactive-trajectory" hidden>
    <div class="trajectory-controls">
      <fieldset disabled><legend>Initial clues</legend><div class="puzzle-options"></div></fieldset>
      <fieldset disabled><legend>Evaluation Schedule</legend><div class="schedule-options"></div></fieldset>
    </div>
    <div class="trajectory-main">
      <div class="board-panel mdm" data-model="MDM">
        <h4><span class="model-dot" aria-hidden="true"></span>MDM</h4>
        <div class="sudoku-board" role="table" tabindex="0" aria-label="MDM Sudoku board"></div>
        <div class="board-stats"><span>Unmasked <strong class="unmasked-count"></strong></span><span title="Filled cells sharing a digit in a row, column or box">In conflict <strong class="conflict-count"></strong></span></div>
      </div>
      <div class="board-panel remdm" data-model="ReMDM">
        <h4><span class="model-dot" aria-hidden="true"></span>ReMDM-conf</h4>
        <div class="sudoku-board" role="table" tabindex="0" aria-label="ReMDM-conf Sudoku board"></div>
        <div class="board-stats"><span>Unmasked <strong class="unmasked-count"></strong></span><span title="Filled cells sharing a digit in a row, column or box">In conflict <strong class="conflict-count"></strong></span></div>
      </div>
      <div class="unmasking-panel">
        <div class="unmasking-plot">
          <div class="unmasking-chart" role="img" aria-label="Expected MDM and recorded revealed token counts across 50 sampling steps, excluding initial clues"></div>
          <svg class="unmasking-overlay" aria-hidden="true"></svg>
        </div>
        <ul class="curve-key" aria-label="Unmasking curve key"><li><span class="key-line" aria-hidden="true"></span>MDM</li><li><span class="key-line remdm-line" aria-hidden="true"></span>ReMDM-conf</li><li><span class="key-line expected-line" aria-hidden="true"></span>Expected</li></ul>
      </div>
    </div>
    <ul class="board-key" aria-label="Sudoku cell key">
      <li><span class="key-cell clue-key" aria-hidden="true">7</span>Clue</li>
      <li><span class="key-cell" aria-hidden="true">7</span>Generated</li>
      <li><span class="key-cell remasked-key" aria-hidden="true"></span>Remasked this step</li>
      <li><span class="key-cell conflict-key" aria-hidden="true">7</span>In conflict</li>
    </ul>
    <div class="slider-labels"><label for="sudoku-diffusion-time">Sampling progress</label><output class="time-value" for="sudoku-diffusion-time"></output></div>
    <input id="sudoku-diffusion-time" type="range" min="0" max="50" step="1" value="25" aria-describedby="sudoku-diffusion-endpoints" disabled>
    <div id="sudoku-diffusion-endpoints" class="slider-endpoints"><span>Clues only</span><span>Final sample</span></div>
  </div>
  <p class="load-status" role="status">Loading Sudoku examples...</p>
