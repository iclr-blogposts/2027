<script>
const $ = s => document.querySelector(s);
const D = JSON.parse($('#data').textContent);

const SCENARIOS = Object.keys(D.scenarios);
const CONTEXT_DEPTHS = [
  { id: 'clean', label: '0 Turns (Isolated)' },
  { id: 'short', label: '2 Turns (Short)' },
  { id: 'long', label: '4 Turns (Long)' }
];
const MARKERS = [
  { id: 'none', label: 'Implicit' },
  { id: 'mild', label: 'Conversational ("Also, ...")' },
  { id: 'explicit_deictic', label: 'Deictic Reset ("Apart from this...")' },
  { id: 'explicit_forward', label: 'Explicit Forward ("New topic...")' }
];

let curScenario = SCENARIOS[0];
let curContext = 'clean';
let curMarker = 'none';

const MARKER_TEXT = {
  none: '',
  mild: 'Also, ',
  explicit_deictic: 'Okay, apart from this, I am also working on another problem. ',
  explicit_forward: 'New unrelated topic: '
};

// Render Markdown + KaTeX LaTeX Math
function renderMarkdownAndMath(rawText) {
  if (!rawText) return '';
  let text = rawText;

  // 1. Render display math $$...$$
  text = text.replace(/\$\$([\s\S]+?)\$\$/g, (match, math) => {
    try {
      return typeof katex !== 'undefined' 
        ? katex.renderToString(math.trim(), { displayMode: true, throwOnError: false })
        : match;
    } catch(e) {
      return match;
    }
  });

  // 2. Render inline math $...$ (avoiding pure currency like $10 or $ Stripe)
  text = text.replace(/\$([^\$\n]+?)\$/g, (match, math) => {
    if (/^\s|\s$/.test(math) || /^\d+(\.\d+)?$/.test(math)) return match;
    try {
      return typeof katex !== 'undefined'
        ? katex.renderToString(math.trim(), { displayMode: false, throwOnError: false })
        : match;
    } catch(e) {
      return match;
    }
  });

  // 3. Parse Markdown using marked
  if (typeof marked !== 'undefined' && typeof marked.parse === 'function') {
    marked.setOptions({ breaks: true, gfm: true });
    return marked.parse(text);
  }

  // Fallback simple linebreaks
  return text.replace(/\n/g, '<br>');
}

// Highlight intrusion keywords on DOM text nodes without breaking HTML/KaTeX tags
function highlightKeywords(container, keywords) {
  if (!keywords || !keywords.length) return;
  const sortedKeywords = [...new Set(keywords)].sort((a, b) => b.length - a.length);
  const patternStr = sortedKeywords.map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
  const splitRegex = new RegExp('(' + patternStr + ')', 'i');
  const matchRegex = new RegExp('^(' + patternStr + ')$', 'i');

  const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      if (node.parentElement && (node.parentElement.closest('.katex') || node.parentElement.closest('mark'))) {
        return NodeFilter.FILTER_REJECT;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  });

  const nodesToReplace = [];
  while (walker.nextNode()) {
    if (splitRegex.test(walker.currentNode.nodeValue)) {
      nodesToReplace.push(walker.currentNode);
    }
  }

  nodesToReplace.forEach(node => {
    const parent = node.parentNode;
    if (!parent) return;
    const parts = node.nodeValue.split(splitRegex);
    const fragment = document.createDocumentFragment();
    parts.forEach(part => {
      if (matchRegex.test(part)) {
        const mark = document.createElement('mark');
        mark.textContent = part;
        fragment.appendChild(mark);
      } else if (part) {
        fragment.appendChild(document.createTextNode(part));
      }
    });
    parent.replaceChild(fragment, node);
  });
}

function getActiveRunKey() {
  if (curContext === 'clean') return 'clean';
  return curContext + '_' + curMarker;
}

function renderControls() {
  // Scenario pills
  $('#scenario-pills').innerHTML = SCENARIOS.map(sc => {
    const s = D.scenarios[sc];
    const isAct = sc === curScenario;
    return `<button class="pill" aria-pressed="${isAct}" data-sc="${sc}">${s.title}</button>`;
  }).join('');

  // Context pills
  $('#context-pills').innerHTML = CONTEXT_DEPTHS.map(cd => {
    const isAct = cd.id === curContext;
    return `<button class="pill" aria-pressed="${isAct}" data-ctx="${cd.id}">${cd.label}</button>`;
  }).join('');

  // Marker pills (disabled if clean)
  const isClean = curContext === 'clean';
  $('#marker-pills').innerHTML = MARKERS.map(m => {
    const isAct = !isClean && m.id === curMarker;
    return `<button class="pill" aria-pressed="${isAct}" data-m="${m.id}" ${isClean ? 'disabled title="N/A for 0 Turns (Isolated)"' : ''}>${m.label}</button>`;
  }).join('');
}

function render() {
  renderControls();
  const scData = D.scenarios[curScenario];
  const runKey = getActiveRunKey();
  const activeRun = scData.runs[runKey] || scData.runs.clean;

  // Meta bar
  let d = '';
  try { d = new Date(D.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }); } catch(e) {}
  $('#meta').textContent = `${D.model_id} · Greedy decoding (temp=${D.temperature}) · Max ${D.max_tokens} tokens${d ? ' · ' + d : ''}`;

  // Banner verdict classes
  const b = $('#banner');
  b.className = 'banner';
  let vClass = 'badge-clean';
  let vLabel = 'CLEAN BASELINE';
  if (activeRun.verdict === 'RESET_SUCCESS') { vClass = 'badge-reset'; vLabel = 'RESET SUCCESS'; }
  else if (activeRun.verdict === 'SUBTLE_LEAKAGE') { vClass = 'badge-leakage'; vLabel = 'SUBTLE LEAKAGE'; }
  else if (activeRun.verdict === 'ATTENTION_BREAKDOWN') { vClass = 'badge-breakdown'; vLabel = 'ATTENTION BREAKDOWN'; }
  else { vClass = 'badge-clean'; vLabel = 'CLEAN BASELINE'; }
  b.classList.add(vClass);

  $('#verdict-tag').textContent = vLabel;
  $('#prescribed-text').textContent = activeRun.prescribed_summary;
  $('#mech-text').textContent = activeRun.mechanistic_annotation;

  // Pane Header
  const condTag = curContext === 'clean' ? '0 turns' : (curContext === 'short' ? '2 turns' : '4 turns');
  const markerName = curContext === 'clean' ? 'No Prior Context' : MARKERS.find(m => m.id === curMarker).label;
  $('#pane-title').textContent = `${scData.title} · Context: ${condTag} · Marker: ${markerName}`;
  $('#pane-tag').textContent = `${activeRun.prompt_tokens} prompt tokens`;

  let chatHtml = '';

  // 1. Render Prior Continuous Conversation Messages
  if (curContext !== 'clean') {
    const hist = curContext === 'short' ? scData.prior_context_short : scData.prior_context_long;
    hist.forEach(m => {
      const isU = m.role === 'user';
      chatHtml += `<div class="msg ${isU ? 'u prior-u' : 'a prior-a'} prior-msg">${renderMarkdownAndMath(m.content)}</div>`;
    });
    chatHtml += `<div class="chat-divider"><span>Target Query · ${condTag} prior discussion</span></div>`;
  }

  // 2. User Target Query with highlighted transition marker
  let prefix = curContext === 'clean' ? '' : MARKER_TEXT[curMarker];
  let prefixHtml = prefix ? `<span class="marker-highlight">${prefix}</span>` : '';
  chatHtml += `<div class="msg u target-u">${prefixHtml}${renderMarkdownAndMath(scData.target_query)}</div>`;

  // 3. Model Response
  const isCut = !/[.!?]\s*$/.test(activeRun.output.trim());
  chatHtml += `<div class="msg a target-a" id="target-response-bubble">${renderMarkdownAndMath(activeRun.output)}${isCut ? '<div class="cut-note">[Response cut at token limit]</div>' : ''}</div>`;
  
  const chatEl = $('#chat');
  chatEl.innerHTML = chatHtml;

  // Apply intrusion keyword highlights safely on the assistant target response bubble
  const targetBubble = $('#target-response-bubble');
  if (targetBubble && activeRun.intrusions) {
    highlightKeywords(targetBubble, activeRun.intrusions);
  }
  
  // Smoothly scroll container so the user sees the target query and answer
  chatEl.scrollTop = chatEl.scrollHeight;
}

// Listeners
$('#scenario-pills').addEventListener('click', e => {
  const b = e.target.closest('.pill');
  if (b && b.dataset.sc) { curScenario = b.dataset.sc; render(); }
});

$('#context-pills').addEventListener('click', e => {
  const b = e.target.closest('.pill');
  if (b && b.dataset.ctx) { curContext = b.dataset.ctx; render(); }
});

$('#marker-pills').addEventListener('click', e => {
  const b = e.target.closest('.pill');
  if (b && b.dataset.m) { curMarker = b.dataset.m; render(); }
});

render();
</script>
