<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Confidence across two answer orders</title><style>body{margin:0;padding:4px 6px}.threshold-plate,.threshold-plate *{box-sizing:border-box}
.threshold-plate{font:400 16px/1.45 Georgia,'Times New Roman',serif;color:#1e2423;background:#fff;width:100%;margin:0 auto;padding:0;border:0;text-align:left}
.threshold-plate .tp-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:4px 15px;border-top:2px solid #283330;padding-top:12px}
.threshold-plate h2{font:400 26px/1.18 Georgia,'Times New Roman',serif;letter-spacing:-.035em;margin:0;color:#192823}
.threshold-plate .tp-head p{font:400 12px/1.4 system-ui,sans-serif;color:#4d5552;margin:0;font-variant-numeric:tabular-nums}
.tp-panels{display:flex;align-items:start;gap:14px;margin:12px 0 0}.tp-panel{flex:1;min-width:0}
.threshold-plate .tp-panel img{display:block;width:100%;height:auto;margin:0}
.threshold-plate .tp-panel p{font:400 clamp(16px,2.2vw,22px)/1.22 Georgia,'Times New Roman',serif;text-align:center;margin:5px 0 13px}
.tp-panel p span{font-size:.88em;margin-right:.25em}.tp-map{position:relative;cursor:crosshair}
.tp-ring{pointer-events:none;position:absolute;width:12px;height:12px;border:2px solid #101c22;border-radius:50%;box-shadow:0 0 0 2px white;transform:translate(-50%,-50%)}.tp-ring[hidden]{display:none}
.threshold-plate figcaption{border-top:1px solid #c9cfca;padding:10px 0 0;margin:0;font:400 16px/1.48 Georgia,'Times New Roman',serif;color:#2a302c}
.threshold-plate figcaption strong{color:#14251e}.tp-inspect{margin:7px 0 0;max-width:none}
.threshold-plate .tp-inspect summary{width:fit-content;cursor:pointer;font:540 12px/1.4 system-ui,sans-serif;color:#35483d;padding:3px 0}
.tp-inputs{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding:9px 0 0;font:400 13px/1.5 system-ui,sans-serif}.tp-inputs select{font:inherit;padding:3px 5px;color:#182d24;border:1px solid #aebbb3;background:white;border-radius:3px}
.tp-inputs output{font-weight:650;font-variant-numeric:tabular-nums}
@media(max-width:630px){.tp-panels{display:block;margin-top:9px}.tp-panel{max-width:460px;margin:0 auto}.threshold-plate .tp-panel p{font-size:18px;margin:4px 0 18px}.threshold-plate h2{font-size:24px}.threshold-plate figcaption{font-size:15px}.tp-inputs{gap:7px 12px}}
@media print{.tp-inspect{display:none}}
.threshold-plate{--positive:#007c76;--negative:#be5036;--stable:#556387;--pale:#e7edf1;color:#192439}
.threshold-plate .tp-head{display:block;border-color:#192439;padding-top:14px}.threshold-plate h2{font-size:clamp(25px,3.1vw,35px)}.threshold-plate .tp-head p{margin-top:7px;color:#465669}
.tp-panels{margin-top:20px;gap:25px}.threshold-plate h3{font:400 clamp(17px,1.95vw,23px)/1.22 Georgia,serif;margin:0 0 6px;color:#192439;letter-spacing:-.025em}.threshold-plate h3>span{font-size:.83em;color:#546274;margin-right:.32em}
.tp-surface{position:relative}.tp-surface-ring{position:absolute;transform:translate(-50%,-50%);width:13px;height:13px;pointer-events:none;box-shadow:0 0 0 2px white;border:2.4px solid #142649;border-radius:50%;transition:left .16s ease-out,top .16s ease-out}.tp-outcomes{border-top:1px solid #c8d2da;padding:12px 0;margin-top:8px}.tp-kicker{font:400 12px/1.45 system-ui,sans-serif;margin:2px 0 13px;color:#49596b}
.tp-tasks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(13px,4vw,48px)}.threshold-plate h4{font:650 14px/1.4 system-ui,sans-serif;margin:0 0 7px;color:#192439}
.tp-matrix{display:grid;grid-template-columns:12px repeat(8,minmax(0,1fr));grid-template-rows:repeat(6,12px);gap:3px}
.tp-gold{font:400 9px/12px system-ui,sans-serif;color:#53606e;text-align:left}
.tp-cell,.tp-key i{--tile:var(--pale);background:var(--tile)!important;border:none!important;box-shadow:none;padding:0;position:relative;border-radius:1px;min-width:0;min-height:0}
.tp-cell{cursor:pointer;transition:background-color .18s ease-out}.tp-cell[data-state="1"],.tp-key i[data-state="1"]{--tile:var(--positive)}.tp-cell[data-state="2"],.tp-key i[data-state="2"]{--tile:var(--negative)}.tp-cell[data-state="3"],.tp-key i[data-state="3"]{--tile:var(--stable)}
.tp-cell[data-state="1"]::after,.tp-cell[data-state="2"]::after,.tp-key i[data-state="1"]::after,.tp-key i[data-state="2"]::after{content:'−';position:absolute;inset:0;display:grid;place-items:center;color:white;font:650 10px/1 system-ui,sans-serif}.tp-cell[data-state="1"]::after,.tp-key i[data-state="1"]::after{content:'+'}
.tp-cell:hover,.tp-cell:focus-visible,.tp-cell[aria-pressed="true"]{outline:2px solid #192439;outline-offset:1px;z-index:1}
.tp-total,.tp-key,.tp-item{font:400 12px/1.45 system-ui,sans-serif}.tp-total{display:block;margin-top:5px;color:#354055}.tp-key{display:flex;gap:5px 18px;flex-wrap:wrap;margin:13px 0 0;color:#344258}.tp-key span{display:inline-flex;align-items:center;gap:6px}.tp-key i{display:inline-block;width:12px;height:12px}
.tp-item{border-left:2px solid #556387;padding-left:10px;margin:10px 0 0}.tp-item strong,.tp-item span{display:block}.tp-inspect{margin:0 0 9px}
@media(max-width:630px){.tp-tasks{grid-template-columns:1fr;gap:13px}.tp-task{display:grid;grid-template-columns:minmax(85px,.65fr) minmax(0,1.6fr);column-gap:9px;align-items:start}.tp-task h4,.tp-task .tp-total{grid-column:1}.tp-task .tp-matrix{grid-column:2;grid-row:1/3;grid-template-rows:repeat(6,10px)}.tp-task .tp-total{align-self:end}.tp-panels{margin-top:15px}.tp-panels h3{margin-top:11px}.tp-panel{max-width:none}.threshold-plate h3{font-size:19px}}
@media(prefers-reduced-motion:reduce){.tp-cell,.tp-surface-ring{transition:none}}
.tp-task svg.tp-matrix{display:block;width:100%;height:auto;overflow:visible}.tp-cell:focus,.tp-cell:hover,.tp-cell[aria-pressed=true]{outline:0}.tp-cell:focus-visible rect,.tp-cell:hover rect,.tp-cell[aria-pressed=true] rect{stroke:#1a2841;stroke-width:1.75px}.tp-cell rect{transition:fill .16s ease-out}.tp-cell{outline:0}.tp-key span{white-space:nowrap}
@media(prefers-reduced-motion:reduce){.tp-cell rect{transition:none}}
@media(max-width:630px){.tp-tasks{display:block}.tp-task{display:block;margin:10px 0 14px}.tp-task svg.tp-matrix{max-width:355px}.tp-task .tp-total{font-size:11px}.tp-task h4{margin-bottom:4px}}
.threshold-plate .tp-tasks{gap:clamp(10px,2.8vw,30px)}.tp-task .trajectory{max-width:none;height:auto;width:100%;overflow:visible}.trajectory text{font:9px system-ui,sans-serif;fill:#475767}.trajectory .tp-cell{cursor:pointer}.trajectory .tp-cell:hover .trace-ink,.trajectory .tp-cell:focus .trace-ink,.trajectory .tp-cell[aria-pressed=true] .trace-ink{opacity:1}.trajectory .tp-cell:hover .trace-segment,.trajectory .tp-cell:focus .trace-segment,.trajectory .tp-cell[aria-pressed=true] .trace-segment{stroke:#182943;stroke-width:2.8}.tp-task .tp-total{text-align:center;font-variant-numeric:tabular-nums;color:#304454}.vector-key{display:flex;flex-wrap:wrap;gap:5px 20px;margin:10px 0;font:500 12px/1.5 system-ui;color:#4e6071}.vector-key span::before{content:'';display:inline-block;vertical-align:middle;width:18px;height:2px;margin-right:5px;background:#99a9b4}.vector-key .positive::before{background:#007c76}.vector-key .negative::before{background:#bb4b32}@media(max-width:630px){.tp-task .trajectory{max-width:390px;margin:0 auto}.tp-task h4{text-align:left}}
