<title>Projected Phi, exact mean pair agreement, and uncertain systems by number of items</title>

<style>

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; overflow: hidden;
    padding: 10px 12px 8px; background: var(--bg); color: var(--fg); color-scheme: light;

  select { padding: 2px 4px; border: 1px solid var(--border); border-radius: 4px; background: #fff; }

  .cutctl input { margin: 0; }

  .legend > span > svg, .marks > span > svg { flex: none; }

  .marks b { color: var(--fg); font-weight: 600; }
  .marks button {
    padding: 0 7px; border: 1px solid var(--border); border-radius: 4px; background: var(--btn);

  }
  .marks button:hover { background: #eaeef2; }
  .note { margin-top: 4px; font-size: 12px; color: var(--muted); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;

  svg text { font-size: 12px; fill: var(--muted); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .target { stroke: var(--target); stroke-width: 1.2; stroke-dasharray: 2 3; }
  .s-phi, .s-agree, .s-unc { fill: none; stroke-linejoin: round; }

  .s-agree { stroke: var(--agree); stroke-width: 2; }

  .pt-unc { fill: var(--unc); stroke: #fff; stroke-width: 1.2; }
  .cursor { stroke: #24292f; stroke-width: 1; }
  .dot { stroke: #fff; stroke-width: 1.5; }

  .dot-agree { fill: var(--agree); }
  .dot-unc { fill: var(--unc); }

    bench: byId("bench"), logx: byId("logx"), pool: byId("pool"), chart: byId("chart"),
    svg: byId("svg"), plot: byId("plot"), title: byId("svgTitle"), desc: byId("svgDesc"),
    range: byId("nrange"), num: byId("nnum"), readout: byId("readout"), marks: byId("marks"),
    status: byId("status"), cuts: Array.from(document.querySelectorAll('input[name="cut"]')),
  };
  const state = { id: DEFAULT_ID, q: "q50", n: 1, log: true };
  let geom = null;

  const fmtInt = (n) => n.toLocaleString("en-US");
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  // Half-up percentages. Scaling to an integer first keeps exact ties (e.g. 529 / 2,000 = 26.45%) exact.
  const poolPct = (n, L) => (Math.round(1000 * n / L) / 10).toFixed(1);
  const uPct = (k, M) => (Math.round(10000 * k / M) / 100).toFixed(2);

  // Round for display, adding decimals if needed so rounding never moves a value across the 0.90 target.
  function near90(v, scale, digits) {
    for (let d = digits; d <= digits + 6; d++) {
      const s = (v * scale).toFixed(d);
      if ((parseFloat(s) / scale >= 0.9) === (v >= 0.9)) return s;
    }
    return String(v * scale);
  }

  // Agreement data for one cut: full curves (c, u) or, where no curve passed validation, the released
  // summary points only (pts: n -> [C, uncertain count] at the Phi, first and persistent counts).
  function view(id, q) {
    const d = DATA[id];
    if (q === "q50") return { cutTxt: d.cut.toFixed(3), first: d.first, persistent: d.persistent, c: d.c, u: d.u, pts: null };
    const a = d.alt[q];
    return { cutTxt: a.cutTxt, first: a.first, persistent: a.persistent, c: a.c || null, u: a.u || null, pts: a.pts || null };
  }
  function at(v, n) {
    if (v.c) return { c: v.c[n - 1], k: v.u[n - 1] };
    const p = v.pts[String(n)];
    return p ? { c: p[0], k: p[1] } : null;
  }

  function svgEl(name, attrs, parent) {
    const node = document.createElementNS(NS, name);
    for (const key of Object.keys(attrs)) node.setAttribute(key, String(attrs[key]));
    if (parent) parent.appendChild(node);
    return node;
  }

  function makeX(L, log, x0, x1) {
    if (log) {
      const k = (x1 - x0) / Math.log(L);
      return { f: (n) => x0 + Math.log(n) * k, inv: (px) => Math.exp((px - x0) / k) };
    }
    const k = (x1 - x0) / (L - 1);
    return { f: (n) => x0 + (n - 1) * k, inv: (px) => 1 + (px - x0) / k };
  }

  function xTicks(L, log, width) {
    if (log) {
      const base = width < 360 ? [1, 10, 100, 1000] : [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000];
      return base.filter((t) => t <= L);
    }
    const maxTicks = Math.max(3, Math.floor(width / 70));
    let step = 1000;
    for (const s of [50, 100, 200, 250, 500, 1000]) {
      if (L / s <= maxTicks) { step = s; break; }
    }
    const ticks = [1];
    for (let t = step; t <= L; t += step) ticks.push(t);
    return ticks;
  }

  function linePath(values, xs, ys) {
    let d = "";
    for (let i = 0; i < values.length; i++) {
      d += (i ? "L" : "M") + xs.f(i + 1).toFixed(1) + "," + ys(values[i]).toFixed(1);
    }
    return d;
  }

  function draw() {
    const d = DATA[state.id], v = view(state.id, state.q);
    const W = ui.chart.clientWidth, H = ui.chart.clientHeight;
    const g = ui.plot;
    g.textContent = "";
    if (W < 60 || H < 60) { geom = null; update(); return; }
    ui.svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    const x0 = 34, x1 = W - 20, y0 = H - 38, y1 = 8;
    const xs = makeX(d.L, state.log, x0, x1);
    const ys = (v) => y0 - v * (y0 - y1);

    for (const v of [0, 0.2, 0.4, 0.6, 0.8, 1]) {
      svgEl("line", { class: "grid", x1: x0, x2: x1, y1: ys(v), y2: ys(v) }, g);
      svgEl("text", { x: x0 - 6, y: ys(v) + 4, "text-anchor": "end" }, g).textContent =
        v === 0 || v === 1 ? String(v) : v.toFixed(1);
    }
    for (const t of xTicks(d.L, state.log, x1 - x0)) {
      const x = xs.f(t);
      svgEl("line", { class: "grid", x1: x, x2: x, y1: y1, y2: y0 }, g);
      svgEl("text", { x: x, y: y0 + 15, "text-anchor": "middle" }, g).textContent = fmtInt(t);
    }
    svgEl("line", { class: "axis", x1: x0, x2: x1, y1: y0, y2: y0 }, g);
    svgEl("line", { class: "axis", x1: x0, x2: x0, y1: y1, y2: y0 }, g);
    svgEl("text", { x: (x0 + x1) / 2, y: y0 + 32, "text-anchor": "middle" }, g).textContent =
      "Items per administration n (" + (state.log ? "log" : "linear") + " scale)";

    svgEl("line", { class: "target", x1: x0, x2: x1, y1: ys(0.9), y2: ys(0.9) }, g);
    if (ys(0.8) - ys(0.9) >= 14) {
      svgEl("text", { x: x0 - 6, y: ys(0.9) + 4, "text-anchor": "end" }, g).textContent = "0.9";
    }

    if (v.c) {
      svgEl("path", { class: "s-unc", d: linePath(v.u.map((k) => k / d.M), xs, ys) }, g);
      svgEl("path", { class: "s-phi", d: linePath(d.phi, xs, ys) }, g);
      svgEl("path", { class: "s-agree", d: linePath(v.c, xs, ys) }, g);
    } else {
      svgEl("path", { class: "s-phi", d: linePath(d.phi, xs, ys) }, g);
      for (const key of Object.keys(v.pts)) {
        svgEl("circle", { class: "pt-unc", cx: xs.f(Number(key)), cy: ys(v.pts[key][1] / d.M), r: 3 }, g);
      }
      svgEl("circle", { class: "pt-agree", cx: xs.f(d.phiN), cy: ys(at(v, d.phiN).c), r: 3.5 }, g);
    }

    const px = xs.f(d.phiN), py = ys(d.phi[d.phiN - 1]);
    const fx = xs.f(v.first), fy = ys(at(v, v.first).c);
    svgEl("line", { class: "guide-phi", x1: px, x2: px, y1: py, y2: y0 }, g);
    svgEl("line", { class: "guide-agree", x1: fx, x2: fx, y1: fy, y2: y0 }, g);
    if (v.persistent !== v.first) {
      const qx = xs.f(v.persistent), qy = ys(at(v, v.persistent).c);
      svgEl("line", { class: "guide-agree", x1: qx, x2: qx, y1: qy, y2: y0 }, g);
      svgEl("path", {
        class: "m-pers",
        d: "M" + qx + "," + (qy - 5.5) + "L" + (qx + 5.5) + "," + qy + "L" + qx + "," + (qy + 5.5) + "L" + (qx - 5.5) + "," + qy + "Z",
      }, g);
    }
    svgEl("rect", { class: "m-first", x: fx - 4.5, y: fy - 4.5, width: 9, height: 9 }, g);
    svgEl("circle", { class: "m-phi", cx: px, cy: py, r: 5 }, g);

    const cursor = svgEl("g", { "pointer-events": "none" }, g);
    geom = {
      x0: x0, x1: x1, xs: xs, ys: ys,
      line: svgEl("line", { class: "cursor", y1: y1, y2: y0 }, cursor),
      dots: ["unc", "phi", "agree"].map((k) => svgEl("circle", { class: "dot dot-" + k, r: 3.5 }, cursor)),
    };
    update();
  }

  function readoutHTML(t) {
    return "<span><i>n</i>&nbsp;= <b>" + t.n + "</b> (" + t.pool + "% of pool)</span>" +
      "<span>Projected &Phi;<sub><i>n</i></sub>&nbsp;= <b>" + t.phi + "</b> " +
        (t.phiOk ? '<span class="ok">&ge;&nbsp;0.90</span>' : "&lt;&nbsp;0.90") + "</span>" +
      (t.c === null
        ? "<span>Mean pair agreement <i>C</i>&nbsp;= <b>&mdash;</b></span><span>Uncertain: <b>&mdash;</b></span>"
        : "<span>Mean pair agreement <i>C</i>&nbsp;= <b>" + t.c + "%</b> " +
            (t.cOk ? '<span class="ok">&ge;&nbsp;90%</span>' : "&lt;&nbsp;90%") + "</span>" +
          "<span>Uncertain: <b>" + t.k + "</b> of " + t.M + " systems (" + t.u + "%)</span>");
  }

  // The longest string each readout value can take for a benchmark over every cut (digits are tabular,
  // so longest = widest).
  const widestCache = {};
  function widest(id) {
    if (widestCache[id]) return widestCache[id];
    const d = DATA[id];
    const w = { n: fmtInt(d.L), pool: "", phi: "", c: "", k: "", u: "", gaps: false };
    const keep = (key, s) => { if (s.length > w[key].length) w[key] = s; };
    for (let i = 0; i < d.L; i++) {
      keep("pool", poolPct(i + 1, d.L));
      keep("phi", near90(d.phi[i], 1, 3));
    }
    for (const q of Object.keys(CUT_NAME)) {
      const v = view(id, q);
      const vals = v.c ? v.c.map((c, i) => [c, v.u[i]]) : Object.keys(v.pts).map((key) => v.pts[key]);
      if (!v.c) w.gaps = true;
      for (const [c, k] of vals) {
        keep("c", near90(c, 100, 2));
        keep("k", fmtInt(k));
        keep("u", uPct(k, d.M));
      }
    }
    widestCache[id] = w;
    return w;
  }

  // Reserve the readout's tallest layout over every n and cut so the chart and slider do not move while n changes.
  function reserveReadoutHeight() {
    const d = DATA[state.id], w = widest(state.id);
    const saved = ui.readout.innerHTML;
    ui.readout.style.minHeight = "0px";
    let h = 0;
    const variants = [true, false].map((ok) => ({ n: w.n, pool: w.pool, phi: w.phi, phiOk: ok, c: w.c, cOk: ok, k: w.k, M: fmtInt(d.M), u: w.u }));
    if (w.gaps) variants.push({ n: w.n, pool: w.pool, phi: w.phi, phiOk: false, c: null });
    for (const t of variants) {
      ui.readout.innerHTML = readoutHTML(t);
      h = Math.max(h, ui.readout.offsetHeight);
    }
    ui.readout.innerHTML = saved;
    ui.readout.style.minHeight = h + "px";
  }

  function poolText(id, q) {
    const d = DATA[id];
    return fmtInt(d.L) + "-item pool · " + fmtInt(d.M) + " systems · " + CUT_NAME[q] + " cut c = " + view(id, q).cutTxt;
  }

  function update(fromNumberBox) {
    const d = DATA[state.id], v = view(state.id, state.q), n = state.n, i = n - 1;
    const phi = d.phi[i], val = at(v, n);
    if (geom) {
      const x = geom.xs.f(n);
      geom.line.setAttribute("x1", x);
      geom.line.setAttribute("x2", x);
      [val ? val.k / d.M : null, phi, val ? val.c : null].forEach((y, j) => {
        const dot = geom.dots[j];
        if (y === null) { dot.setAttribute("visibility", "hidden"); return; }
        dot.removeAttribute("visibility");
        dot.setAttribute("cx", x);
        dot.setAttribute("cy", geom.ys(y));
      });
    }
    ui.range.value = String(n);
    if (!fromNumberBox) ui.num.value = String(n);
    const phiTxt = near90(phi, 1, 3);
    if (val) {
      const cTxt = near90(val.c, 100, 2);
      ui.readout.innerHTML = readoutHTML({
        n: fmtInt(n), pool: poolPct(n, d.L), phi: phiTxt, phiOk: phi >= 0.9, c: cTxt, cOk: val.c >= 0.9,
        k: fmtInt(val.k), M: fmtInt(d.M), u: uPct(val.k, d.M),
      });
      ui.range.setAttribute("aria-valuetext",
        "n = " + n + ": projected Phi " + phiTxt + ", mean pair agreement " + cTxt + " percent, " +
        val.k + " of " + d.M + " systems uncertain");
    } else {
      ui.readout.innerHTML = readoutHTML({ n: fmtInt(n), pool: poolPct(n, d.L), phi: phiTxt, phiOk: phi >= 0.9, c: null });
      ui.range.setAttribute("aria-valuetext",
        "n = " + n + ": projected Phi " + phiTxt + "; agreement shown at summary points only for this cut");
    }
  }

  function setN(n, fromNumberBox) {
    const v = clamp(Math.round(n), 1, DATA[state.id].L);
    if (v === state.n) return;
    state.n = v;
    update(fromNumberBox);
  }

  const ICON = {
    phi: '<svg width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" class="m-phi"/></svg>',
    first: '<svg width="12" height="12" aria-hidden="true"><rect x="1.5" y="1.5" width="9" height="9" class="m-first"/></svg>',
    pers: '<svg width="12" height="12" aria-hidden="true"><path d="M6 0.8L11.2 6L6 11.2L0.8 6Z" class="m-pers"/></svg>',
  };
  function showButton(n, what) {
    return '<button type="button" data-n="' + n + '" aria-label="Show n = ' + n + " (" + what + ')">Show</button>';
  }
  function marksHTML(id, q) {
    const d = DATA[id], v = view(id, q);
    let html = "<span>" + ICON.phi + "<span>Projected &Phi; count (&Phi;<sub><i>n</i></sub>&nbsp;&ge;&nbsp;0.90): <b>" +
      fmtInt(d.phiN) + "</b></span>" + showButton(d.phiN, "projected Phi count") + "</span>";
    if (v.first === v.persistent) {
      html += "<span>" + ICON.first + "<span>First and persistent <i>C</i>&nbsp;&ge;&nbsp;90%: <b>" + fmtInt(v.first) + "</b></span>" +
        showButton(v.first, "first and persistent 90% agreement") + "</span>";
    } else {
      html += "<span>" + ICON.first + "<span>First <i>C</i>&nbsp;&ge;&nbsp;90%: <b>" + fmtInt(v.first) + "</b></span>" +
        showButton(v.first, "first 90% agreement") + "</span>";
      html += "<span>" + ICON.pers + "<span>Persistent <i>C</i>&nbsp;&ge;&nbsp;90%: <b>" + fmtInt(v.persistent) + "</b></span>" +
        showButton(v.persistent, "persistent 90% agreement") + "</span>";
    }
    if (!v.c) html += "<span>Summary points only</span>";
    return html;
  }

  // Everything that depends on the selected benchmark and cut, apart from the chart itself.
  function applyCut() {
    const d = DATA[state.id], v = view(state.id, state.q);
    ui.cuts.forEach((r) => { r.checked = r.value === state.q; });
    ui.pool.textContent = poolText(state.id, state.q);
    ui.marks.innerHTML = marksHTML(state.id, state.q);
    const agreeTxt = v.first === v.persistent
      ? "mean agreement reaches 0.90 at n = " + v.first + " and stays at or above it for every larger length in the pool"
      : "mean agreement first reaches 0.90 at n = " + v.first + " and stays at or above it from n = " + v.persistent;
    ui.title.textContent = "Projected Phi, exact mean pair agreement, and share of uncertain systems by items per administration, " +
      d.label + ", " + CUT_NAME[state.q] + " cut";
    ui.desc.textContent = "Projected Phi reaches 0.90 at n = " + d.phiN + "; " + agreeTxt + "." +
      (v.c ? " Full-pool agreement is 1 by construction." : " Agreement and uncertain systems are shown at these summary points only.");
  }

  function selectBench(id, announce) {
    const d = DATA[id];
    state.id = id;
    state.n = d.phiN;
    ui.bench.value = id;
    ui.range.max = String(d.L);
    ui.num.max = String(d.L);
    applyCut();
    reserveReadoutHeight();
    draw();
    if (announce) ui.status.textContent = d.label + ". " + ui.desc.textContent;
  }

  function selectCut(q, announce) {
    if (!(q in CUT_NAME)) return;
    state.q = q;
    applyCut();
    draw();
    if (announce) {
      const name = CUT_NAME[q];
      ui.status.textContent = name.charAt(0).toUpperCase() + name.slice(1) + " cut. " + ui.desc.textContent;
    }
  }

  for (const id of Object.keys(DATA)) {
    const option = document.createElement("option");
    option.value = id;
    option.textContent = DATA[id].label;
    ui.bench.appendChild(option);
  }
  ui.bench.addEventListener("change", () => selectBench(ui.bench.value, true));
  ui.cuts.forEach((r) => r.addEventListener("change", () => { if (r.checked) selectCut(r.value, true); }));
  ui.logx.addEventListener("change", () => { state.log = ui.logx.checked; draw(); });
  ui.range.addEventListener("input", () => setN(Number(ui.range.value)));
  ui.num.addEventListener("input", () => {
    const v = parseInt(ui.num.value, 10);
    if (v >= 1 && v <= DATA[state.id].L) setN(v, true);
  });
  ui.num.addEventListener("change", () => {
    const v = parseInt(ui.num.value, 10);
    if (!Number.isNaN(v)) setN(v);
    ui.num.value = String(state.n);
    ui.status.textContent = ui.range.getAttribute("aria-valuetext");
  });
  ui.marks.addEventListener("click", (ev) => {
    const button = ev.target.closest("button[data-n]");
    if (!button) return;
    setN(Number(button.getAttribute("data-n")));
    ui.status.textContent = ui.range.getAttribute("aria-valuetext");
  });
  function onPointer(ev) {
    if (!geom) return;
    const px = ev.clientX - ui.chart.getBoundingClientRect().left;
    if (px < geom.x0 - 12 || px > geom.x1 + 12) return;
    setN(geom.xs.inv(clamp(px, geom.x0, geom.x1)));
  }
  // A touch that turns into a page scroll or pinch ends in pointercancel: put n back where it was.
  let touchN = null;
  ui.chart.addEventListener("pointerdown", (ev) => {
    touchN = ev.pointerType === "touch" ? state.n : null;
    onPointer(ev);
  });
  ui.chart.addEventListener("pointermove", onPointer);
  ui.chart.addEventListener("pointercancel", () => {
    if (touchN !== null) setN(touchN);
    touchN = null;
  });
  ui.chart.addEventListener("pointerup", () => { touchN = null; });
  if ("ResizeObserver" in window) new ResizeObserver(() => draw()).observe(ui.chart);
  else window.addEventListener("resize", draw);
  let reserveFrame = 0;
  window.addEventListener("resize", () => {
    cancelAnimationFrame(reserveFrame);
    reserveFrame = requestAnimationFrame(reserveReadoutHeight);
  });
  selectBench(DEFAULT_ID, false);
})();
</script>
</body>
</html>
