    function base64ToArrayBuffer(base64) {
        const binaryString = window.atob(base64);
        const len = binaryString.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
            bytes[i] = binaryString.charCodeAt(i);
        }
        return bytes.buffer;
    }

    async function initWebGL() {
        statusLog.innerText = "Decoding embedded binary weights...";
        await new Promise(r => setTimeout(r, 10)); // Yield to UI

        let buffer;
        let stateBuffer;
        try {
            buffer = base64ToArrayBuffer(b64Weights);
            stateBuffer = base64ToArrayBuffer(b64InitState);
        } catch (e) {
            statusLog.innerHTML = `<span class="error">Failed to decode weights or state.</span>`;
            return;
        }

        statusLog.innerText = "Mapping memory to GPU...";
        await tf.setBackend('webgl');
        await tf.ready();

        function getWeight(name) {
            if (!manifest[name]) return null;
            const info = manifest[name];
            return new Float32Array(buffer, info.offset, info.length / 4);
        }

        const fixedKernelData = new Float32Array(3 * 3 * CHANNELS * 4);
        for(let y=0; y<3; y++) {
          for(let x=0; x<3; x++) {
            for(let c=0; c<CHANNELS; c++) {
               const base = (((y * 3) + x) * CHANNELS + c) * 4;
               fixedKernelData[base + 0] = (y===1 && x===1) ? 1.0 : 0.0;
               const sobelX = [-1,0,1, -2,0,2, -1,0,1];
               fixedKernelData[base + 1] = sobelX[y*3+x] / 8.0;
               const sobelY = [-1,-2,-1, 0,0,0, 1,2,1];
               fixedKernelData[base + 2] = sobelY[y*3+x] / 8.0;
               const laplace = [1,2,1, 2,-12,2, 1,2,1];
               fixedKernelData[base + 3] = laplace[y*3+x] / 8.0;
            }
          }
        }
        fixedKernel = tf.tensor4d(fixedKernelData, [3, 3, CHANNELS, 4]);

        if (NUM_TRAINABLE > 0 && manifest['w_conv']) {
            const w_conv_flat = getWeight('w_conv');
            const trainKernelData = new Float32Array(3 * 3 * CHANNELS * NUM_TRAINABLE);
            for(let y=0; y<3; y++) {
              for(let x=0; x<3; x++) {
                for(let c=0; c<CHANNELS; c++) {
                   const baseTrain = (((y * 3) + x) * CHANNELS + c) * NUM_TRAINABLE;
                   const baseFlat = (((y * 3) + x) * CHANNELS + c) * (CHANNELS * NUM_TRAINABLE);
                   for(let f=0; f<NUM_TRAINABLE; f++) {
                      trainKernelData[baseTrain + f] = w_conv_flat[baseFlat + (c * NUM_TRAINABLE) + f] || 0.0;
                   }
                }
              }
            }
            trainKernel = tf.tensor4d(trainKernelData, [3, 3, CHANNELS, NUM_TRAINABLE]);
        }

        let layerIdx = 1;
        while(manifest['w' + layerIdx]) {
           const wInfo = manifest['w' + layerIdx];
           const bInfo = manifest['b' + layerIdx];

           layers.push({
               w: tf.tensor(getWeight('w' + layerIdx), wInfo.shape).expandDims(0).expandDims(0),
               b: bInfo ? tf.tensor(getWeight('b' + layerIdx), bInfo.shape) : null
           });
           layerIdx++;
        }

        const coordsData = new Float32Array(GRID_SIZE * GRID_SIZE * 2);
        let i = 0;
        for(let y=0; y<GRID_SIZE; y++) {
          for(let x=0; x<GRID_SIZE; x++) {
             coordsData[i++] = (GRID_SIZE > 1) ? (y / (GRID_SIZE - 1)) * 2.0 - 1.0 : 0;
             coordsData[i++] = (GRID_SIZE > 1) ? (x / (GRID_SIZE - 1)) * 2.0 - 1.0 : 0;
          }
        }
        coordsTensor = tf.tensor3d(coordsData, [GRID_SIZE, GRID_SIZE, 2]).expandDims(0);

        if (manifest.w_film && manifest.b_film) {
            filmW = tf.tensor(getWeight('w_film'), manifest.w_film.shape);
            filmB = tf.tensor(getWeight('b_film'), manifest.b_film.shape);
        }

        if (manifest.w_action && manifest.b_action) {
            actionW = tf.tensor(getWeight('w_action'), manifest.w_action.shape);
            actionB = tf.tensor(getWeight('b_action'), manifest.b_action.shape);
        }

        if (manifest.action_embeddings) {
            actionEmbeddingsFlat = getWeight('action_embeddings');
            actionEmbedLen = manifest.action_embeddings.shape[1];
        }

        const initStateArray = new Float32Array(stateBuffer);
        stateTensor = tf.tensor(initStateArray, [1, GRID_SIZE, GRID_SIZE, CHANNELS]);

        isReady = true;

        statusLog.innerText = "Ready! Drag the joystick to steer.";
        render();

        // Start simulation loop
        simInterval = setTimeout(simulationLoop, 20);
    }

    function getActionEmbedding(x, y) {
        if (actionW && actionB) {
            return tf.tidy(() => {
                const action = tf.tensor1d([x, y]);
                return action.expandDims(0).matMul(actionW).squeeze().add(actionB);
            });
        }
        if (!actionEmbeddingsFlat) {
            return tf.tensor1d([x, y]);
        }

        let actionIdx = 0; 
        if (Math.abs(x) > 0.15 || Math.abs(y) > 0.15) {
            if (Math.abs(x) > Math.abs(y)) {
                actionIdx = x > 0 ? 4 : 3;
            } else {
                actionIdx = y > 0 ? 2 : 1;
            }
        }

        const embedArr = actionEmbeddingsFlat.slice(actionIdx * actionEmbedLen, (actionIdx + 1) * actionEmbedLen);
        return tf.tensor1d(embedArr);
    }

    function stepTF(stateT, joyX, joyY) {
      return tf.tidy(() => {
          // 1. Isolate RGB and unstandardize
          const rgb = stateT.slice([0, 0, 0, 0], [-1, -1, -1, 3]);
          const stdTensor = tf.tensor1d(DATA_STD);
          const meanTensor = tf.tensor1d(DATA_MEAN);
          const rgb_real = STANDARDIZE ? rgb.mul(stdTensor).add(meanTensor) : rgb;
          
          const rgb_clamped = rgb_real.clipByValue(0.0, 1.0);
          
          // 2. Measure "Red Intensity" -> Red - (Green + Blue) / 2
          const r = rgb_clamped.slice([0, 0, 0, 0], [-1, -1, -1, 1]);
          const g = rgb_clamped.slice([0, 0, 0, 1], [-1, -1, -1, 1]);
          const b = rgb_clamped.slice([0, 0, 0, 2], [-1, -1, -1, 1]);
          
          const gbAvg = g.add(b).div(2.0);
          const redIntensity = r.sub(gbAvg);
          
          // 3. Threshold: Catch anything with even a faint red tint (>0.02)
          let activeAgentMask = redIntensity.greater(0.02).cast('float32'); 
          
          // 4. Fallback: If no red is found, wake up the entire grid
          const isDeadlocked = tf.scalar(1.0).sub(activeAgentMask.max());
          activeAgentMask = tf.maximum(activeAgentMask, isDeadlocked);

          // 5. Dilate the active cells using a 3x3 max pool
          const activeMask = tf.maxPool(activeAgentMask, 3, 1, 'same');

          // --- Standard NCA logic below ---
          let p_fixed = tf.depthwiseConv2d(stateT, fixedKernel, 1, 'same');
          let p;
          if (trainKernel) {
              let p_train = tf.depthwiseConv2d(stateT, trainKernel, 1, 'same');
              p = tf.concat([p_fixed, p_train], 3);
          } else {
              p = p_fixed;
          }

          const embed = getActionEmbedding(joyX, joyY);

          if (filmW && filmB) {
              const embedMat = embed.expandDims(0);
              const filmOutReshaped = embedMat.matMul(filmW).add(filmB).expandDims(1).expandDims(1);
              const vec_len = p.shape[3];
              const gamma = filmOutReshaped.slice([0,0,0,0], [-1,-1,-1,vec_len]);
              const beta = filmOutReshaped.slice([0,0,0,vec_len], [-1,-1,-1,vec_len]);
              p = p.mul(gamma).add(beta);
          } else {
              const embed_spatial = embed.expandDims(0).expandDims(0).expandDims(0).tile([1, GRID_SIZE, GRID_SIZE, 1]);
              p = tf.concat([p, embed_spatial], 3);
          }

          if (layers.length > 0 && layers[0].w.shape[2] === p.shape[3] + 2) {
              p = tf.concat([p, coordsTensor], 3);
          }

          let h = p;
          for(let l=0; l<layers.length; l++) {
              h = tf.conv2d(h, layers[l].w, 1, 'same');
              if (layers[l].b) h = h.add(layers[l].b);
              if (l < layers.length - 1) h = tf.relu(h);
          }

          const stochasticMask = tf.randomUniform([1, GRID_SIZE, GRID_SIZE, 1]).less(CELL_FIRE_RATE).cast('float32');
          
          const delta = h.mul(stochasticMask).mul(activeMask).mul(DT);
          return stateT.add(delta).clipByValue(-10.0, 10.0);
      });
    }

    function render() {
      // --- Render Main Canvas ---
      const stateData = stateTensor.dataSync();
      const imgData = ctx.createImageData(GRID_SIZE, GRID_SIZE);
      for (let y = 0; y < GRID_SIZE; y++) {
        for (let x = 0; x < GRID_SIZE; x++) {
          const idx_tensor = (y * GRID_SIZE + x) * CHANNELS;
          let r = stateData[idx_tensor], g = stateData[idx_tensor+1], b = stateData[idx_tensor+2];

          if (STANDARDIZE) {
            r = r * (DATA_STD[0] || 1.0) + (DATA_MEAN[0] || 0.0);
            g = g * (DATA_STD[1] || 1.0) + (DATA_MEAN[1] || 0.0);
            b = b * (DATA_STD[2] || 1.0) + (DATA_MEAN[2] || 0.0);
          }

          const rx = Math.floor(Math.max(0, Math.min(1, r)) * 255);
          const gx = Math.floor(Math.max(0, Math.min(1, g)) * 255);
          const bx = Math.floor(Math.max(0, Math.min(1, b)) * 255);

          const idx = (y * GRID_SIZE + x) * 4;
          imgData.data[idx] = rx;
          imgData.data[idx+1] = gx;
          imgData.data[idx+2] = bx;
          imgData.data[idx+3] = 255;
        }
      }
      ctx.putImageData(imgData, 0, 0);

      // --- Render Active Mask Visualizer ---
      if (stateTensor) {
          const maskData = tf.tidy(() => {
              const rgb = stateTensor.slice([0, 0, 0, 0], [-1, -1, -1, 3]);
              const stdTensor = tf.tensor1d(DATA_STD);
              const meanTensor = tf.tensor1d(DATA_MEAN);
              const rgb_real = STANDARDIZE ? rgb.mul(stdTensor).add(meanTensor) : rgb;
              
              const rgb_clamped = rgb_real.clipByValue(0.0, 1.0);
              
              const r = rgb_clamped.slice([0, 0, 0, 0], [-1, -1, -1, 1]);
              const g = rgb_clamped.slice([0, 0, 0, 1], [-1, -1, -1, 1]);
              const b = rgb_clamped.slice([0, 0, 0, 2], [-1, -1, -1, 1]);
              
              const gbAvg = g.add(b).div(2.0);
              const redIntensity = r.sub(gbAvg);
              
              let activeAgentMask = redIntensity.greater(0.02).cast('float32');
              const isDeadlocked = tf.scalar(1.0).sub(activeAgentMask.max());
              activeAgentMask = tf.maximum(activeAgentMask, isDeadlocked);
              
              const activeMask = tf.maxPool(activeAgentMask, 3, 1, 'same');
              return activeMask.dataSync(); 
          });
          
          const mImgData = maskCtx.createImageData(GRID_SIZE, GRID_SIZE);
          for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
              const val = maskData[i] > 0 ? 255 : 0; 
              const idx = i * 4;
              mImgData.data[idx] = val;       
              mImgData.data[idx+1] = val;     
              mImgData.data[idx+2] = val;     
              mImgData.data[idx+3] = 255;     
          }
          maskCtx.putImageData(mImgData, 0, 0);
      }
    }

    function simulationLoop() {
        if (!isReady) return;

        try {
            if (currentActionX !== 0 || currentActionY !== 0) {
                for (let i = 0; i < ROLLOUT_STEPS; i++) { 
                    const nextState = stepTF(stateTensor, currentActionX, currentActionY);
                    stateTensor.dispose();
                    stateTensor = nextState;
                }
                render(); 
            }
            statusLog.innerText = `Action: [${currentActionX.toFixed(2)}, ${currentActionY.toFixed(2)}]`;
        } catch(err) {
            console.error(err);
        }
        setTimeout(simulationLoop, 20);
    }

    
    // --- Joystick Implementation ---
    const area = document.getElementById('joystick-area');
    const knob = document.getElementById('joystick-knob');
    let isDragging = false;
    let activePointerId = null;
    currentActionX = 0;
    currentActionY = 0;

    function joystickGeometry() {
        const centerX = area.clientWidth / 2;
        const centerY = area.clientHeight / 2;
        const radiusX = knob.offsetWidth / 2;
        const radiusY = knob.offsetHeight / 2;
        return {centerX, centerY, radiusX, radiusY,
            maxDist: Math.max(1, Math.min(centerX - radiusX, centerY - radiusY) - 3)};
    }

    function resetKnob() {
        isDragging = false;
        const pointerId = activePointerId;
        activePointerId = null;
        if (area && knob) {
            const {centerX, centerY, radiusX, radiusY} = joystickGeometry();
            knob.style.background = '#0284c7';
            knob.style.left = (centerX - radiusX) + 'px';
            knob.style.top = (centerY - radiusY) + 'px';
            if (pointerId !== null && area.hasPointerCapture?.(pointerId))
                area.releasePointerCapture(pointerId);
        }
        currentActionX = 0;
        currentActionY = 0;
    }

    function updateKnob(ex, ey) {
        if (!area || !knob) return;
        const rect = area.getBoundingClientRect();
        const {centerX, centerY, radiusX, radiusY, maxDist} = joystickGeometry();
        let dx = ex - rect.left - area.clientLeft - centerX;
        let dy = ey - rect.top - area.clientTop - centerY;
        const dist = Math.hypot(dx, dy);
        if (dist > maxDist) {
            dx = (dx / dist) * maxDist;
            dy = (dy / dist) * maxDist;
        }
        knob.style.left = (centerX + dx - radiusX) + 'px';
        knob.style.top = (centerY + dy - radiusY) + 'px';
        if (Math.hypot(dx, dy) > 5) {
            currentActionX = (dx / maxDist) * 0.6;
            currentActionY = (dy / maxDist) * 0.6;
        } else {
            currentActionX = 0;
            currentActionY = 0;
        }
    }

    function beginDrag(clientX, clientY) {
        // Transfer focus before setting the action: the enclosing figure's
        // focus handlers must not cancel this first gesture into its iframe.
        window.focus();
        isDragging = true;
        knob.style.background = '#059669';
        updateKnob(clientX, clientY);
    }

    if (area) {
        if (window.PointerEvent) {
            area.addEventListener('pointerdown', event => {
                if (event.button !== 0 || activePointerId !== null) return;
                event.preventDefault();
                beginDrag(event.clientX, event.clientY);
                activePointerId = event.pointerId;
                area.setPointerCapture(event.pointerId);
            });
            area.addEventListener('pointermove', event => {
                if (isDragging && event.pointerId === activePointerId)
                    updateKnob(event.clientX, event.clientY);
            });
            for (const name of ['pointerup', 'pointercancel', 'lostpointercapture'])
                area.addEventListener(name, event => {
                    if (event.pointerId === activePointerId) resetKnob();
                });
        } else {
            area.addEventListener('mousedown', event => {
                if (event.button !== 0) return;
                event.preventDefault();
                beginDrag(event.clientX, event.clientY);
            });
            window.addEventListener('mousemove', event => {
                if (isDragging) updateKnob(event.clientX, event.clientY);
            });
            window.addEventListener('mouseup', resetKnob);
            area.addEventListener('touchstart', event => {
                if (event.touches.length !== 1) return;
                event.preventDefault();
                beginDrag(event.touches[0].clientX, event.touches[0].clientY);
            }, {passive: false});
            window.addEventListener('touchmove', event => {
                if (!isDragging || event.touches.length !== 1) return;
                event.preventDefault();
                updateKnob(event.touches[0].clientX, event.touches[0].clientY);
            }, {passive: false});
            window.addEventListener('touchend', resetKnob);
            window.addEventListener('touchcancel', resetKnob);
        }
        window.addEventListener('blur', resetKnob);
        new ResizeObserver(() => { if (!isDragging) resetKnob(); }).observe(area);
        resetKnob();
    }

    initWebGL();
  </script>

<script>
(() => {
  function pause() {
    if (typeof isRunning !== 'undefined' && isRunning) {
      if (typeof togglePlayPause === 'function') togglePlayPause();
      else isRunning = false;
    }
    if (typeof keysHeld !== 'undefined') { keysHeld.left = false; keysHeld.right = false; }
    if (typeof pendingAction !== 'undefined') pendingAction = null;
    resetKnob();
  }
  window.submissionDemo = { pause, get isRollingOut() {
    return typeof isRollingOut !== 'undefined' && isRollingOut;
  } };
  window.addEventListener('blur', pause);
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('message', event => {
    if (event.source !== parent || event.origin !== location.origin) return;
    if (event.data && event.data.type === 'submission-pause') pause();
  });
  for (const canvas of document.querySelectorAll('canvas')) {
    if (!canvas.hasAttribute('aria-label')) canvas.setAttribute('aria-label',
      canvas.id === 'mainCanvas' ? 'Neural cellular automaton simulation' : 'Model diagnostic visualization');
  }
  function reportError(message) {
    const status = document.getElementById('status-log') || document.getElementById('statusLog');
    if (status) { status.textContent = 'Simulation unavailable: ' + message + '. Reload this figure to try again.';
      status.setAttribute('role', 'status'); }
  }
  window.addEventListener('unhandledrejection', event => reportError(String(event.reason)));
  window.addEventListener('error', event => reportError(event.message || 'WebGL initialization failed'));
})();
</script>
