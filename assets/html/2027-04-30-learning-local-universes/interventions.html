</style><style id="lu-figure-theme" media="screen and (prefers-color-scheme: dark)">
/* This style's media attribute follows the venue theme. Scientific pixels and
   light-mode styling stay intact; print always uses the original light style. */
@media screen {
  html { color-scheme: dark; }
  :root {
    --accent: #7dd3fc;
    --border: #454b54;
    --muted: #b2bdcc;
    --figure-text: #e2e8f0;
    --figure-control: #292d33;
    --figure-hover: #343b44;
  }
  html, html.presentation, body { background: transparent; }
  html body, html.presentation body { color: var(--figure-text); }
  .stage iframe, .simulation-card, .hero-card, .album-card { background: transparent; }
  .compare figcaption, .hero-card-label, .switch-label.active-label { color: var(--figure-text); }
  .switch-label { color: var(--muted); }
  .hero-card-label { border-color: var(--border); }
  .album-segmented-bar { background: var(--figure-control); }
  html body button:not(.album-float-arrow):not(#lu-demo-play):not(.lu-demo-reset):not(.active):not(.btn-play):not(.btn-flash-score):not(.btn-flash-life):not(#btnPlayPause),
  html body select, html.presentation body select, html body input[type="text"] {
    background: var(--figure-control);
    color: var(--figure-text);
    border-color: var(--border);
  }
  html body button:not(.album-float-arrow):not(#lu-demo-play):not(.lu-demo-reset):not(.active):not(.btn-play):not(.btn-flash-score):not(.btn-flash-life):not(#btnPlayPause):hover {
    background: var(--figure-hover);
    color: var(--accent);
    border-color: var(--accent);
  }
  html body button[aria-pressed="true"] {
    background: #173c4e !important;
    color: var(--accent) !important;
    border-color: var(--accent) !important;
  }
  .slider { background: #596371; }
  .album-status[data-error] { background: var(--figure-control); color: var(--figure-text); }
  /* Some model labels and reset styles are installed after the model loads. */
  html body :is(.info, .channel-label, .main-label, .ctrl-label, #action-log, #speed-control, .speed-wrapper, #status-log, #statusLog),
  html body #joystick-wrapper p,
  html body .presentation-heading p,
  html body .presentation-shortcuts,
  html body .presentation-shortcuts kbd,
  html body #container > p {
    color: var(--muted) !important;
  }
  html body #joystick-wrapper > div:first-child { color: var(--figure-text) !important; }
  html body #container > div:first-child > div > span { color: var(--figure-text) !important; }
  html body #joystick-area { background: var(--figure-control); border-color: var(--border); }
  html body :is(#channels-container, #channel-container, #perception-container) {
    background: transparent !important;
    border-color: var(--border);
  }
  html body :is(#btn-reset, #btnReset).lu-demo-reset {

  }
  html body :is(#btn-reset, #btnReset).lu-demo-reset:hover { background: var(--figure-hover); }
  html body .lu-pointer-cue { color: var(--accent) !important; }
}

<script id="lu-figure-theme-sync">
// Read the venue theme without modifying the article. Older Safari versions
// do not propagate a manual parent colour-scheme change into iframe media queries.
(() => {
  const style = document.getElementById('lu-figure-theme');
  const preference = matchMedia('(prefers-color-scheme: dark)');
  let venue = null;
  try { if (window.top !== window) venue = window.top.document.documentElement; }
  catch (_) { /* A cross-origin embed follows its available media preference. */ }
  function syncTheme() {
    const chosen = venue?.getAttribute('data-theme');
    const dark = chosen === 'dark' || (chosen !== 'light' && preference.matches);
    const media = dark ? 'screen' : 'not all';
    if (style.media !== media) style.media = media;
  }
  const observer = new MutationObserver(syncTheme);
  if (venue) observer.observe(venue, {attributes: true, attributeFilter: ['data-theme']});
  preference.addEventListener('change', syncTheme);
  window.addEventListener('pagehide', () => observer.disconnect());
  window.addEventListener('pageshow', () => {
    if (venue) observer.observe(venue, {attributes: true, attributeFilter: ['data-theme']});
    syncTheme();
  });
  syncTheme();
})();
</script>

<div class="album-card"><div class="album-segmented-bar" role="group" aria-label="Choose recorded intervention"><button type="button" data-video="0" aria-pressed="true">Brick</button><button type="button" data-video="1" aria-pressed="false">77 → 81</button><button type="button" data-video="2" aria-pressed="false">000 → 001</button><button type="button" data-video="3" aria-pressed="false">99 → 00</button><button type="button" data-video="4" aria-pressed="false">Ball</button><button type="button" data-video="5" aria-pressed="false">Paddle</button></div><div class="album-video-viewport"><button type="button" id="previous" class="album-float-arrow prev" aria-label="Previous example">❮</button><button type="button" id="next" class="album-float-arrow next" aria-label="Next example">❯</button><video id="album" class="album" muted loop playsinline preload="auto" tabindex="0" aria-label="Recorded world intervention. Click to pause or resume.">Your browser does not support the video tag.</video></div></div>
<script>
const videos = [["Brick", "bricks.mp4"], ["77 \u2192 81", "77_to_81.mp4"], ["000 \u2192 001", "000_to_001.mp4"], ["99 \u2192 00", "99_to_00.mp4"], ["Ball", "ball_spawn.mp4"], ["Paddle", "double_paddle.mp4"]];

const video = document.getElementById('album');
const viewport = document.querySelector('.album-video-viewport');
const still = document.createElement('canvas');
still.className = 'album-still';
still.setAttribute('aria-hidden', 'true');
viewport.append(still);
const status = document.createElement('p');
status.className = 'album-status';
status.setAttribute('role', 'status');
viewport.append(status);
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
let current = Number(new URLSearchParams(location.search).get('example') || 0);
if (!Number.isInteger(current) || current < 0 || current >= videos.length) current = 0;
let request = 0, loading = true, inView = true, userPaused = reducedMotion.matches;
let loaded = null;
// Align the game canvas, rather than the differently sized screen recordings.
// Bounds are [left, top, square side] in source pixels. Paddle's negative top
// restores its missing black margin; the MP4s themselves remain unchanged.
const recordingBounds = {
  'bricks.mp4': [10, 6, 1000],
  '77_to_81.mp4': [10, 6, 1000],
  '000_to_001.mp4': [6, 6, 1000],
  '99_to_00.mp4': [10, 6, 1000],
  'ball_spawn.mp4': [10, 6, 1000],
  'double_paddle.mp4': [0, -3, 840],
};
function frameRecording(filename) {
  const bounds = recordingBounds[filename];
  if (!bounds) { video.removeAttribute('style'); return; }
  const [left, top, side] = bounds;
  video.style.left = `${-left / side * 100}%`;
  video.style.top = `${-top / side * 100}%`;
  video.style.width = `${video.videoWidth / side * 100}%`;
  video.style.height = `${video.videoHeight / side * 100}%`;
}
function updatePlayback() {
  if (loading || !inView || document.hidden || userPaused) video.pause();
  else video.play().catch(() => {});
}
function select(index) {
  const next = (index + videos.length) % videos.length;
  if (next === current && !loading && video.currentSrc) return;
  const token = ++request;
  // Freeze the displayed picture before resetting the media element. On rapid
  // clicks retain that same picture until the last requested clip is ready.
  if (!loading && video.readyState >= 2 && video.videoWidth) {
    still.width = video.videoWidth;
    still.height = video.videoHeight;
    still.getContext('2d').drawImage(video, 0, 0);
    // Hold the old clip with its own framing until the new picture is ready.
    still.style.cssText = video.style.cssText;
  }
  still.hidden = false;
  loading = true;
  viewport.setAttribute('aria-busy', 'true');
  status.removeAttribute('data-error');
  status.textContent = 'Loading recording.';
  current = next;
  userPaused = reducedMotion.matches;
  for (const tab of document.querySelectorAll('[data-video]'))
    tab.setAttribute('aria-pressed', String(Number(tab.dataset.video) === current));
  video.pause();
  if (loaded) video.removeEventListener('loadeddata', loaded);
  const filename = videos[current][1];
  const source = new URL('videos/' + filename, location.href).href;
  loaded = () => {
    if (token !== request || video.currentSrc !== source || video.readyState < 2) return;
    video.removeEventListener('loadeddata', loaded);
    frameRecording(filename);
    // Let the decoded first picture reach the next paint before removing the
    // still. Neither the viewport nor the enclosing article changes height.
    requestAnimationFrame(() => requestAnimationFrame(() => {
      if (token !== request || video.currentSrc !== source || video.readyState < 2) return;
      loading = false;
      viewport.setAttribute('aria-busy', 'false');
      still.hidden = true;
      status.textContent = '';
      updatePlayback();
    }));
  };
  video.addEventListener('loadeddata', loaded);
  video.src = source;
  video.load();
  video.defaultPlaybackRate = 2;
  video.playbackRate = 2;
}
video.addEventListener('error', () => {
  loading = false;
  viewport.setAttribute('aria-busy', 'false');
  status.setAttribute('data-error', '');
  status.textContent = 'This recording could not load. Choose another tab to try again.';
});
select(current);
// Article links target this named iframe. The reserved viewport gives the
// recording its final dimensions before the selected media starts loading.
if (new URLSearchParams(location.search).has('example')) {
  window.addEventListener('load', () => requestAnimationFrame(() => {
    try {
      const figure = window.frameElement?.closest('figure');
      if (!figure) return;
      figure.scrollIntoView({behavior: reducedMotion.matches ? 'instant' : 'smooth', block: 'start'});
      document.querySelector('[data-video="' + current + '"]')?.focus({preventScroll: true});
    } catch (_) { /* Standalone recordings retain their normal position. */ }
  }));
}
for (const button of document.querySelectorAll('[data-video]'))
  button.addEventListener('click', () => select(Number(button.dataset.video)));
document.getElementById('previous').addEventListener('click', () => select(current - 1));
document.getElementById('next').addEventListener('click', () => select(current + 1));
function toggle() { userPaused = !userPaused; updatePlayback(); }
video.addEventListener('click', toggle);
video.addEventListener('keydown', event => {
  if (event.code === 'Space' || event.code === 'Enter') { event.preventDefault(); toggle(); }
});
document.addEventListener('visibilitychange', updatePlayback);
reducedMotion.addEventListener('change', () => {
  if (reducedMotion.matches) userPaused = true;
  updatePlayback();
});
new IntersectionObserver(entries => {
  inView = entries[0].isIntersecting;
  updatePlayback();
}).observe(viewport);


(() => {
  let lastHeight = 0;
  function fitOuterFrame() {
    try {
      const frame = window.frameElement;
      if (!frame) return;
      // Intrinsic body height does not include the enclosing iframe viewport;
      // using documentElement.scrollHeight here would prevent shrinking.
      const height = Math.ceil(document.body.getBoundingClientRect().height + 2);
      if (height !== lastHeight) { lastHeight = height; frame.style.height = height + 'px'; }
    } catch (_) { /* Direct or cross-origin opening retains its fixed fallback height. */ }
  }
  new ResizeObserver(fitOuterFrame).observe(document.body);
  window.addEventListener('load', fitOuterFrame);
  window.addEventListener('resize', fitOuterFrame);
  fitOuterFrame();
})();

</script>
