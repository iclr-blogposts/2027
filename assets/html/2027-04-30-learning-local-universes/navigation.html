      nativeReset.addEventListener('click', event => {
        event.preventDefault(); event.stopImmediatePropagation(); outerReset.click();
      }, true);
      const actions = outerReset.closest('.figure-actions');
      if (actions) actions.hidden = true;

    const style = document.createElement('style');

        min-width:0; max-width:100%; width:100%;
      }
      :is(#btn-reset, #btnReset).lu-demo-reset {
        order:1; display:inline-flex; align-items:center; justify-content:center; gap:6px;
        align-self:center; margin:6px auto 0; min-height:32px; padding:5px 10px !important;
        border:1px solid #7dd3fc; border-radius:6px; background:white; color:#0284c7;
        font-size:14px; font-weight:500; cursor:pointer; touch-action:manipulation;
      }
      :is(#btn-reset, #btnReset).lu-demo-reset:hover { background:#f0f9ff; }
      .lu-demo-reset svg { width:14px; height:14px; flex:none; margin:0 !important; }
      .lu-navigation-canvases { align-items:flex-start !important; }
      @media (min-width:560px) {
        html[data-figure-expanded="true"] #lu-main-demo { grid-area:main; }
      }
    `;
    document.head.append(style);
    // The play cue already explains playback and keys. Preserve feedback such
    // as scores, actions, loading failures, and the editor's painting guidance.
    const instruction = document.querySelector('#container > p:first-child:not([id])');
    if (instruction) {
      if (path.includes('breakout_editor')) instruction.textContent = 'Click or drag on the canvas to paint or erase.';
      else instruction.classList.add('lu-duplicate-instruction');
    }
    const status = document.getElementById('status-log');
    if (status) {
      const redundant = new Set(['', 'Click canvas to play',
        'Click canvas or press Left/Right to play', 'Paused (Click to resume)']);
      const refreshStatus = () => status.classList.toggle('lu-duplicate-instruction',
        redundant.has(status.textContent.replace(/\s+/g, ' ').trim()));
      const statusObserver = new MutationObserver(refreshStatus);
      statusObserver.observe(status, {childList:true, characterData:true, subtree:true});
      window.addEventListener('pagehide', () => statusObserver.disconnect());
      refreshStatus();
    }
    canvas.tabIndex = 0;
    const controls = text ? 'Type letters; Enter for a new line; Backspace to erase.'
      : snake ? 'Use the arrow keys to move the snake.'
      : navigation ? 'Drag the joystick to move.'
      : 'Use Left and Right arrow keys to steer. Space pauses or resumes.';
    canvas.setAttribute('aria-label', 'Interactive neural simulation. ' + controls);

    // Drawing demos already have a persistent Play button. Keep the canvas free
    // for painting while paused, and make its existing control discoverable.
    if (editing) {
      const play = document.getElementById('btnPlayPause');
      if (play) { play.setAttribute('aria-label', 'Play or pause simulation'); play.title = 'Play / pause · Space'; }
      return;
    }
    // Navigation starts with the first drag. Its cue must not intercept the knob.
    if (navigation) {
      const hint = document.querySelector('#joystick-wrapper > p');
      if (hint) { hint.classList.add('lu-pointer-cue'); hint.textContent = '↔ Drag the knob to play'; }
      return;
    }

    const button = document.createElement('button');
    button.id = 'lu-demo-play'; button.type = 'button'; button.hidden = true;
    const icon = text
      ? '<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2 5h20v14H2zm2 2v10h16V7zm2 2h2v2H6zm4 0h2v2h-2zm4 0h2v2h-2zm4 0h1v2h-1zM6 13h2v2H6zm4 0h8v2h-8z"/></svg>'
      : '<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 4.5v15l12-7.5z"/></svg>';
    const keys = text ? '<kbd>A</kbd>–<kbd>Z</kbd> · <kbd>Enter</kbd> · <kbd>⌫</kbd>'
      : snake ? '<kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd>'
      : '<kbd>←</kbd><kbd>→</kbd> · <kbd>Space</kbd> pauses';
    button.innerHTML = icon + '<span class="lu-cue-label"></span><span class="lu-cue-controls" aria-hidden="true">' + keys + '</span>';
    document.body.append(button);
    let engaged = false, played = false, ready = false;
    const stepped = text || snake;
    function position() {
      const box = canvas.getBoundingClientRect();
      button.style.left = (box.left + box.width / 2) + 'px';
      button.style.top = (box.top + box.height / 2) + 'px';
    }
    function update() {
      ready = typeof isReady !== 'undefined' && isReady;
      const running = typeof isRunning !== 'undefined' && isRunning;
      if (running) played = true;
      button.hidden = !ready || (stepped ? engaged : running);
      const label = text ? 'Click to type' : snake ? 'Play Snake' : played ? 'Resume' : 'Play';
      button.querySelector('.lu-cue-label').textContent = label;
      button.setAttribute('aria-label', label + '. ' + controls);
      if (!button.hidden) position();
    }
    function activate(event) {
      event.preventDefault(); event.stopPropagation();
      if (!ready) return;
      engaged = true;
      window.focus(); canvas.focus({preventScroll:true});
      if (!stepped && typeof togglePlayPause === 'function'
          && !(typeof isRunning !== 'undefined' && isRunning)) togglePlayPause();
      if (text && matchMedia('(pointer:coarse)').matches) {
        const input = parent.document.getElementById('text-input');
        if (input && input.getBoundingClientRect().height) input.focus({preventScroll:true});
      }
      update();
    }
    button.addEventListener('click', activate);
    // Consume activation keys before the model's window listeners can toggle
    // the simulation, then activate once on release like a native Space button.
    button.addEventListener('keydown', event => {
      if (event.code === 'Space' || event.code === 'Enter') {
        event.preventDefault(); event.stopPropagation();
      }
    });
    button.addEventListener('keyup', event => {
      if (event.code === 'Space' || event.code === 'Enter') activate(event);
    });
    canvas.addEventListener('pointerdown', () => { engaged = true; update(); });
    window.addEventListener('keydown', event => {
      if (stepped && (snake ? event.code.startsWith('Arrow') : event.key.length === 1 || ['Enter','Backspace'].includes(event.key))) {
        engaged = true; update();
      }
      setTimeout(update, 0);
    });
    window.addEventListener('blur', () => setTimeout(update, 0));
    document.addEventListener('click', () => setTimeout(update, 0));
    const observer = new ResizeObserver(position);
    observer.observe(canvas); observer.observe(document.body);
    window.addEventListener('resize', position);
    window.addEventListener('scroll', position, {passive:true});
    const timer = setInterval(update, 250);
    window.addEventListener('pagehide', () => { clearInterval(timer); observer.disconnect(); });
    update();
  }
  const script = doc.createElement('script');
  script.id = 'lu-demo-play-bootstrap';
  script.textContent = '(' + setup.toString() + ')();';
  doc.body.append(script);
}

(() => {
  let current = 0, frame = null, resizeObserver = null;
  const isHero = figureName === 'hero';
  let autoStarted = false;
  const status = document.getElementById('status');
  const stage = document.getElementById('stage');
  const load = document.getElementById('load');
  const interactive = document.getElementById('interactive');
  function key(type, code, value) {
    if (!frame) return;
    try { frame.contentWindow.dispatchEvent(new frame.contentWindow.KeyboardEvent(type,
      {code, key: value || (code === 'Space' ? ' ' : code), bubbles: true, cancelable: true})); }
    catch (_) { status.textContent = 'The simulation is still loading.'; }
  }
  function measure() {
    if (!frame) return;
    try { const doc = frame.contentDocument; if (doc && doc.body)
      frame.style.height = Math.ceil(doc.body.getBoundingClientRect().height + 12) + 'px'; }
    catch (_) {}
  }
  function pause() {
    if (!frame) return;
    try { frame.contentWindow.submissionDemo?.pause(); } catch (_) {}
  }
  // Keep the displayed frame in place while its replacement loads and sizes.
  let pendingFrame = null, reloadTimer = null, reloadSerial = 0;
  function cancelReplacement() {
    reloadSerial++;
    clearTimeout(reloadTimer);
    reloadTimer = null;
    if (pendingFrame) {
      try { pendingFrame.contentWindow.submissionDemo?.pause(); } catch (_) {}
      pendingFrame.remove(); pendingFrame = null;
    }
    stage.removeAttribute('aria-busy');
  }
  function dispose() {
    cancelReplacement();
    pause(); if (resizeObserver) resizeObserver.disconnect(); resizeObserver = null;
    stage.replaceChildren(); stage.style.minHeight = ''; frame = null; interactive.hidden = true;
  }
  function start(reveal = false) {
    cancelReplacement();
    pause();
    const serial = reloadSerial, chosen = current;
    const actions = load.closest('.figure-actions');
    const next = document.createElement('iframe');
    next.title = variants[chosen][0] + ' neural cellular automaton simulation';
    next.src = variants[chosen][1];
    next.dataset.variant = String(chosen);
    next.dataset.preparing = 'true';
    const initialHeight = isHero ? (window.innerWidth <= 540 ? 220 : 280) + 24 : 320;
    next.style.height = (frame?.getBoundingClientRect().height || initialHeight) + 'px';
    stage.style.position = 'relative';
    if (!frame) stage.style.minHeight = initialHeight + 'px';
    next.setAttribute('aria-hidden', 'true'); next.inert = true;
    // Prepare at the real stage width without affecting its layout. Reveal
    // this same element in place: moving an iframe would reload its document.
    Object.assign(next.style, {position:'absolute', inset:'0 0 auto', width:'100%',
      visibility:'hidden', clipPath:'inset(100%)', pointerEvents:'none'});
    pendingFrame = next;
    const active = () => serial === reloadSerial && pendingFrame === next && next.isConnected;
    function fail(message) {
      if (!active()) return;
      cancelReplacement(); stage.style.minHeight = '';
      if (frame?.dataset.variant) {
        current = Number(frame.dataset.variant);
        for (const tab of document.querySelectorAll('[data-variant]'))
          tab.setAttribute('aria-pressed', String(Number(tab.dataset.variant) === current));
      }
      if (!frame) actions.hidden = false;
      status.classList.add('error'); status.textContent = message;
    }
    function sizeReplacement() {
      const shown = frame;
      try { frame = next; measure(); } finally { frame = shown; }
    }
    async function commit() {
      try {
        await next.contentDocument.fonts.ready;
        if (!active()) return;
        sizeReplacement();
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        if (!active()) return;
        sizeReplacement();
        pause();
        if (resizeObserver) resizeObserver.disconnect();
        clearTimeout(reloadTimer); reloadTimer = null;
        const previous = frame;
        frame = next; pendingFrame = null;
        delete next.dataset.preparing;
        next.removeAttribute('aria-hidden'); next.inert = false;
        for (const property of ['position', 'inset', 'visibility', 'clip-path', 'pointer-events'])
          next.style.removeProperty(property);
        previous?.remove(); stage.style.minHeight = '';
        stage.removeAttribute('aria-busy');
        actions.hidden = !!next.contentDocument.querySelector('#btn-reset, #btnReset');
        resizeObserver = new ResizeObserver(measure);
        resizeObserver.observe(next.contentDocument.body);
        status.classList.remove('error'); status.textContent = 'Simulation ready.';
        measure();
        if (reveal === true && typeof revealDemo === 'function') revealDemo();
      } catch (_) { fail('The demo could not finish loading. Try Reset again.'); }
    }
    next.addEventListener('load', () => {
      if (!active()) return;
      try {
        const doc = next.contentDocument;
        if (!doc?.querySelector('#mainCanvas') || !next.contentWindow.tf) {
          fail('The demo could not load. Try Reset again.'); return;
        }
        const hidden = actions.hidden;
        try { makeIframeResponsive(next); } finally { actions.hidden = hidden; }
        const safe = doc.createElement('style');
        safe.textContent = 'body{min-height:0!important}#plotCanvas{max-width:96vw!important}';
        doc.head.append(safe);
        const channels = document.getElementById('channels');
        if (channels && next.contentWindow.setRolloutMode)
          next.contentWindow.setRolloutMode(channels.checked);
        function awaitReady() {
          if (!active()) return;
          try {
            if (next.contentWindow.eval('typeof isReady !== "undefined" && isReady')) {
              commit(); return;
            }
            const issue = doc.querySelector('#status-log, #statusLog');
            if (issue && /failed|unavailable|unable|error/i.test(issue.textContent)) {
              fail('The demo could not load. ' + issue.textContent.trim()); return;
            }
            setTimeout(awaitReady, 50);
          } catch (_) { fail('The demo could not load. Try Reset again.'); }
        }
        awaitReady();
      } catch (_) { fail('The demo could not load. Try Reset again.'); }
    }, {once:true});
    next.addEventListener('error', () => fail('The demo could not load. Try Reset again.'), {once:true});
    stage.append(next); interactive.hidden = false; stage.setAttribute('aria-busy', 'true');
    status.classList.remove('error'); status.textContent = frame ? 'Resetting…' : 'Loading…';
    reloadTimer = setTimeout(() => fail('The demo took too long to load. Try Reset again.'), 20000);
  }
  window.addEventListener('pagehide', event => {
    if (event.persisted) { cancelReplacement(); pause(); }
    else dispose();
  });
  load.addEventListener('click', start);
  for (const button of document.querySelectorAll('[data-variant]')) button.addEventListener('click', () => {
    current = Number(button.dataset.variant);
    for (const tab of document.querySelectorAll('[data-variant]')) tab.setAttribute('aria-pressed', String(tab === button));
    start();
  });
  for (const button of document.querySelectorAll('[data-key]')) {
    const code = button.dataset.key;
    button.addEventListener('pointerdown', event => {
      event.preventDefault(); button.setPointerCapture(event.pointerId); key('keydown', code);
    });
    for (const event of ['pointerup', 'pointercancel', 'lostpointercapture'])
      button.addEventListener(event, () => key('keyup', code));
    button.addEventListener('click', event => { if (event.detail === 0) { key('keydown', code); key('keyup', code); } });
  }
  const channels = document.getElementById('channels');
  if (channels) channels.addEventListener('change', () => {
    document.getElementById('simple-label').classList.toggle('active-label', !channels.checked);
    document.getElementById('channels-label').classList.toggle('active-label', channels.checked);
    if (frame?.contentWindow.setRolloutMode) frame.contentWindow.setRolloutMode(channels.checked);
    measure();
  });
  const input = document.getElementById('text-input');
  if (input) {
    let pending = Promise.resolve();
    function enqueue(value) { pending = pending.then(async () => {
      key('keydown', value, value);
      const demo = frame?.contentWindow;
      // Slow channel rollouts deliberately span many rendered micro-steps.
      // Await completion so a typed word is not reduced to its first letter.
      const deadline = Date.now() + 15000;
      await new Promise(resolve => setTimeout(resolve, 10));
      while (demo && Date.now() < deadline) {
        let rolling = false;
        try { rolling = demo.submissionDemo?.isRollingOut; } catch (_) {}
        if (!rolling) break;
        await new Promise(resolve => setTimeout(resolve, 30));
      }
    }); }
    input.addEventListener('input', () => {
      for (const value of input.value) if (/^[a-zA-Z ]$/.test(value)) enqueue(value);
      input.value = '';
    });
    input.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === 'Backspace') { event.preventDefault(); enqueue(event.key); }
    });
    // Mobile keyboards often emit beforeinput without a physical Backspace key.
    input.addEventListener('beforeinput', event => {
      if (event.inputType === 'deleteContentBackward') { event.preventDefault(); enqueue('Backspace'); }
    });
    for (const button of document.querySelectorAll('[data-text]')) button.addEventListener('click', () => enqueue(button.dataset.text));
  }
  window.addEventListener('resize', () => { if (frame) { makeIframeResponsive(frame); measure(); } });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('blur', () => {
    // Focusing the nested simulation is normal interaction, not leaving it.
    if (document.activeElement !== frame) pause();
  });
  // The parent article remains free of custom JavaScript; each figure owns its
  // visibility and model lifecycle. Nested iframe clipping is included here.
  new IntersectionObserver(entries => {
    const visible = entries[0].isIntersecting;
    if (visible && !autoStarted && !load.disabled) { autoStarted = true; start(); }
    if (!visible) pause();
    for (const video of document.querySelectorAll('.hero-card video')) {
      if (visible && !matchMedia('(prefers-reduced-motion: reduce)').matches) video.play().catch(() => {});
      else video.pause();
    }
  }, {threshold: 0}).observe(document.body);
  for (const link of document.querySelectorAll('[data-section]')) link.addEventListener('click', event => {
    try {
      if (parent === window) return;
      const target = parent.document.getElementById(link.dataset.section);
      if (target) {
        event.preventDefault(); target.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
        parent.history.replaceState(null, '', '#' + link.dataset.section);
      }
    } catch (_) {}
  });
  const canvas = document.createElement('canvas');
  const context = canvas.getContext('webgl2') || canvas.getContext('webgl');
  if (!context) {
    load.disabled = true; status.classList.add('error'); status.textContent = 'WebGL is unavailable in this browser. Enable WebGL or try a browser with WebGL support.';
    for (const details of document.querySelectorAll('details')) details.open = true;
  }
  if (context) context.getExtension('WEBGL_lose_context')?.loseContext();
  if (isHero && !load.disabled) { autoStarted = true; start(); }
})();


(() => {
  let lastHeight = 0;
  function fitOuterFrame() {
    try {
      const frame = window.frameElement;
      if (!frame) return;
      // Intrinsic body height does not include the enclosing iframe viewport;
      // using documentElement.scrollHeight here would prevent shrinking.
      const height = Math.ceil(document.body.getBoundingClientRect().height + 2);
      if (height !== lastHeight) { lastHeight = height; frame.style.height = height + 'px'; }
    } catch (_) { /* Direct or cross-origin opening retains its fixed fallback height. */ }
  }
  new ResizeObserver(fitOuterFrame).observe(document.body);
  window.addEventListener('load', fitOuterFrame);
  window.addEventListener('resize', fitOuterFrame);
  fitOuterFrame();
})();

</script>
