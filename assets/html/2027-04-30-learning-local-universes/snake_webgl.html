<style id="lu-figure-theme" media="screen and (prefers-color-scheme: dark)">
/* This style's media attribute follows the venue theme. Scientific pixels and
   light-mode styling stay intact; print always uses the original light style. */
@media screen {
  html { color-scheme: dark; }
  :root {
    --accent: #7dd3fc;
    --border: #454b54;
    --muted: #b2bdcc;
    --figure-text: #e2e8f0;
    --figure-control: #292d33;
    --figure-hover: #343b44;
  }
  html, html.presentation, body { background: transparent; }
  html body, html.presentation body { color: var(--figure-text); }
  .stage iframe, .simulation-card, .hero-card, .album-card { background: transparent; }
  .compare figcaption, .hero-card-label, .switch-label.active-label { color: var(--figure-text); }
  .switch-label { color: var(--muted); }
  .hero-card-label { border-color: var(--border); }
  .album-segmented-bar { background: var(--figure-control); }
  html body button:not(.album-float-arrow):not(#lu-demo-play):not(.lu-demo-reset):not(.active):not(.btn-play):not(.btn-flash-score):not(.btn-flash-life):not(#btnPlayPause),
  html body select, html.presentation body select, html body input[type="text"] {
    background: var(--figure-control);
    color: var(--figure-text);
    border-color: var(--border);
  }
  html body button:not(.album-float-arrow):not(#lu-demo-play):not(.lu-demo-reset):not(.active):not(.btn-play):not(.btn-flash-score):not(.btn-flash-life):not(#btnPlayPause):hover {
    background: var(--figure-hover);
    color: var(--accent);
    border-color: var(--accent);
  }
  html body button[aria-pressed="true"] {
    background: #173c4e !important;
    color: var(--accent) !important;
    border-color: var(--accent) !important;
  }
  .slider { background: #596371; }
  .album-status[data-error] { background: var(--figure-control); color: var(--figure-text); }
  /* Some model labels and reset styles are installed after the model loads. */
  html body :is(.info, .channel-label, .main-label, .ctrl-label, #action-log, #speed-control, .speed-wrapper, #status-log, #statusLog),
  html body #joystick-wrapper p,
  html body .presentation-heading p,
  html body .presentation-shortcuts,
  html body .presentation-shortcuts kbd,
  html body #container > p {
    color: var(--muted) !important;
  }
  html body #joystick-wrapper > div:first-child { color: var(--figure-text) !important; }
  html body #container > div:first-child > div > span { color: var(--figure-text) !important; }
  html body #joystick-area { background: var(--figure-control); border-color: var(--border); }
  html body :is(#channels-container, #channel-container, #perception-container) {
    background: transparent !important;
    border-color: var(--border);
  }
  html body :is(#btn-reset, #btnReset).lu-demo-reset {
    background: var(--figure-control);
    color: var(--accent);
    border-color: var(--border);
  }
  html body :is(#btn-reset, #btnReset).lu-demo-reset:hover { background: var(--figure-hover); }
  html body .lu-pointer-cue { color: var(--accent) !important; }
}

<script id="lu-figure-theme-sync">
// Read the venue theme without modifying the article. Older Safari versions
// do not propagate a manual parent colour-scheme change into iframe media queries.
(() => {
  const style = document.getElementById('lu-figure-theme');
  const preference = matchMedia('(prefers-color-scheme: dark)');
  let venue = null;
  try { if (window.top !== window) venue = window.top.document.documentElement; }
  catch (_) { /* A cross-origin embed follows its available media preference. */ }
  function syncTheme() {
    const chosen = venue?.getAttribute('data-theme');
    const dark = chosen === 'dark' || (chosen !== 'light' && preference.matches);
    const media = dark ? 'screen' : 'not all';
    if (style.media !== media) style.media = media;
  }
  const observer = new MutationObserver(syncTheme);
  if (venue) observer.observe(venue, {attributes: true, attributeFilter: ['data-theme']});
  preference.addEventListener('change', syncTheme);
  window.addEventListener('pagehide', () => observer.disconnect());
  window.addEventListener('pageshow', () => {
    if (venue) observer.observe(venue, {attributes: true, attributeFilter: ['data-theme']});
    syncTheme();
  });
  syncTheme();
})();
</script>

    const container = document.getElementById('container');
    const mainCanvas = document.getElementById('mainCanvas');
    const ctx = mainCanvas.getContext('2d');
    const statusLog = document.getElementById('status-log');
    const channelContainer = document.getElementById('channel-container');
    const speedControl = document.getElementById('speed-control');

    let isReady = false;
    let fixedKernel = null;
    let trainKernel = null;
    let layers = [];
    let coordsTensor = null;
    let filmW = null;
    let filmB = null;
    let actionEmbeddingsFlat = null;
    let actionEmbedLen = 0;

    let stateTensor = null;
    let snake = [{x: 6, y: 6}];
    let fruit = {x: 3, y: 4};
    let generatedFruitThisStep = false;

    let channelCanvases = [];
    let channelCtxs = [];

    function saveStateToStorage() {
        try {
            if (stateTensor) {
                const arr = Array.from(stateTensor.dataSync());
                sessionStorage.setItem('snake_synced_state', JSON.stringify({
                    snake: snake,
                    fruit: fruit,
                    stateData: arr,
                    score: snake.length - 1
                }));
            }
        } catch(e) {}
    }

    function setRolloutMode(enabled) {
      isRolloutMode = !!enabled;
      if (speedControl) speedControl.style.display = isRolloutMode ? 'flex' : 'none';
      if (channelContainer) channelContainer.style.display = isRolloutMode ? 'grid' : 'none';
      render();
    }
    window.setRolloutMode = setRolloutMode;

    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'SET_ROLLOUT_MODE') {
        setRolloutMode(e.data.enabled);
      }
    });

    function base64ToArrayBuffer(b64) {
        const binaryString = window.atob(b64);
        const len = binaryString.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);
        return bytes.buffer;
    }

    async function initWebGL() {
        statusLog.innerText = "Decoding embedded binary weights...";
        await new Promise(r => setTimeout(r, 10));

        // Create 16 Channel Canvases (8x2 grid spanning 100% width)
        channelContainer.innerHTML = '';
        channelCanvases = [];
        channelCtxs = [];
        for (let i = 0; i < CHANNELS; i++) {
            const box = document.createElement('div');
            box.className = 'channel-box';
            const label = document.createElement('div');
            label.className = 'channel-label';
            label.innerText = (i === 0) ? "R (Head)" : (i === 1) ? "G (Body)" : (i === 2) ? "B (Fruit)" : `CH ${i}`;
            const can = document.createElement('canvas');
            can.width = GRID_SIZE; can.height = GRID_SIZE;
            box.appendChild(label); box.appendChild(can);
            channelContainer.appendChild(box);
            channelCanvases.push(can); channelCtxs.push(can.getContext('2d'));
        }

        let buffer;
        try { buffer = base64ToArrayBuffer(b64Weights); }
        catch (e) { statusLog.innerHTML = `<span class="error">Failed to decode weights.</span>`; return; }

        statusLog.innerText = "Mapping memory to GPU...";
        await tf.setBackend('webgl'); await tf.ready();

        function getWeight(name) {
            if (!manifest[name]) return null;
            const info = manifest[name];
            return new Float32Array(buffer, info.offset, info.length / 4);
        }

        const fixedKernelData = new Float32Array(3 * 3 * CHANNELS * 4);
        for(let y=0; y<3; y++) {
          for(let x=0; x<3; x++) {
            for(let c=0; c<CHANNELS; c++) {
               const base = (((y * 3) + x) * CHANNELS + c) * 4;
               fixedKernelData[base + 0] = (y===1 && x===1) ? 1.0 : 0.0;
               const sobelX = [-1,0,1, -2,0,2, -1,0,1];
               fixedKernelData[base + 1] = sobelX[y*3+x] / 8.0;
               const sobelY = [-1,-2,-1, 0,0,0, 1,2,1];
               fixedKernelData[base + 2] = sobelY[y*3+x] / 8.0;
               const laplace = [1,2,1, 2,-12,2, 1,2,1];
               fixedKernelData[base + 3] = laplace[y*3+x] / 8.0;
            }
          }
        }
        fixedKernel = tf.tensor4d(fixedKernelData, [3, 3, CHANNELS, 4]);

        if (NUM_TRAINABLE > 0 && manifest['w_conv']) {
            const w_conv_flat = getWeight('w_conv');
            const trainKernelData = new Float32Array(3 * 3 * CHANNELS * NUM_TRAINABLE);
            for(let y=0; y<3; y++) {
              for(let x=0; x<3; x++) {
                for(let c=0; c<CHANNELS; c++) {
                   const baseTrain = (((y * 3) + x) * CHANNELS + c) * NUM_TRAINABLE;
                   const baseFlat = (((y * 3) + x) * CHANNELS + c) * (CHANNELS * NUM_TRAINABLE);
                   for(let f=0; f<NUM_TRAINABLE; f++) {
                      trainKernelData[baseTrain + f] = w_conv_flat[baseFlat + (c * NUM_TRAINABLE) + f] || 0.0;
                   }
                }
              }
            }
            trainKernel = tf.tensor4d(trainKernelData, [3, 3, CHANNELS, NUM_TRAINABLE]);
        }

        let layerIdx = 1;
        while(manifest['w' + layerIdx]) {
           const wInfo = manifest['w' + layerIdx];
           const bInfo = manifest['b' + layerIdx];
           layers.push({
               w: tf.tensor(getWeight('w' + layerIdx), wInfo.shape).expandDims(0).expandDims(0),
               b: bInfo ? tf.tensor(getWeight('b' + layerIdx), bInfo.shape) : null
           });
           layerIdx++;
        }

        const coordsData = new Float32Array(GRID_SIZE * GRID_SIZE * 2);
        let i = 0;
        for(let y=0; y<GRID_SIZE; y++) {
          for(let x=0; x<GRID_SIZE; x++) {
             coordsData[i++] = (GRID_SIZE > 1) ? (y / (GRID_SIZE - 1)) * 2.0 - 1.0 : 0;
             coordsData[i++] = (GRID_SIZE > 1) ? (x / (GRID_SIZE - 1)) * 2.0 - 1.0 : 0;
          }
        }
        coordsTensor = tf.tensor3d(coordsData, [GRID_SIZE, GRID_SIZE, 2]).expandDims(0);

        if (manifest.w_film && manifest.b_film) {
            filmW = tf.tensor(getWeight('w_film'), manifest.w_film.shape);
            filmB = tf.tensor(getWeight('b_film'), manifest.b_film.shape);
        }

        if (manifest.action_embeddings) {
            actionEmbeddingsFlat = getWeight('action_embeddings');
            actionEmbedLen = manifest.action_embeddings.shape[1];
        }

        stateTensor = tf.zeros([1, GRID_SIZE, GRID_SIZE, CHANNELS]);
        isReady = true;
        await initGame();
    }

    function getTrueFrame() {
      const frame = Array(GRID_SIZE).fill(0).map(() => Array(GRID_SIZE).fill(0).map(() => [0,0,0]));
      for (let y = 0; y < GRID_SIZE; y++) {
        for (let x = 0; x < GRID_SIZE; x++) {
          const isHead = (snake[0].x === x && snake[0].y === y) ? 1.0 : 0.0;
          const isBody = snake.slice(1).some(s => s.x === x && s.y === y) ? 1.0 : 0.0;
          const isFruit = (fruit.x === x && fruit.y === y) ? 1.0 : 0.0;

          if (STANDARDIZE) {
            frame[y][x][0] = (isHead - DATA_MEAN[0]) / DATA_STD[0];
            frame[y][x][1] = (isBody - DATA_MEAN[1]) / DATA_STD[1];
            frame[y][x][2] = (isFruit - DATA_MEAN[2]) / DATA_STD[2];
          } else {
            frame[y][x][0] = isHead;
            frame[y][x][1] = isBody;
            frame[y][x][2] = isFruit;
          }
        }
      }
      return frame;
    }

    function applyTeacherForcing(trueFrame, mode) {
        const stateData = (mode === 0) ? new Float32Array(GRID_SIZE * GRID_SIZE * CHANNELS) : stateTensor.dataSync();
        for(let y=0; y<GRID_SIZE; y++) {
            for(let x=0; x<GRID_SIZE; x++) {
                if (mode === 0 || mode === 1 || (mode === 2 && fruit.x === x && fruit.y === y)) {
                    const idx = (y*GRID_SIZE + x)*CHANNELS;
                    stateData[idx] = trueFrame[y][x][0];
                    stateData[idx+1] = trueFrame[y][x][1];
                    stateData[idx+2] = trueFrame[y][x][2];
                }
            }
        }
        if(stateTensor) stateTensor.dispose();
        stateTensor = tf.tensor4d(stateData, [1, GRID_SIZE, GRID_SIZE, CHANNELS]);
    }

    function moveTrueEnv(actionIdx) {
      const dirs = [[0,-1], [1,0], [0,1], [-1,0]];
      const dx = dirs[actionIdx][0];
      const dy = dirs[actionIdx][1];

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE || snake.some(s => s.x === head.x && s.y === head.y)) {
        snake = [{x: 6, y: 6}];
        fruit = {x: 3, y: 4};
        return true;
      } else {
        snake.unshift(head);
        if (head.x === fruit.x && head.y === fruit.y) {
          let valid = [];
          for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
              if (!snake.some(s => s.x === c && s.y === r)) valid.push({x: c, y: r});
            }
          }
          if (valid.length > 0) {
            fruit = valid[Math.floor(Math.random() * valid.length)];
            generatedFruitThisStep = true;
          }
        } else {
          snake.pop();
        }
        return false;
      }
    }

    function stepTF(stateT, actionIdx) {
      return tf.tidy(() => {
          let p_fixed = tf.depthwiseConv2d(stateT, fixedKernel, 1, 'same');
          let p;
          if (trainKernel) {
              let p_train = tf.depthwiseConv2d(stateT, trainKernel, 1, 'same');
              p = tf.concat([p_fixed, p_train], 3);
          } else {
              p = p_fixed;
          }

          if (actionEmbeddingsFlat) {
              const embedArr = actionEmbeddingsFlat.slice(actionIdx * actionEmbedLen, (actionIdx + 1) * actionEmbedLen);
              const embed = tf.tensor1d(embedArr);

              if (filmW && filmB) {
                  const embedMat = embed.expandDims(0);
                  const filmOutReshaped = embedMat.matMul(filmW).add(filmB).expandDims(1).expandDims(1);
                  const vec_len = p.shape[3];
                  const gamma = filmOutReshaped.slice([0,0,0,0], [-1,-1,-1,vec_len]);
                  const beta = filmOutReshaped.slice([0,0,0,vec_len], [-1,-1,-1,vec_len]);
                  p = p.mul(gamma).add(beta);
              } else {
                  const embed_spatial = embed.expandDims(0).expandDims(0).expandDims(0).tile([1, GRID_SIZE, GRID_SIZE, 1]);
                  p = tf.concat([p, embed_spatial], 3);
              }
          }

          if (layers[0].w.shape[2] === p.shape[3] + 2) {
              p = tf.concat([p, coordsTensor], 3);
          }

          let h = p;
          for(let l=0; l<layers.length; l++) {
              h = tf.conv2d(h, layers[l].w, 1, 'same');
              if (layers[l].b) h = h.add(layers[l].b);
              if (l < layers.length - 1) h = tf.relu(h);
          }

          const mask = tf.randomUniform([1, GRID_SIZE, GRID_SIZE, 1]).less(CELL_FIRE_RATE).cast('float32');
          const delta = h.mul(mask).mul(DT);

          return stateT.add(delta).clipByValue(-10.0, 10.0);
      });
    }

    function render() {
      if (!stateTensor) return;
      const stateData = stateTensor.dataSync();
      const mainImgData = ctx.createImageData(GRID_SIZE, GRID_SIZE);

      // 1. Draw Main RGB Canvas
      for (let y = 0; y < GRID_SIZE; y++) {
        for (let x = 0; x < GRID_SIZE; x++) {
          const idx_tensor = (y * GRID_SIZE + x) * CHANNELS;
          let r = stateData[idx_tensor], g = stateData[idx_tensor+1], b = stateData[idx_tensor+2];

          if (STANDARDIZE) {
            r = r * DATA_STD[0] + DATA_MEAN[0];
            g = g * DATA_STD[1] + DATA_MEAN[1];
            b = b * DATA_STD[2] + DATA_MEAN[2];
          }

          const rx = Math.floor(Math.max(0, Math.min(1, r)) * 255);
          const gx = Math.floor(Math.max(0, Math.min(1, g)) * 255);
          const bx = Math.floor(Math.max(0, Math.min(1, b)) * 255);

          const idx = (y * GRID_SIZE + x) * 4;
          mainImgData.data[idx] = rx;
          mainImgData.data[idx+1] = gx;
          mainImgData.data[idx+2] = bx;
          mainImgData.data[idx+3] = 255;
        }
      }
      ctx.putImageData(mainImgData, 0, 0);

      // 2. Draw 16 Individual Channels using original formula
      if (isRolloutMode && channelCtxs.length === CHANNELS) {
        for (let c = 0; c < CHANNELS; c++) {
          const cImgData = channelCtxs[c].createImageData(GRID_SIZE, GRID_SIZE);
          for (let y = 0; y < GRID_SIZE; y++) {
            for (let x = 0; x < GRID_SIZE; x++) {
              const idx_tensor = (y * GRID_SIZE + x) * CHANNELS + c;
              let val = stateData[idx_tensor];
              let v = val;

              if (c < 3) {
                  if (STANDARDIZE) val = val * DATA_STD[c] + DATA_MEAN[c];
                  v = val; // RGB channels
              } else {
                  // Hidden features mapped approx [-1, 1] to [0, 1]
                  v = (val + 1.0) / 2.0; 
              }
              
              const px = Math.floor(Math.max(0, Math.min(1, v)) * 255);
              const idx = (y * GRID_SIZE + x) * 4;

              if (c === 0) { cImgData.data[idx] = px; cImgData.data[idx+1] = 0;  cImgData.data[idx+2] = 0; }
              else if (c === 1) { cImgData.data[idx] = 0; cImgData.data[idx+1] = px; cImgData.data[idx+2] = 0; }
              else if (c === 2) { cImgData.data[idx] = 0; cImgData.data[idx+1] = 0;  cImgData.data[idx+2] = px; }
              else {
                  // Grayscale for hidden
                  cImgData.data[idx] = px; 
                  cImgData.data[idx+1] = px; 
                  cImgData.data[idx+2] = px; 
              }
              cImgData.data[idx+3] = 255;
            }
          }
          channelCtxs[c].putImageData(cImgData, 0, 0);
        }
      }
    }

    async function initGame() {
      try {
          const saved = sessionStorage.getItem('snake_synced_state');
          if (saved) {
              const data = JSON.parse(saved);
              if (data && data.snake && data.stateData && data.stateData.length === GRID_SIZE * GRID_SIZE * CHANNELS) {
                  snake = data.snake;
                  fruit = data.fruit;
                  if (stateTensor) stateTensor.dispose();
                  stateTensor = tf.tensor4d(new Float32Array(data.stateData), [1, GRID_SIZE, GRID_SIZE, CHANNELS]);
                  render();
                  statusLog.innerText = `Score: ${snake.length - 1}`;
                  isReady = true;
                  return;
              }
          }
      } catch(e) {}

      // Fallback: standard burn-in
      snake = [{x: 6, y: 6}];
      fruit = {x: 3, y: 4};
      
      applyTeacherForcing(getTrueFrame(), 0);
      
      statusLog.innerText = "Running 5-step GPU Burn-In...";
      await new Promise(r => setTimeout(r, 50)); 

      for (let step = 0; step < 5; step++) {
        const actionIdx = Math.floor(Math.random() * 4);
        moveTrueEnv(actionIdx);

        for (let i = 0; i < ROLLOUT_STEPS; i++) {
            const nextState = stepTF(stateTensor, actionIdx);
            stateTensor.dispose();
            stateTensor = nextState;
        }

        applyTeacherForcing(getTrueFrame(), 1);
      }

      render();
      saveStateToStorage();
      statusLog.innerText = "Score: 0";
    }

    window.addEventListener('keydown', async (e) => {
      const keyMap = {'ArrowUp': 0, 'ArrowRight': 1, 'ArrowDown': 2, 'ArrowLeft': 3};
      if (keyMap[e.code] !== undefined) {
        e.preventDefault();
      }
      if (!isReady || isRollingOut) return;
      if (keyMap[e.code] === undefined) return;

      isRollingOut = true;
      const actionIdx = keyMap[e.code];
      generatedFruitThisStep = false;

      try {
        const isDone = moveTrueEnv(actionIdx);
        if (isRolloutMode) {
          statusLog.innerText = "NCA Updating...";
        }

        for (let i = 0; i < ROLLOUT_STEPS; i++) {
           const nextState = stepTF(stateTensor, actionIdx);
           stateTensor.dispose();
           stateTensor = nextState;

           if (isRolloutMode) {
             render(); // Visualize every intermediate step across the 16 channels!
             if (rolloutDelayMs > 0) {
               await new Promise(r => setTimeout(r, rolloutDelayMs));
             }
           }
        }

        applyTeacherForcing(getTrueFrame(), isDone ? 0 : 2);

        if (isDone) {
          statusLog.innerText = "Game over!";
        } else {
          statusLog.innerText = generatedFruitThisStep ? "Generating fruit" : `Score: ${snake.length - 1}`;
        }

        render();
        saveStateToStorage();
      } catch (err) {
        statusLog.innerHTML = `<span class="error">${err.message}</span>`;
        console.error(err);
      } finally {
        isRollingOut = false;
      }
    });

    const speedSlider = document.getElementById('speed-slider');
    if (speedSlider) {
      speedSlider.addEventListener('input', (e) => {
        rolloutDelayMs = parseInt(e.target.value, 10);
      });
    }

    document.addEventListener('click', () => window.focus());

    initWebGL();
  </script>

<script>
(() => {
  function pause() {
    if (typeof isRunning !== 'undefined' && isRunning) {
      if (typeof togglePlayPause === 'function') togglePlayPause();
      else isRunning = false;
    }
    if (typeof keysHeld !== 'undefined') { keysHeld.left = false; keysHeld.right = false; }
    if (typeof pendingAction !== 'undefined') pendingAction = null;
    if (typeof currentActionX !== 'undefined') currentActionX = 0;
    if (typeof currentActionY !== 'undefined') currentActionY = 0;
    if (typeof isDragging !== 'undefined') isDragging = false;
  }
  window.submissionDemo = { pause, get isRollingOut() {
    return typeof isRollingOut !== 'undefined' && isRollingOut;
  } };
  window.addEventListener('blur', pause);
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('message', event => {
    if (event.source !== parent || event.origin !== location.origin) return;
    if (event.data && event.data.type === 'submission-pause') pause();
  });
  for (const canvas of document.querySelectorAll('canvas')) {
    if (!canvas.hasAttribute('aria-label')) canvas.setAttribute('aria-label',
      canvas.id === 'mainCanvas' ? 'Neural cellular automaton simulation' : 'Model diagnostic visualization');
  }
  function reportError(message) {
    const status = document.getElementById('status-log') || document.getElementById('statusLog');
    if (status) { status.textContent = 'Simulation unavailable: ' + message + '. Reload this figure to try again.';
      status.setAttribute('role', 'status'); }
  }
  window.addEventListener('unhandledrejection', event => reportError(String(event.reason)));
  window.addEventListener('error', event => reportError(event.message || 'WebGL initialization failed'));
})();
</script>
