<script>
(function () {
'use strict';
/* Shared by every figure: numerical core, drawing helpers, tooltips and the glue that embeds a figure
   in the post (theme, frame height, links and messages between figures). */

/* ===== MATH-CORE-START ===== */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function gaussFn(rng) {
  let spare = null;
  return function () {
    if (spare !== null) { const s = spare; spare = null; return s; }
    let u = 0, v = 0;
    while (u === 0) u = rng();
    v = rng();
    const r = Math.sqrt(-2 * Math.log(u));
    spare = r * Math.sin(2 * Math.PI * v);
    return r * Math.cos(2 * Math.PI * v);
  };
}

// Discrete pole for a mode {type, dt, alpha, omega}
function poleOf(m) {
  const r = Math.exp(-m.alpha * m.dt);
  const th = m.type === 'complex' ? m.omega * m.dt : 0;
  return [r * Math.cos(th), r * Math.sin(th)];
}
// K_k = Re((1 - a) a^k)
function kernelOf(m, n) {
  const [ar, ai] = poleOf(m);
  let zr = 1 - ar, zi = -ai;
  const K = new Float64Array(n);
  for (let k = 0; k < n; k++) {
    K[k] = zr;
    const nr = zr * ar - zi * ai, ni = zr * ai + zi * ar;
    zr = nr; zi = ni;
  }
  return K;
}
// h_t = a h_{t-1} + (1 - a) x_t, complex state
function runModeOn(m, x) {
  const [ar, ai] = poleOf(m);
  const br = 1 - ar, bi = -ai;
  let hr = 0, hi = 0;
  const n = x.length, Hr = new Float64Array(n), Hi = new Float64Array(n);
  for (let t = 0; t < n; t++) {
    const nr = ar * hr - ai * hi + br * x[t];
    const ni = ar * hi + ai * hr + bi * x[t];
    hr = nr; hi = ni; Hr[t] = hr; Hi[t] = hi;
  }
  return { Hr, Hi };
}
function cdiv(ar, ai, br, bi) {
  const d = br * br + bi * bi;
  return [(ar * br + ai * bi) / d, (ai * br - ar * bi) / d];
}
// |H(e^{iW})| for W in [0, pi]; H = (G(a,b) + G(conj a, conj b)) / 2
function freqOf(m, nw) {
  const out = new Float64Array(nw);
  for (let j = 0; j < nw; j++) out[j] = gainAt(m, Math.PI * j / (nw - 1));
  return out;
}
function gainAt(m, W) {
  const [ar, ai] = poleOf(m);
  const br = 1 - ar, bi = -ai;
  const cr = Math.cos(W), ci = -Math.sin(W);
  const d1r = 1 - (ar * cr - ai * ci), d1i = -(ar * ci + ai * cr);
  const d2r = 1 - (ar * cr + ai * ci), d2i = -(ar * ci - ai * cr);
  const g1 = cdiv(br, bi, d1r, d1i), g2 = cdiv(br, -bi, d2r, d2i);
  return Math.hypot((g1[0] + g2[0]) / 2, (g1[1] + g2[1]) / 2);
}

// Latch task data

el('s16temp').addEventListener('input', () => { rh.T = +el('s16temp').value; drawScene6(); });
el('s16gen').addEventListener('click', () => {
  if (rh.gen) { stopRhGen(); drawScene6(); return; }
  if (rh.seq[rh.seq.length - 1] === 6) rh.seq = [0];
  rh.gen = setInterval(() => { const more = rhSampleOne(); drawScene6(); if (!more || rh.seq[rh.seq.length - 1] === 6) { stopRhGen(); drawScene6(); } }, 160);
  drawScene6();
});
buildRhTokens();
boot(drawScene6);
})();
</script>
</body>
