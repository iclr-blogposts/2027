(function () {
'use strict';
/* Shared by every figure: numerical core, drawing helpers, tooltips and the glue that embeds a figure
   in the post (theme, frame height, links and messages between figures). */

/* ===== MATH-CORE-START ===== */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function gaussFn(rng) {
  let spare = null;
  return function () {
    if (spare !== null) { const s = spare; spare = null; return s; }
    let u = 0, v = 0;
    while (u === 0) u = rng();
    v = rng();
    const r = Math.sqrt(-2 * Math.log(u));
    spare = r * Math.sin(2 * Math.PI * v);
    return r * Math.cos(2 * Math.PI * v);
  };
}

// Discrete pole for a mode {type, dt, alpha, omega}
function poleOf(m) {
  const r = Math.exp(-m.alpha * m.dt);
  const th = m.type === 'complex' ? m.omega * m.dt : 0;
  return [r * Math.cos(th), r * Math.sin(th)];
}
// K_k = Re((1 - a) a^k)
function kernelOf(m, n) {
  const [ar, ai] = poleOf(m);
  let zr = 1 - ar, zi = -ai;
  const K = new Float64Array(n);
  for (let k = 0; k < n; k++) {
    K[k] = zr;
    const nr = zr * ar - zi * ai, ni = zr * ai + zi * ar;
    zr = nr; zi = ni;
  }
  return K;
}
// h_t = a h_{t-1} + (1 - a) x_t, complex state
function runModeOn(m, x) {
  const [ar, ai] = poleOf(m);
  const br = 1 - ar, bi = -ai;
  let hr = 0, hi = 0;
  const n = x.length, Hr = new Float64Array(n), Hi = new Float64Array(n);
  for (let t = 0; t < n; t++) {
    const nr = ar * hr - ai * hi + br * x[t];
    const ni = ar * hi + ai * hr + bi * x[t];
    hr = nr; hi = ni; Hr[t] = hr; Hi[t] = hi;
  }
  return { Hr, Hi };
}
function cdiv(ar, ai, br, bi) {
  const d = br * br + bi * bi;
  return [(ar * br + ai * bi) / d, (ai * br - ar * bi) / d];
}
// |H(e^{iW})| for W in [0, pi]; H = (G(a,b) + G(conj a, conj b)) / 2
function freqOf(m, nw) {
  const out = new Float64Array(nw);
  for (let j = 0; j < nw; j++) out[j] = gainAt(m, Math.PI * j / (nw - 1));
  return out;
}
function gainAt(m, W) {
  const [ar, ai] = poleOf(m);

    const px = X(fx(i)), py = Y(yv);
    if (!started) { ctx.moveTo(px, py); started = true; }
    else { if (steps) ctx.lineTo(px, lastY); ctx.lineTo(px, py); }
    lastY = py;
  }
  ctx.stroke(); ctx.setLineDash([]);
}
function withAlpha(color, a) {
  // Plain rgba() so that every browser's canvas accepts it (canvas support for color-mix() varies).
  const c = String(color).trim();
  let r, g, b;
  const m6 = /^#([0-9a-f]{6})$/i.exec(c), m3 = /^#([0-9a-f]{3})$/i.exec(c), mr = /^rgba?\(([^)]+)\)$/i.exec(c);
  if (m6) { const v = parseInt(m6[1], 16); r = v >> 16; g = (v >> 8) & 255; b = v & 255; }
  else if (m3) { r = parseInt(m3[1][0] + m3[1][0], 16); g = parseInt(m3[1][1] + m3[1][1], 16); b = parseInt(m3[1][2] + m3[1][2], 16); }
  else if (mr) { const q = mr[1].split(/[ ,/]+/).map(parseFloat); r = q[0]; g = q[1]; b = q[2]; }
  else return c;
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

/* ---------- small shared utilities ---------- */
const logMap = (lo, hi) => ({
  to: s => lo * Math.pow(hi / lo, s / 1000),
  from: v => Math.round(1000 * Math.log(v / lo) / Math.log(hi / lo))
});
const linMap = (lo, hi) => ({ to: s => lo + (hi - lo) * s / 1000, from: v => Math.round(1000 * (v - lo) / (hi - lo)) });
const el = id => document.getElementById(id);
// Figure numbers are fixed here and in the post. Renumber both if figures are added or moved.
const FIG_NUM = { 'fig-mode': 1, 'fig-latch': 2, 'fig-matrix': 3, 'fig-recall': 4, 'fig-attention': 5,
  'fig-heading': 6, 'fig-drift': 7, 'fig-position': 8, 'fig-trapezoid': 9, 'fig-rhythm': 10, 'fig-block': 11 };
function figName(id) { return 'Figure ' + (FIG_NUM[id] || '?'); }
// Math in labels and tooltips is typeset to SVG when the figure files are built, so nothing is typeset at runtime.
function typeset() { return Promise.resolve(); }
function setNote(id, html) { el(id).innerHTML = html; }
function cssVarVal(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
const TIPS = {};

/* ---------- embedding in the post ---------- */
// The post page, when this figure is shown in an iframe of it (same origin); null when opened on its own.
const PARENT = (() => { try { return window.parent !== window && window.parent.document ? window.parent : null; } catch (e) { return null; } })();
const FRAME = (() => { try { return window.frameElement; } catch (e) { return null; } })();
// Follow the light/dark theme of the post; on its own, follow the system setting.
function syncTheme() {
  let t = null;
  if (PARENT) t = PARENT.document.documentElement.getAttribute('data-theme');
  else if (window.matchMedia) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
  // A browser paints an opaque backdrop behind an iframe whose color-scheme differs from the page's, which would
  // hide the figure card in dark mode; so use exactly the scheme the iframe element gets from the page.
  if (FRAME) try { document.documentElement.style.colorScheme = PARENT.getComputedStyle(FRAME).colorScheme; } catch (e) { /* keep default */ }
}
// The iframe takes the height of the figure, so the figure never scrolls inside the post.
function fitFrame() {
  if (!FRAME) return;
  const h = Math.ceil(el('root').getBoundingClientRect().height) + 'px';
  if (FRAME.style.height !== h) FRAME.style.height = h;
}
// Links to other figures scroll the post, not the iframe.
document.addEventListener('click', e => {
  const a = e.target.closest('a.figref');
  if (!a) return;
  e.preventDefault();
  if (PARENT) PARENT.location.hash = a.getAttribute('href');
});
// Messages to the other figures of the post. Each figure sends "hello" when it starts and figures whose
// state others depend on answer with that state, so the order in which the iframes load does not matter.
const bus = (() => {
  const hs = {};
  window.addEventListener('message', e => {
    if (e.origin !== location.origin || !e.data || e.data.mambaFig !== 1) return;
    (hs[e.data.type] || []).forEach(f => f(e.data));
  });
  return {
    on(type, f) { (hs[type] = hs[type] || []).push(f); },
    send(type, data) {
      if (!PARENT) return;
      const msg = Object.assign({ mambaFig: 1, type }, data);
      for (let i = 0; i < PARENT.frames.length; i++) {
        const f = PARENT.frames[i];
        if (f !== window) try { f.postMessage(msg, location.origin); } catch (e) { /* not a figure */ }
      }
    }
  };
})();

/* ---------- tooltips ---------- */
const tipEl = document.createElement('div');
tipEl.id = 'tip'; tipEl.setAttribute('role', 'tooltip');
document.body.appendChild(tipEl);
let tipOwner = null;
function tipHTML(id) { const t = TIPS[id]; return typeof t === 'function' ? t() : t; }
function showTip(target) {
  const html = tipHTML(target.dataset.tip);
  if (!html) return;
  tipEl.innerHTML = html;
  tipOwner = target;
  placeTip(target);
  typeset(tipEl).then(() => { if (tipOwner === target) placeTip(target); });
}
function placeTip(target) {
  const r = target.getBoundingClientRect();
  const tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
  let x = r.left + r.width / 2 - tw / 2;
  x = Math.max(4, Math.min(window.innerWidth - tw - 4, x));
  let y = r.top - th - 8;
  if (y < 4) y = r.bottom + 8;
  // the figure is its own small window: keep the tip inside it
  y = Math.max(4, Math.min(window.innerHeight - th - 4, y));
  tipEl.style.transform = 'translate(' + Math.round(x) + 'px,' + Math.round(y) + 'px)';
  tipEl.classList.add('on');
}
function hideTip() { tipEl.classList.remove('on'); tipOwner = null; }
document.addEventListener('pointerover', e => {
  if (e.pointerType !== 'mouse') return;
  const t = e.target.closest('[data-tip]');
  if (t) { if (t !== tipOwner) showTip(t); }
  else if (tipOwner) hideTip();
});
document.addEventListener('focusin', e => { const t = e.target.closest('[data-tip]'); if (t) showTip(t); });
document.addEventListener('focusout', () => hideTip());
document.addEventListener('click', e => {
  const b = e.target.closest('.tipbtn');
  if (b) { e.preventDefault(); showTip(b); return; }
  if (!e.target.closest('[data-tip]')) hideTip();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
// the figure itself does not scroll, the page around it does
if (PARENT) PARENT.addEventListener('scroll', () => { if (tipOwner && !tipOwner.matches(':focus')) hideTip(); }, { passive: true });

/* ---------- guided tour ---------- */
// An optional walk through a figure. A button at the top of the figure starts it. Each step is a small panel
// next to the part of the figure it is about, which gets an outline, and "Show me" sets the figure up for the
// step. Steps: { title, text, at: selector the panel sits next to, mark: selectors to outline (default [at]),
// side: preferred side of the panel ('below', 'above', 'right', 'left'), show: function }.
function tour(steps) {
  const bar = document.createElement('div');
  bar.className = 'tourbar';
  bar.innerHTML = '<button type="button" class="mbtn tourbtn" aria-expanded="false">Guided tour</button>' +
    '<span class="tourlen">' + steps.length + ' steps through the figure</span>';
  el('root').prepend(bar);
  const btn = bar.querySelector('button');
  const box = document.createElement('div');
  box.id = 'tourbox'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-label', 'Guided tour');
  document.body.appendChild(box);
  let cur = -1, marked = [];

  function unmark() { marked.forEach(m => m.classList.remove('tour-mark')); marked = []; }
  function close() {
    if (cur < 0) return;
    cur = -1; unmark(); box.classList.remove('on');
    btn.setAttribute('aria-expanded', 'false');
    btn.focus({ preventScroll: true });
  }
  function go(i) {
    cur = i; unmark();
    const s = steps[i], last = i === steps.length - 1;
    box.innerHTML = '<button type="button" class="tclose" aria-label="Close the tour">×</button>' +
      '<div class="tstep">Step ' + (i + 1) + ' of ' + steps.length + '</div>' +
      '<div class="ttitle">' + s.title + '</div><div class="ttext">' + s.text + '</div>' +
      '<div class="tbtns">' + (i > 0 ? '<button type="button" class="mbtn" data-go="back">Back</button>' : '') +
      (s.show ? '<button type="button" class="mbtn" data-go="show">Show me</button>' : '') +
      '<button type="button" class="mbtn tnext" data-go="next">' + (last ? 'Done' : 'Next') + '</button></div>';
    for (const sel of s.mark || (s.at ? [s.at] : [])) document.querySelectorAll(sel).forEach(m => { m.classList.add('tour-mark'); marked.push(m); });
    box.classList.add('on');
    btn.setAttribute('aria-expanded', 'true');
    place(true);
    box.querySelector('.tnext').focus({ preventScroll: true });
  }
  // Put the panel on the first side where it fits without covering its target, then make sure the reader sees it.
  function place(scroll) {
    if (cur < 0) return;
    const s = steps[cur], t = (s.at && document.querySelector(s.at)) || btn;
    const r = t.getBoundingClientRect(), bw = box.offsetWidth, bh = box.offsetHeight, W = window.innerWidth, H = window.innerHeight, g = 12;
    const at = {
      below: [r.left + r.width / 2 - bw / 2, r.bottom + g], above: [r.left + r.width / 2 - bw / 2, r.top - bh - g],
      right: [r.right + g, r.top + r.height / 2 - bh / 2], left: [r.left - bw - g, r.top + r.height / 2 - bh / 2],
    };
    const fit = ([x, y]) => [Math.max(4, Math.min(W - bw - 4, x)), Math.max(4, Math.min(H - bh - 4, y))];
    const clear = ([x, y]) => x + bw <= r.left || x >= r.right || y + bh <= r.top || y >= r.bottom;
    let pos = null;
    for (const side of [s.side, 'below', 'above', 'right', 'left']) if (side && !pos && clear(fit(at[side]))) pos = fit(at[side]);
    pos = pos || fit(at.below);
    box.style.transform = 'translate(' + Math.round(pos[0]) + 'px,' + Math.round(pos[1]) + 'px)';
    if (scroll && PARENT && FRAME) {
      // the figure does not scroll, the post does: bring the panel and its target into the post's view
      const f = FRAME.getBoundingClientRect(), top = f.top + Math.min(pos[1], r.top), bot = f.top + Math.max(pos[1] + bh, r.bottom);
      const vh = PARENT.innerHeight, pad = 16;
      let dy = 0;
      if (bot - top > vh - 2 * pad) dy = top - pad;
      else if (top < pad) dy = top - pad;
      else if (bot > vh - pad) dy = bot - vh + pad;
      if (dy) PARENT.scrollBy({ top: dy, behavior: 'smooth' });
    }
  }
  btn.addEventListener('click', () => (cur < 0 ? go(0) : close()));
  box.addEventListener('click', e => {
    if (e.target.closest('.tclose')) { close(); return; }
    const b = e.target.closest('[data-go]');
    if (!b) return;
    const s = steps[cur];
    if (b.dataset.go === 'back') go(cur - 1);
    else if (b.dataset.go === 'show') { s.show(); requestAnimationFrame(() => place(false)); }
    else if (cur === steps.length - 1) close();
    else go(cur + 1);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  new ResizeObserver(() => place(false)).observe(el('root'));
}

/* ---------- boot ---------- */
function boot(draw) {
  const redraw = () => { readColors(); draw(); };
  syncTheme();
  redraw();
  let rsz = 0;
  new ResizeObserver(() => { cancelAnimationFrame(rsz); rsz = requestAnimationFrame(redraw); }).observe(document.body);
  new ResizeObserver(fitFrame).observe(el('root'));
  new MutationObserver(redraw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  if (PARENT) new PARENT.MutationObserver(syncTheme).observe(PARENT.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  else if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncTheme);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(redraw);
  fitFrame();
  bus.send('hello', {});
}

/* City drive of Parts 3 and 4, shared by Figures 7-9 (Figure 7 owns the heading settings). */
const s4 = { alpha: 0.5, bias: 0.5, noise: 10, gnoise: 3, dist: false, gate: false, fs10: 10 };
// Log slider from 0.01 to 20 per second, except that the leftmost position is exactly 0: the gyroscope alone
const alphaMap4 = (m => ({ to: v => (v <= 0 ? 0 : m.to(v)), from: a => (a <= 0 ? 0 : Math.max(1, m.from(a))) }))(logMap(0.01, 20));
const CURVE_A = Array.from({ length: 49 }, (_, i) => 0.01 * Math.pow(2000, i / 48));
const S4 = sample4(10);
let r4 = null, r10 = null;
const sec4 = fs => ({ xticks: [0, 10, 20, 30, 40, 50, 60].map(s => s * fs), xfmt: v => (v / fs).toFixed(0) + ' s', nx: 6, r: 14 });
function computeS4() {
  const P = { bias: s4.bias * Math.PI / 180, gnoise: s4.gnoise * Math.PI / 180, noise: s4.noise * Math.PI / 180, dist: s4.dist, gate: s4.gate, seed: 5 };
  const head = runHeadingBlend(S4, Object.assign({}, P, { alpha: s4.alpha }));
  const gyro = runHeadingBlend(S4, Object.assign({}, P, { alpha: 0 }));
  const curve = CURVE_A.map(a => rmsOf(runHeadingBlend(S4, Object.assign({}, P, { alpha: a })).err));
  const perfC = Float64Array.from(S4.th, Math.cos), perfS = Float64Array.from(S4.th, Math.sin);
  const pH = runPosition(S4, head.Hr, head.Hi, 'euler'), pG = runPosition(S4, gyro.Hr, gyro.Hi, 'euler'), pP = runPosition(S4, perfC, perfS, 'euler');
  r4 = { head, gyro, curve, pH, pG, pP, eH: posErr(S4, pH), eG: posErr(S4, pG), eP: posErr(S4, pP) };
}
function drawMap4(cv, S, tracks, zoom, truth) {
  const { ctx, w: cw, h: ch } = prep(cv);
  let cx, cy, span;
  if (zoom) { cx = zoom.cx; cy = zoom.cy; span = 2 * zoom.half; }
  else {
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (let i = 0; i < S.n; i++) { x0 = Math.min(x0, S.x[i]); x1 = Math.max(x1, S.x[i]); y0 = Math.min(y0, S.y[i]); y1 = Math.max(y1, S.y[i]); }
    for (const tr of tracks) for (let i = 0; i < S.n; i++) { x0 = Math.min(x0, tr.px[i]); x1 = Math.max(x1, tr.px[i]); y0 = Math.min(y0, tr.py[i]); y1 = Math.max(y1, tr.py[i]); }
    span = Math.max(x1 - x0, y1 - y0) * 1.12; cx = (x0 + x1) / 2; cy = (y0 + y1) / 2;
  }
  const S0 = Math.min(cw, ch), sc = S0 / span;
  const MX = v => cw / 2 + (v - cx) * sc, MY = v => ch / 2 - (v - cy) * sc;
  ctx.strokeStyle = COL.rule; ctx.lineWidth = 1; ctx.strokeRect(0.5, 0.5, cw - 1, ch - 1);
  ctx.save(); ctx.beginPath(); ctx.rect(1, 1, cw - 2, ch - 2); ctx.clip();
  const path = (px, py, col, lw, dash) => {
    ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();
    for (let i = 0; i < S.n; i++) { const a = MX(px[i]), b = MY(py[i]); if (i) ctx.lineTo(a, b); else ctx.moveTo(a, b); }
    ctx.stroke(); ctx.setLineDash([]);
  };
  path(S.x, S.y, truth || COL.ink, zoom ? 2 : truth ? 3 : 2.4);
  for (const tr of tracks) {
    path(tr.px, tr.py, tr.color, tr.lw || 1.8, tr.dash);
    // hollow markers of different shapes keep the tracks apart where their lines overlap
    if (zoom && tr.marker) {
      ctx.strokeStyle = tr.color; ctx.lineWidth = 1.8; const r = tr.r || 5;
      for (let i = 0; i < S.n; i++) {
        const a = MX(tr.px[i]), b = MY(tr.py[i]); ctx.beginPath();
        if (tr.marker === 'square') ctx.rect(a - r, b - r, 2 * r, 2 * r); else ctx.arc(a, b, r, 0, 2 * Math.PI);
        ctx.stroke();
      }
    }
  }
  if (zoom) { ctx.fillStyle = COL.ink; for (let i = 0; i < S.n; i++) { ctx.beginPath(); ctx.arc(MX(S.x[i]), MY(S.y[i]), 3.5, 0, 2 * Math.PI); ctx.fill(); } }
  else {
    ctx.fillStyle = COL.muted; ctx.beginPath(); ctx.arc(MX(S.x[0]), MY(S.y[0]), 3.5, 0, 2 * Math.PI); ctx.fill();
    ctx.font = FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText('start', MX(S.x[0]) + 6, MY(S.y[0]) + 4);
  }
  ctx.restore();
  const bar = Math.pow(10, Math.floor(Math.log10(span / 3)));
  const barLen = (span / 3 >= 5 * bar ? 5 : span / 3 >= 2 * bar ? 2 : 1) * bar;
  ctx.strokeStyle = COL.muted; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cw - 10 - barLen * sc, ch - 10); ctx.lineTo(cw - 10, ch - 10); ctx.stroke();
  ctx.fillStyle = COL.muted; ctx.font = FONT; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
  ctx.fillText((barLen >= 1 ? barLen : barLen.toPrecision(1)) + ' m', cw - 10, ch - 14);
}

function computeS10() {
  const S = sample4(s4.fs10);
  const c = Float64Array.from(S.th, Math.cos), s = Float64Array.from(S.th, Math.sin);
  const pE = runPosition(S, c, s, 'euler'), pT = runPosition(S, c, s, 'trap');
  r10 = { S, pE, pT, eE: posErr(S, pE), eT: posErr(S, pT) };
}
function drawS10() {
  if (!r10) return;
  const { S, pE, pT, eE, eT } = r10, n = S.n;
  drawMap4(el('s10map'), S, [{ px: pE.px, py: pE.py, color: COL.real, lw: 1.8 }, { px: pT.px, py: pT.py, color: COL.cplx, lw: 1.8 }]);
  const half = Math.max(1.5, 1.4 * Math.max(eE[n - 1], eT[n - 1]));
  drawMap4(el('s10zoom'), S, [{ px: pE.px, py: pE.py, color: COL.real, lw: 1.2, marker: 'circle', r: 4.5 }, { px: pT.px, py: pT.py, color: COL.cplx, lw: 1.2, marker: 'square', r: 4.5 }], { cx: S.x[n - 1], cy: S.y[n - 1], half });
  const { ctx, w, h } = prep(el('s10err'));
  const L = v => Math.log10(Math.max(1e-4, v));
  const { X, Y } = frame(ctx, w, h, [0, n - 1], [-4, 1.2], Object.assign({ ny: 5, yfmt: v => (v >= 0 ? Math.pow(10, v).toFixed(0) : Math.pow(10, v).toPrecision(1)) }, sec4(S.fs)));
  polyline(ctx, X, Y, n, i => i, i => L(eE[i]), COL.real, 1.8);
  polyline(ctx, X, Y, n, i => i, i => L(eT[i]), COL.cplx, 1.8);
  {
    // speed and acceleration of the drive, drawn at a fixed fine rate on the same time axis
    const { ctx, w, h } = prep(el('s10va')), fs = 20, m = 60 * fs + 1;
    const { X, Y } = frame(ctx, w, h, [0, m - 1], [0, 11], Object.assign({ ny: 2 }, sec4(fs)));
    polyline(ctx, X, Y, m, i => i, i => accelCity4(i / fs), COL.muted, 1.6);
    polyline(ctx, X, Y, m, i => i, i => speedCity4(i / fs), COL.base, 1.6);
  }
  el('s10ee').textContent = eE[n - 1].toFixed(2) + ' m';
  el('s10et').textContent = eT[n - 1] < 0.1 ? (eT[n - 1] * 100).toFixed(1) + ' cm' : eT[n - 1].toFixed(2) + ' m';
  const mt = Math.max(...eT);
  el('s10mt').textContent = mt < 0.1 ? (mt * 100).toFixed(1) + ' cm' : mt.toFixed(2) + ' m';
  document.querySelectorAll('#s10rates button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.fs === s4.fs10)));
}
Object.assign(TIPS, {
  's10-map': '<b>Top view.</b> The true path and both integrations. At high sampling rates they overlap, at 1 Hz the Euler path visibly drifts.',
  's10-zoom': '<b>Zoom.</b> The last metres of the drive, with a marker at every sample. Black dots for the true path, blue circles for Euler, orange squares for the trapezoid. The scale bar in the corner shows how far apart the estimates are.',
  's10-err': '<b>Error on a log scale.</b> The Euler estimate runs half a step of travel ahead, so its error follows the speed and nearly vanishes at the stop. The trapezoidal error follows the acceleration, peaking in turns and braking. It shrinks with the square of the step, it is tiny at 10 Hz and large at 1 Hz.',
  's10-va': '<b>Speed and acceleration.</b> Magenta: the speed of the car in m/s. Grey: acceleration in m/s², which includes braking and speeding up as well as the sideways pull in the turns. Compare their shapes with the two error curves above.',
  's10-rate': '<b>Sampling rate.</b> How often the gyroscope and speed are sampled. Lower rates mean longer steps over which the velocity changes more.'
});
document.querySelectorAll('#s10rates button').forEach(b => b.addEventListener('click', () => { s4.fs10 = +b.dataset.fs; computeS10(); drawS10(); }));
computeS10();
boot(drawS10);
})();
</script>
