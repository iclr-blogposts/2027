.tok .tn small {

}

  overflow: hidden;

  #pole {

  canvas.sq {

    path(tr.px, tr.py, tr.color, tr.lw || 1.8, tr.dash);
    // hollow markers of different shapes keep the tracks apart where their lines overlap
    if (zoom && tr.marker) {
      ctx.strokeStyle = tr.color; ctx.lineWidth = 1.8; const r = tr.r || 5;
      for (let i = 0; i < S.n; i++) {
        const a = MX(tr.px[i]), b = MY(tr.py[i]); ctx.beginPath();
        if (tr.marker === 'square') ctx.rect(a - r, b - r, 2 * r, 2 * r); else ctx.arc(a, b, r, 0, 2 * Math.PI);
        ctx.stroke();
      }
    }
  }
  if (zoom) { ctx.fillStyle = COL.ink; for (let i = 0; i < S.n; i++) { ctx.beginPath(); ctx.arc(MX(S.x[i]), MY(S.y[i]), 3.5, 0, 2 * Math.PI); ctx.fill(); } }
  else {
    ctx.fillStyle = COL.muted; ctx.beginPath(); ctx.arc(MX(S.x[0]), MY(S.y[0]), 3.5, 0, 2 * Math.PI); ctx.fill();
    ctx.font = FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText('start', MX(S.x[0]) + 6, MY(S.y[0]) + 4);
  }
  ctx.restore();
  const bar = Math.pow(10, Math.floor(Math.log10(span / 3)));
  const barLen = (span / 3 >= 5 * bar ? 5 : span / 3 >= 2 * bar ? 2 : 1) * bar;
  ctx.strokeStyle = COL.muted; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cw - 10 - barLen * sc, ch - 10); ctx.lineTo(cw - 10, ch - 10); ctx.stroke();
  ctx.fillStyle = COL.muted; ctx.font = FONT; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
  ctx.fillText((barLen >= 1 ? barLen : barLen.toPrecision(1)) + ' m', cw - 10, ch - 14);
}

function drawS8() {
  if (!r4) return;
  const { head, gyro, curve } = r4, n = S4.n, O = COL.cplx, ax = sec4(10);
  const shade = (ctx, X, m, h) => {
    ctx.fillStyle = withAlpha(COL.muted, 0.14);
    for (let i = 0; i < n; i++) if (head.flag[i] && !head.flag[i - 1]) {
      let j = i; while (j + 1 < n && head.flag[j + 1]) j++;
      ctx.fillRect(X(i - 0.5), m.t, X(j + 0.5) - X(i - 0.5), h - m.t - m.b);
    }
  };
  {
    const { ctx, w, h } = prep(el('s8err'));
    const yr = autoRange([head.err, gyro.err, head.cerr.map(v => Math.max(-45, Math.min(45, v)))], true, 0.06);
    const { X, Y, m } = frame(ctx, w, h, [0, n - 1], yr, Object.assign({ b: 20 }, ax));
    shade(ctx, X, m, h);
    ctx.fillStyle = withAlpha(COL.muted, 0.55);
    for (let i = 1; i < n; i++) { const v = head.cerr[i]; if (v >= yr[0] && v <= yr[1]) { ctx.beginPath(); ctx.arc(X(i), Y(v), 1.6, 0, 2 * Math.PI); ctx.fill(); } }
    polyline(ctx, X, Y, n, i => i, i => gyro.err[i], COL.base, 1.6);
    polyline(ctx, X, Y, n, i => i, i => head.err[i], O, 2);
  }
  {
    const { ctx, w, h } = prep(el('s8rad'));
    const lo = Math.min(...head.rad);
    const yr = [Math.max(0, lo - (1 - lo) * 0.4 - 1e-3), 1 + (1 - lo) * 0.25 + 1e-3];
    const { X, Y, m } = frame(ctx, w, h, [0, n - 1], yr, Object.assign({ b: 20, t: 6, ny: 2, yfmt: v => v.toFixed(3) }, ax));
    shade(ctx, X, m, h);
    polyline(ctx, X, Y, n, i => i, i => head.rad[i], O, 1.8, null, true);
  }
  {
    const { ctx, w, h } = prep(el('s8curve'));
    const L = Math.log10, cmp = rmsOf(head.cerr), g0 = rmsOf(gyro.err);
    const yr = [0, Math.max(...curve, cmp, g0) * 1.1];
    const { X, Y } = frame(ctx, w, h, [L(CURVE_A[0]), L(CURVE_A[CURVE_A.length - 1])], yr, { xticks: [-2, -1, 0, 1], xfmt: v => String(+Math.pow(10, v).toPrecision(1)), b: 20 });
    const hl = (v, col) => { ctx.strokeStyle = col; ctx.lineWidth = 1.3; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.moveTo(X(-2), Y(v)); ctx.lineTo(X(L(20)), Y(v)); ctx.stroke(); ctx.setLineDash([]); };
    hl(g0, COL.base); hl(cmp, COL.muted);
    polyline(ctx, X, Y, curve.length, i => L(CURVE_A[i]), i => curve[i], O, 2);
    // alpha = 0 has no place on the log axis; its error is the dashed gyroscope-alone line, so the dot sits on that
    // line at the left edge, labelled
    const cur = rmsOf(head.err), cx = s4.alpha > 0 ? X(L(s4.alpha)) : X(-2);
    ctx.fillStyle = O; ctx.beginPath(); ctx.arc(cx, Y(cur), 5.5, 0, 2 * Math.PI); ctx.fill();
    ctx.strokeStyle = COL.panel; ctx.lineWidth = 2; ctx.stroke();
    if (s4.alpha === 0) { ctx.font = FONT; ctx.fillStyle = COL.muted; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.fillText('α = 0', cx + 9, Y(cur) - 4); }
    let k = 0; for (let i = 1; i < curve.length; i++) if (curve[i] < curve[k]) k = i;
    ctx.font = FONT; ctx.fillStyle = COL.muted; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText('best ≈ ' + CURVE_A[k].toPrecision(2), X(L(CURVE_A[k])), Y(curve[k]) - 8);
  }
  const absMax = e => Math.max(...Array.from(e, Math.abs));
  el('s8rg').textContent = rmsOf(gyro.err).toFixed(1) + '°';
  el('s8rc').textContent = rmsOf(head.cerr).toFixed(1) + '°';
  el('s8rh').textContent = rmsOf(head.err).toFixed(1) + '°';
  el('s8maxh').textContent = absMax(head.err).toFixed(1) + '°';
  el('s8oal').textContent = s4.alpha === 0 ? '0 (gyroscope alone)' : s4.alpha.toPrecision(2) + ' /s';
  el('s8obias').textContent = s4.bias.toFixed(2) + ' °/s';
  el('s8onoise').textContent = s4.noise.toFixed(0) + '°';
  const r = Math.exp(-s4.alpha * S4.dt);
  el('s8read').innerHTML = 'Pole radius e<sup>−αΔ</sup> = <b>' + r.toFixed(4) + '</b>: each step keeps <b>' + (100 * r).toFixed(1) + '%</b> of the rotated estimate and gives the compass reading a weight of <b>' + (1 - r).toFixed(4) +
    '</b>. ' + (s4.alpha === 0 ? 'The pole stays on the unit circle and the compass is ignored: the gyroscope alone.' : 'Memory 1/α = <b>' + (1 / s4.alpha).toPrecision(2) + ' s</b>.') + (s4.dist && s4.gate ? ' On flagged steps the radius is 1 and nothing is written.' : '');
  document.querySelectorAll('#s8dist button').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.v === '1') === s4.dist)));
  document.querySelectorAll('#s8gate button').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.v === '1') === s4.gate)));
  document.querySelectorAll('#s8gate button').forEach(b => { b.disabled = !s4.dist; });
}
Object.assign(TIPS, {
  's8-err': '<b>Heading error.</b> Estimated minus true heading, in degrees. Magenta: the gyroscope integrated alone, drifting with its bias and noise. Grey dots: the error of each raw compass reading. Orange: this head. Grey bands mark steps on which the compass is disturbed and flagged.',
  's8-rad': '<b>Pole radius.</b> <mjx-container class="MathJax" jax="SVG"><svg aria-label="|\\bar a_t|" style="vertical-align: -0.564ex;" xmlns="http://www.w3.org/2000/svg" width="3.22ex" height="2.26ex" role="img" focusable="false" viewBox="0 -749.5 1423.3 999" xmlns:xlink="http://www.w3.org/1999/xlink"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g><g transform="translate(0 -0.5)"><use xlink:href="#MJX-TEX-N-7C"></use></g><g transform="translate(278,0)"><g><g><g><use xlink:href="#MJX-TEX-I-1D44E"></use></g><g transform="translate(264.5,3) translate(-250 0)"><use xlink:href="#MJX-TEX-N-AF"></use></g></g></g><g transform="translate(562,-150) scale(0.707)"><use xlink:href="#MJX-TEX-I-1D461"></use></g></g><g transform="translate(1145.3,0) translate(0 -0.5)"><use xlink:href="#MJX-TEX-N-7C"></use></g></g></g></svg></mjx-container>, the fraction of the rotated old estimate that is kept at each step, and the compass reading gets the rest. It stays constant unless the gate is on, in which case it jumps to 1 on flagged steps: trust the gyroscope alone.',

 -442 640 453" xmlns:xlink="http://www.w3.org/1999/xlink"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g><g><use xlink:href="#MJX-TEX-I-1D6FC"></use></g></g></g></svg></mjx-container> inherits the drift, large <mjx-container class="MathJax" jax="SVG"><svg aria-label="\\alpha" style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="1.448ex" height="1.025ex" role="img" focusable="false" viewBox="0 -442 640 453" xmlns:xlink="http://www.w3.org/1999/xlink"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g><g><use xlink:href="#MJX-TEX-I-1D6FC"></use></g></g></g></svg></mjx-container> the compass noise, the minimum lies in between.',
  's8-alpha': '<b>Decay rate <mjx-container class="MathJax" jax="SVG"><svg aria-label="\\alpha" style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="1.448ex" height="1.025ex" role="img" focusable="false" viewBox="0 -442 640 453" xmlns:xlink="http://www.w3.org/1999/xlink"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g><g><use xlink:href="#MJX-TEX-I-1D6FC"></use></g></g></g></svg></mjx-container></b>, in 1/s. Sets the pole radius <mjx-container class="MathJax" jax="SVG"><svg aria-label="e^{-\\alpha\\Delta}" style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="4.843ex" height="1.992ex" role="img" focusable="false" viewBox="0 -869.3 2140.7 880.3" xmlns:xlink="http://www.w3.org/1999/xlink"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g><g><g><use xlink:href="#MJX-TEX-I-1D452"></use></g><g transform="translate(499,363) scale(0.707)"><g><use xlink:href="#MJX-TEX-N-2212"></use></g><g transform="translate(778,0)"><use xlink:href="#MJX-TEX-I-1D6FC"></use></g><g transform="translate(1418,0)"><use xlink:href="#MJX-TEX-N-394"></use></g></g></g></g></g></svg></mjx-container> and so the time scale, about <mjx-container class="MathJax" jax="SVG"><svg aria-label="1/\\alpha" style="vertical-align: -0.566ex;" xmlns="http://www.w3.org/2000/svg" width="3.71ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 1640 1000" xmlns:xlink="http://www.w3.org/1999/xlink"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g><g><use xlink:href="#MJX-TEX-N-31"></use></g><g transform="translate(500,0)"><g><use xlink:href="#MJX-TEX-N-2F"></use></g></g><g transform="translate(1000,0)"><use xlink:href="#MJX-TEX-I-1D6FC"></use></g></g></g></svg></mjx-container> seconds, over which the head trusts the gyroscope before the compass takes over. The slider is logarithmic, except that its leftmost position is exactly <mjx-container class="MathJax" jax="SVG"><svg aria-label="\\alpha = 0" style="vertical-align: -0.186ex;" xmlns="http://www.w3.org/2000/svg" width="5.596ex" height="1.692ex" role="img" focusable="false" viewBox="0 -666 2473.6 748" xmlns:xlink="http://www.w3.org/1999/xlink"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g><g><use xlink:href="#MJX-TEX-I-1D6FC"></use></g><g transform="translate(917.8,0)"><use xlink:href="#MJX-TEX-N-3D"></use></g><g transform="translate(1973.6,0)"><use xlink:href="#MJX-TEX-N-30"></use></g></g></g></svg></mjx-container>: the gyroscope alone.',
  's8-bias': '<b>Gyroscope bias.</b> The constant rate error of the gyroscope, in degrees per second. Over 60 s a bias of b °/s adds up to 60·b degrees of drift. On top of the bias, every gyroscope reading carries white noise of 3 °/s (0.3° per step at 10 Hz), so even with zero bias the integrated heading wanders off in a random walk. More bias moves the best <mjx-container class="MathJax" jax="SVG"><svg aria-label="\\alpha" style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="1.448ex" height="1.025ex" role="img" focusable="false" viewBox="0 -442 640 453" xmlns:xlink="http://www.w3.org/1999/xlink"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g><g><use xlink:href="#MJX-TEX-I-1D6FC"></use></g></g></g></svg></mjx-container> up.',

  's8-dist-off': '<b>No disturbances.</b> Every compass reading is the true heading plus noise.',

function s8update() { computeS4(); drawS8(); sendS4(); }
document.querySelectorAll('#s8dist button').forEach(b => b.addEventListener('click', () => { s4.dist = b.dataset.v === '1'; s8update(); }));
document.querySelectorAll('#s8gate button').forEach(b => b.addEventListener('click', () => { s4.gate = b.dataset.v === '1'; s8update(); }));
el('s8al').value = alphaMap4.from(s4.alpha);
el('s8al').addEventListener('input', () => { s4.alpha = alphaMap4.to(+el('s8al').value); s8update(); });
el('s8bias').addEventListener('input', () => { s4.bias = +el('s8bias').value; s8update(); });
el('s8noise').addEventListener('input', () => { s4.noise = +el('s8noise').value; s8update(); });

// Figure 8 integrates the heading of this head.
function sendS4() { bus.send('s4', { s4: Object.assign({}, s4) }); }
bus.on('hello', sendS4);
computeS4();
boot(drawS8);
})();
