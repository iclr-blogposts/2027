<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PPM vs. Halpern on a simpler two-dimensional linear operator</title><style>
*{box-sizing:border-box}body{margin:0;background:transparent;color:#20394b;font:14px/1.5 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:8px}.animation-title{font-size:17px;line-height:1.4;font-weight:600;margin:0 0 14px}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}button,select{font:inherit;color:inherit;background:#fff;border:1px solid #cad8df;border-radius:6px;padding:7px 10px;cursor:pointer}button.primary{background:#203b50;color:white}input{accent-color:#247ca0}input[type=range]{flex:1;min-width:100px}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #4ca6c3;outline-offset:2px}.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px;font-size:12px}.legend i{display:inline-block;width:15px;height:3px;vertical-align:middle;margin-right:5px}.plots{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{min-width:0;background:#fff;border:1px solid #dce5eb;border-radius:10px;padding:12px}h2{font-size:16px;margin:0 0 4px;font-weight:600}.sub{font-size:12px;color:#607383;margin:0;min-height:36px}canvas{width:100%;height:330px;display:block}.values{font-size:12px;color:#607383;font-variant-numeric:tabular-nums;margin:4px 0 0}#scrublabel{min-width:48px}.example-label{display:flex;align-items:center;gap:8px}select{max-width:100%}@media(max-width:700px){.plots{grid-template-columns:1fr}canvas{height:300px}.example-label{flex-wrap:wrap}.controls{gap:8px}main{padding:4px}}
</style></head><body><main>
<h1 class="animation-title">PPM vs. Halpern on a simpler two-dimensional linear operator</h1>
<div class="controls"><label class="example-label" for="example">Example <select id="example"><option value="slow">Slow rotation (a = 0, ω = 0.12)</option><option value="fast">Faster rotation (a = 0, ω = 0.30)</option><option value="contract">Strong contraction (a = 0.50, ω = 0.12)</option></select></label></div>
<div class="controls"><button id="play" class="primary">Play</button><button id="restart">Restart</button><label for="time" id="scrublabel">t = 40</label><input type="range" id="time" min="0" max="160" step="1" value="40" aria-label="Iteration"><button id="next">Next step</button></div>
<div class="legend"><span><i style="background:#d27935"></i>PPM</span><span><i style="background:#247ca0"></i>Halpern</span><span><i style="background:#8463b0"></i>Anchor x₀</span></div>
<div class="plots"><section class="panel"><h2>Iterate trajectories</h2><p class="sub">F(u,v) = (au − ωv, ωu + av), η = 1.<br>Dashed segments: current proximal steps.</p><canvas id="geometry" role="img" aria-label="Computed PPM and Halpern trajectories"></canvas></section><section class="panel"><h2>Proximal residual</h2><p class="sub">resη(xₜ) = ‖xₜ − Pη(xₜ)‖ / η = Rₜ here.<br>Gray dashed line: Halpern bound 2/(t+1).</p><canvas id="residual" role="img" aria-label="Computed PPM and Halpern proximal residuals on a logarithmic vertical axis"></canvas><p class="values">PPM: <span id="rp"></span> · Halpern: <span id="rh"></span></p></section></div>
</main><script>
'use strict';
const $=id=>document.getElementById(id),cs=[$('geometry'),$('residual')],cx=cs.map(c=>c.getContext('2d'));const orange='#d27935',blue='#247ca0',purple='#8463b0',ink='#1c3142',gray='#607383';let a=0,w=.12,t=40,run=false,last=0,elapsed=0;const N=160;let Z=[],X=[],RP=[],RH=[],SP=[],SH=[];
const norm=v=>Math.hypot(...v),sub=(x,y)=>x.map((v,i)=>v-y[i]);
function P([u,v]){let b=1+a,d=b*b+w*w;return [(b*u+w*v)/d,(-w*u+b*v)/d]}
function build(){Z=[[1,0]];X=[[1,0]];RP=[];RH=[];SP=[];SH=[];for(let i=0;i<=N;i++){let zp=P(Z[i]),xp=P(X[i]);RP.push(norm(sub(Z[i],zp)));RH.push(norm(sub(X[i],xp)));SP.push(RP[i]+(SP[i-1]||0));SH.push(RH[i]+(SH[i-1]||0));Z.push(zp);X.push([(1+(i+1)*xp[0])/(i+2),(i+1)*xp[1]/(i+2)])}}
function text(c,s,x,y,col=gray,size=12){c.fillStyle=col;c.font=`${size}px system-ui`;c.fillText(s,x,y)}
function line(c,p,q,col,width=1,dash=[]){c.setLineDash(dash);c.beginPath();c.moveTo(...p);c.lineTo(...q);c.strokeStyle=col;c.lineWidth=width;c.stroke();c.setLineDash([])}
function dot(c,p,col,r=5){c.beginPath();c.arc(...p,r,0,2*Math.PI);c.fillStyle=col;c.fill()}
function paint(){let c=cx[0],g=cx[1];let W=cs[0].clientWidth,H=cs[0].clientHeight;c.clearRect(0,0,W,H);let scale=Math.min((W-60)/2.4,(H-55)/2.4),origin=[W/2,H/2-2],map=([u,v])=>[origin[0]+scale*u,origin[1]-scale*v];line(c,[20,origin[1]],[W-15,origin[1]],'#e0e7eb');line(c,[origin[0],20],[origin[0],H-25],'#e0e7eb');c.beginPath();c.arc(...origin,scale,0,2*Math.PI);c.strokeStyle='#e1e8ec';c.stroke();text(c,'u',W-15,origin[1]-8);text(c,'v',origin[0]+8,20);for(let i=1;i<=t;i++){line(c,map(Z[i-1]),map(Z[i]),orange,2);line(c,map(X[i-1]),map(X[i]),blue,2)}line(c,map(Z[t]),map(P(Z[t])),orange,2,[3,3]);line(c,map(X[t]),map(P(X[t])),blue,2,[3,3]);dot(c,map(P(Z[t])),orange,2);dot(c,map(P(X[t])),blue,2);dot(c,origin,ink,3);text(c,'solution',origin[0]-52,origin[1]+17,ink);dot(c,map(Z[t]),orange,6);dot(c,map(X[t]),blue,5);dot(c,map([1,0]),purple,4);text(c,'x₀',map([1,0])[0]+7,origin[1]-12,purple);
W=cs[1].clientWidth;H=cs[1].clientHeight;g.clearRect(0,0,W,H);let L=48,R=W-15,top=24,bot=H-40;let logTop=Math.log10(2),logMin=-6,map2=(i,v)=>[L+i/N*(R-L),top+(logTop-Math.log10(Math.max(1e-6,v)))/(logTop-logMin)*(bot-top)];for(let e of [0,-2,-4,-6]){let y=map2(0,10**e)[1];line(g,[L,y],[R,y],'#e0e7eb');text(g,'1e'+e,5,y+4)}for(let i of [0,40,80,120,160]){let x=map2(i,1)[0];text(g,String(i),x-7,bot+22)}text(g,'Iteration t',W/2-28,H-3);for(let i=1;i<=N;i++)line(g,map2(i-1,2/i),map2(i,2/(i+1)),'#a4b0b8',1,[3,3]);for(let i=1;i<=t;i++){line(g,map2(i-1,RP[i-1]),map2(i,RP[i]),orange,2.5);line(g,map2(i-1,RH[i-1]),map2(i,RH[i]),blue,2.5)}line(g,[map2(t,1)[0],top],[map2(t,1)[0],bot],'#d2dce1',1,[2,3]);dot(g,map2(t,RP[t]),orange,4);dot(g,map2(t,RH[t]),blue,4);$('rp').textContent=RP[t].toExponential(2);$('rh').textContent=RH[t].toExponential(2);$('scrublabel').textContent='t = '+t;$('time').value=t;}
function resize(){for(let i=0;i<cs.length;i++){let c=cs[i],r=c.getBoundingClientRect();c.width=Math.round(r.width*devicePixelRatio);c.height=Math.round(r.height*devicePixelRatio);cx[i].setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}paint()}
function stop(){run=false;$('play').textContent='Play'}
$('example').onchange=()=>{let s=$('example').value;a=s==='contract'?.5:0;w=s==='fast'?.3:.12;t=0;elapsed=0;stop();build();paint()};$('play').onclick=()=>{if(t===N)t=0;run=!run;elapsed=0;$('play').textContent=run?'Pause':'Play';paint()};$('restart').onclick=()=>{t=0;stop();paint()};$('next').onclick=()=>{t=Math.min(N,t+1);stop();paint()};$('time').oninput=e=>{t=+e.target.value;stop();paint()};function frame(now){if(run){elapsed+=Math.min(100,now-last);if(elapsed>=130){t=Math.min(N,t+1);elapsed-=130;paint();if(t===N)stop()}}last=now;requestAnimationFrame(frame)}build();new ResizeObserver(resize).observe(document.querySelector('.plots'));resize();requestAnimationFrame(frame);

</script></body></html>
