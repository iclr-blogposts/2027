<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Linear function smoke-test widget</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; color: #333; background: #fff; }
      main { max-width: 760px; margin: 0 auto; padding: 16px; }
      .controls { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
      label { font-weight: 600; }
      input { flex: 1; min-width: 120px; accent-color: #2698ba; }
      output { min-width: 3.5em; font-variant-numeric: tabular-nums; }
      svg { display: block; width: 100%; height: auto; border: 1px solid #e6e6e6; background: #f7f7f7; }
      .axis { stroke: #999; stroke-width: 1.5; }
      #line { stroke: #2698ba; stroke-width: 4; stroke-linecap: round; }
      text { fill: #666; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <div class="controls">
        <label for="slope">Slope</label>
        <input id="slope" type="range" min="-2" max="2" step="0.1" value="1" />
        <output id="value" for="slope">1.0</output>
      </div>
      <svg viewBox="0 0 720 270" role="img" aria-labelledby="plot-title plot-description">
        <title id="plot-title">Interactive linear function</title>
        <desc id="plot-description">The slider controls the slope of y equals a x.</desc>
        <line class="axis" x1="40" y1="135" x2="680" y2="135" />
        <line class="axis" x1="360" y1="20" x2="360" y2="250" />
        <line id="line" x1="80" y1="235" x2="640" y2="35" />
        <text x="650" y="126">x</text>
        <text x="369" y="32">y</text>
        <text id="formula" x="52" y="30">y = 1.0x</text>
      </svg>
    </main>
    <script>
      const slider = document.querySelector("#slope");
      const value = document.querySelector("#value");
      const line = document.querySelector("#line");
      const formula = document.querySelector("#formula");
      function update() {
        const slope = Number(slider.value);
        const halfRun = 280;
        const scale = 50;
        line.setAttribute("x1", 360 - halfRun);
        line.setAttribute("x2", 360 + halfRun);
        line.setAttribute("y1", 135 + slope * scale);
        line.setAttribute("y2", 135 - slope * scale);
        value.value = slope.toFixed(1);
        formula.textContent = `y = ${slope.toFixed(1)}x`;
      }
      slider.addEventListener("input", update);
      update();
    </script>
  </body>
</html>
