<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cars on a road: how many there are per km</title>
<style>
/* Styles of a figure page. The palette and the widget rules are those of the lecture deck (shared/deck.css there);
   the colours are the dark ones, and theme.js maps them to the light ones when the page URL has ?light. */
:root {
  --bg: #15171c;
  --bg-2: #1e2128;
  --bg-3: #272b34;
  --fg: #e7e9ee;
  --fg-dim: #9aa1ae;
  --accent: #f2b134;
  --blue: #5ab0ff;
  --red: #ff6b6b;
  --green: #5fd38d;
  --purple: #b28dff;
  --line: #3a3f4b;
  --mono: "JetBrains Mono", "Fira Code", ui-monospace, monospace;
  --sans: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}
html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; -webkit-text-size-adjust: 100%; }
#stage { position: absolute; top: 0; left: 0; transform-origin: 0 0; width: max-content; }   /* its own width, whatever the width of the frame: the figure is scaled, not laid out again */
.reveal { display: inline-block; font-family: var(--sans); font-size: 23px; color: var(--fg); line-height: 1.3; text-align: left; }
.reveal section { display: block; }
.reveal p { margin: 0.4em 0; line-height: 1.4; }
.reveal strong, .reveal b { color: var(--accent); font-weight: 600; }
.reveal small, .reveal .small { font-size: 0.7em; color: var(--fg-dim); }
.reveal .dim { color: var(--fg-dim); }
.reveal .red { color: var(--red); }
.reveal .green { color: var(--green); }
.reveal .blue { color: var(--blue); }
.reveal .accent { color: var(--accent); }
.box { background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 0.5em 0.8em; }

/* widgets */
.widget { font-size: 0.7em; color: var(--fg); }
.widget canvas { display: block; background: var(--bg-2); border: 1px solid var(--line); border-radius: 8px; }
.widget .wctl { display: flex; flex-wrap: wrap; gap: 0.35em; align-items: center; margin-top: 0.4em; }
.widget button {
  font: inherit; color: var(--fg); background: var(--bg-3);
  border: 1px solid var(--line); border-radius: 6px; padding: 0.2em 0.6em; cursor: pointer;
}
.widget button:hover { border-color: var(--accent); }
.widget button.active { border-color: var(--accent); color: var(--accent); }
.widget input[type=number] {
  font: inherit; font-family: var(--mono); width: 4.2em; color: var(--fg);
  background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 0.1em 0.25em; text-align: right;
}
.widget input[type=range] { accent-color: var(--accent); width: 11em; }
.widget label { color: var(--fg-dim); }
.widget .readout { font-family: var(--mono); color: var(--fg-dim); }

/* the three steps of numerical integration, highlighted in turn */
[data-integration-step] { opacity: 0.45; border-color: var(--line); transition: opacity 0.15s, border-color 0.15s; }
[data-integration-step].active { opacity: 1; border-color: var(--blue); }
[data-integration-step="2"].active { border-color: var(--accent); }

/* the chain A⁰ → A^τ → A¹ next to the action-chunk figure */
.pichain [data-pi] { padding: 0.1em 0.7em; border-radius: 10px; border: 2px solid transparent; transition: background 0.15s, border-color 0.15s; }
.pichain [data-pi].on { border-color: var(--accent); background: rgba(242, 177, 52, 0.14); }

/* the four ingredients of a training step, highlighted in turn by the training picture */
[data-train-step] { opacity: 0.45; transition: opacity 0.15s, border-color 0.15s; }
[data-train-step].active { opacity: 1; border-color: var(--fg-dim); }
[data-train-step="2"].active { border-color: var(--blue); }
[data-train-step="3"].active { border-color: var(--accent); }

/* layout helpers of the deck that figure pages use */
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2em; align-items: start; }
.cols > * { min-width: 0; }

/* steps: an element of the class `fragment` is there once the step bar has reached it */
.reveal .fragment { opacity: 0; visibility: hidden; transition: opacity 0.25s; }
.reveal .fragment.visible { opacity: 1; visibility: inherit; }
.stepbar { display: flex; align-items: center; gap: 0.6em; margin-top: 0.55em; font-size: 0.7em; min-height: 1.9em; box-sizing: border-box; line-height: 1.25; }
.stepbar button { font: inherit; color: var(--fg); background: var(--bg-3); border: 1px solid var(--line); border-radius: 6px; padding: 0.2em 0.7em; cursor: pointer; white-space: nowrap; }
.stepbar button:hover:not(:disabled) { border-color: var(--accent); }
.stepbar button.go { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.stepbar button:disabled { opacity: 0.4; cursor: default; }
.stepbar .count { color: var(--fg-dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
.stepbar .label { color: var(--fg); }

/* diagrams drawn as SVG */
.diagram svg { display: block; }
</style>
</head>
