<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DGM lineage and curriculum scoreboard</title>
<style>
  /* Tokens from the reference data-viz palette. The figure is a white card on purpose:
     the blog renders dark, and accepted posts embed white figures on it. */
  .viz-root {
    color-scheme: light;
    --surface-1: #fcfcfb; --surface-2: #f3f2ee; --line: #dddcd6; --grid: #ecebe6;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #8a8984;
    --solved: #2a78d6;            /* categorical slot 1 (blue) */
    --unsolved: #eeede8;          /* neutral: not solved (includes runs that crashed) */
    --ramp-100: #cde2fb; --ramp-250: #86b6ef; --ramp-400: #3987e5; --ramp-550: #1c5cab; --ramp-700: #0d366b;
    --accent: #eb6834;            /* categorical slot 2 (orange): selection only */
    --accent-soft: #f5b08e;       /* lighter step of the same orange: the selection's ancestors */
    --critical: #d03b3b;          /* status: never solved */
    --font: Roboto, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  .viz-root { background: var(--surface-1); color: var(--text-primary); font: 13px/1.45 var(--font); padding: 14px 16px 12px; border-radius: 6px; }

  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px; margin-bottom: 10px; }
  .toolbar label { display: inline-flex; align-items: center; gap: 8px; color: var(--text-secondary); font-size: 12.5px; }
  .toolbar b { color: var(--text-primary); font-weight: 600; min-width: 2.6em; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 190px; accent-color: var(--solved); }
  button { font: 500 12.5px var(--font); color: var(--text-primary); padding: 3px 10px; border: 1px solid var(--line); border-radius: 4px; background: #fff; cursor: pointer; }
  button:hover { background: var(--surface-2); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--text-secondary); font-size: 12px; margin-left: auto; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -2px; margin-right: 5px; }
  .legend i.ring { background: #fff; border: 2px solid var(--text-primary); }
  .legend i.dot { border-radius: 50%; border: 1.3px solid var(--text-primary); background: var(--ramp-250); }
  .legend i.dashed { border-radius: 50%; border: 1.3px dashed var(--text-primary); background: #fff; }

  /* the scoreboard column is capped at its content width (plus padding) so the long panel title cannot widen it; the tree gets the rest */
  .panels { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(0, max-content); grid-template-rows: auto 1fr; gap: 0 18px; align-items: stretch; }
  .t2 { width: 0; min-width: 100%; }   /* contributes no width to the column's max-content, then fills it */
  .t1 { order: 1; } .t2 { order: 2; } .p1 { order: 3; } .p2 { order: 4; }
  @media (max-width: 760px) { .panels { grid-template-columns: 1fr; grid-template-rows: auto auto auto auto; } .t1 { order: 1; } .p1 { order: 2; } .t2 { order: 3; } .p2 { order: 4; } .p1 { margin-bottom: 14px; } }
  .panel-title { font-size: 12.5px; font-weight: 600; color: var(--text-primary); margin: 0 0 6px; }
  .panel-title span { font-weight: 400; color: var(--text-secondary); }
  .panel { border: 1px solid var(--line); border-radius: 4px; overflow: auto; max-height: var(--panel-h, 520px); background: #fff; }
  #treebox svg { display: block; width: 100%; height: 100%; }
  #board svg { display: block; }

  /* tree */
  .tcol { stroke: var(--grid); }
  .tgen { font-size: 11px; fill: var(--text-secondary); }
  .taxis { font-size: 11px; fill: var(--text-muted); }
  .tlink { fill: none; stroke: #c9c8c1; stroke-width: 1.3px; }
  .tlink.best { stroke: var(--text-primary); stroke-width: 2.6px; }
  .tnode circle { stroke: var(--text-primary); stroke-width: 1.3px; cursor: pointer; }
  .tnode.nocompile circle { stroke-dasharray: 3 2.5; fill: #fff; }
  .tnode.sel circle { stroke: var(--accent); stroke-width: 3px; }
  .tnode.anc circle { stroke: var(--accent-soft); stroke-width: 3px; }
  .tlink.lineage { stroke: var(--accent-soft); stroke-width: 2.4px; }
  .tnode text { font-size: 11px; fill: var(--text-primary); pointer-events: none; }

  /* scoreboard */
  .cell { stroke: #fff; stroke-width: 2px; }
  .cell.entry { stroke: var(--text-primary); stroke-width: 2.2px; }
  .row:hover .rowbg { fill: var(--surface-2); }
  .row.sel:hover .rowbg { fill: #f8c6ab; }
  .row.anc:hover .rowbg { fill: #fbe0d0; }
  .row.sel .rowbg { fill: #fad2bb; }
  .row.anc .rowbg { fill: #fdeadf; }
  .rowbg { fill: transparent; }
  .lab { font-size: 11.5px; fill: var(--text-primary); }
  .lab.meta { fill: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .hd { font-size: 11.5px; fill: var(--text-primary); cursor: pointer; }
  .hd.flag { font-weight: 600; }
  .sub { font-size: 10.5px; fill: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .gensep { stroke: var(--line); stroke-dasharray: 2 3; }
  .col-hl { fill: #e8f1fc; }

  #tip { position: fixed; pointer-events: none; background: #0b0b0b; color: #fff; padding: 6px 9px; border-radius: 4px; font: 12px/1.4 var(--font); display: none; max-width: 300px; z-index: 9; }
  #tip b { color: #fff; }
</style>
</head>
<body>
<div class="viz-root">
  <div class="toolbar">
    <label>Generations <input type="range" id="gen" min="0" max="20" value="5" /> <b id="genLabel">0–5</b></label>
    <button id="play">▶ Play</button>
    <span class="legend">
      <span><i class="dot"></i>agent, darker = higher score</span>
      <span><i style="background:var(--solved)"></i>task solved</span>
      <span><i style="background:var(--unsolved)"></i>task not solved</span>
      <span><i class="ring"></i>task the agent was created to fix</span>
    </span>
  </div>
  <div class="panels">
    <div class="panel-title t1">Lineage Tree <span>· bolded path labels the evolution trace to the best agent in the current tree.</span></div>
    <div class="panel-title t2">Curriculum Scoreboard <span>· one row per agent in the tree × the 10-task curriculum</span></div>
    <div class="panel p1" id="treebox"></div>
    <div class="panel p2" id="board"></div>
  </div>
</div>
<div id="tip"></div>

    n.addEventListener("click", () => toggleSel(a.id));
    n.addEventListener("mousemove", e => showTip(e, `<b>${a.name}</b>${a.id === "initial" ? "" : " · run " + a.id}<br>generation ${a.gen}${a.parent ? " · branched from " + byId[a.parent].name : ""}<br>${a.compiled ? "score " + fmt(a.score) : "did not compile, never evaluated"}${a.entry ? "<br>created to fix " + a.entry.replace("__", " / ") : ""}`));
    n.addEventListener("mouseleave", hideTip);
    svg.appendChild(n);
  });
  treebox.replaceChildren(svg);
}

// ---- scoreboard ----------------------------------------------------------------------------------
const CW = 24, CH = 17, L = 112, R_MIN = 60, HD_ANGLE = 55, HD_PAD = 22, GX = 36;   // GX: centre of the generation column; HD_PAD: gap between task names and the grid
const taskLabel = t => t.id.replace("__", " / ");
const NO_BOLD = new Set(["cpp__all-your-base", "javascript__robot-name"]);   // flagged tasks whose header is not emphasised
let T = null, R = R_MIN;   // T: top of the grid, R: right margin — both sized so the rotated task names fit inside the svg
function measureHeader() {
  const s = el("svg", { width: 0, height: 0, style: "position:absolute;visibility:hidden" });
  document.body.appendChild(s);
  const rad = HD_ANGLE * Math.PI / 180, gridRight = L + tasks.length * CW;
  let maxH = 0, maxR = R_MIN;
  tasks.forEach(t => {
    const x = el("text", { class: "hd flag" }, taskLabel(t)); s.appendChild(x);
    const len = x.getComputedTextLength();
    maxH = Math.max(maxH, len * Math.sin(rad));
    maxR = Math.max(maxR, cx(t.id) + CW / 2 + 4 + len * Math.cos(rad) + 12 - gridRight);   // how far this name reaches past the grid
  });
  s.remove();
  T = Math.ceil(HD_PAD + maxH + 8); R = Math.ceil(maxR);
}
const cx = t => L + tasks.findIndex(x => x.id === t) * CW;
function renderBoard(g) {
  if (T == null) measureHeader();
  const vis = agents.filter(a => a.gen <= g), rows = vis.filter(a => a.compiled);
  const W = L + tasks.length * CW + R, H = T + rows.length * CH + 8;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: "img", "aria-label": "Scoreboard of agents by curriculum task" });
  if (hlTask) svg.appendChild(el("rect", { class: "col-hl", x: cx(hlTask) - 1, y: T - 4, width: CW, height: H - T + 4, rx: 3 }));
  svg.appendChild(el("text", { class: "sub", x: GX, y: T - 6, "text-anchor": "middle" }, "generation"));
  svg.appendChild(el("text", { class: "sub", x: L - 10, y: T - 6, "text-anchor": "end" }, "agent"));
  tasks.forEach(t => {
    const solved = rows.filter(a => a.o[t.id] === "resolved").length;
    const chosen = vis.filter(a => a.entry === t.id).length;     // every attempt, compiled or not
    const name = el("text", { class: "hd" + (t.flags.length && !NO_BOLD.has(t.id) ? " flag" : ""), transform: `translate(${cx(t.id) + CW / 2 + 4}, ${T - HD_PAD}) rotate(-${HD_ANGLE})` }, taskLabel(t));
    name.addEventListener("click", () => { hlTask = hlTask === t.id ? null : t.id; render(); });
    name.addEventListener("mousemove", e => showTip(e, `<b>${t.id}</b>${t.flags.length ? "<br>" + flagText(t) : ""}<br>solved by ${solved} of ${rows.length} agents · chosen as the failure to fix ${chosen}×<br>click to highlight the column`));
    name.addEventListener("mouseleave", hideTip);
    svg.appendChild(name);
  });
  svg.appendChild(el("text", { class: "sub", x: L + tasks.length * CW + 12, y: T - 6 }, "score"));
  let lastGen = -1;
  rows.forEach((a, i) => {
    const y = T + i * CH;
    if (a.gen !== lastGen && i) svg.appendChild(el("line", { class: "gensep", x1: 8, x2: W - 8, y1: y, y2: y }));
    lastGen = a.gen;
    const row = el("g", { class: "row" + (a.id === selId ? " sel" : ancSet.has(a.id) ? " anc" : ""), id: "row-" + a.id });
    row.appendChild(el("rect", { class: "rowbg", x: 4, y, width: W - 8, height: CH, rx: 2 }));
    if (a.gen !== (rows[i - 1] || {}).gen) row.appendChild(el("text", { class: "lab meta", x: GX, y: y + CH - 5, "text-anchor": "middle" }, String(a.gen)));
    const lab = el("text", { class: "lab", x: L - 10, y: y + CH - 5, "text-anchor": "end" }, a.id === "initial" ? "initial" : String(a.num));
    lab.style.cursor = "pointer";
    lab.addEventListener("click", () => toggleSel(a.id));
    row.appendChild(lab);
    tasks.forEach(t => {
      const o = a.o[t.id] || "none";
      const fill = o === "resolved" ? "var(--solved)" : "var(--unsolved)";   // crashed runs count as not solved, as DGM scored them
      const c = el("rect", { class: "cell" + (a.entry === t.id ? " entry" : ""), x: cx(t.id) + 1, y: y + 1, width: CW - 2, height: CH - 2, rx: 3, fill });
      row.appendChild(c);
    });
    row.appendChild(el("text", { class: "lab meta", x: L + tasks.length * CW + 12, y: y + CH - 5 }, a.score == null ? "n/a" : fmt(a.score)));
    svg.appendChild(row);
  });
  board.replaceChildren(svg);
}

function render() {
  const g = +genInput.value;
  ancSet = new Set(); for (let a = byId[selId] && byId[byId[selId].parent]; a; a = byId[a.parent]) ancSet.add(a.id);
  document.getElementById("genLabel").textContent = g === 0 ? "0" : `0–${g}`;
  renderBoard(g);
  // the tree panel takes the scoreboard's height (shared grid row), then the tree is laid out to fill it
  treebox.style.height = Math.min(board.getBoundingClientRect().height, parseFloat(getComputedStyle(board).maxHeight) || 1e9) + "px";
  renderTree(g);
}
window.addEventListener("resize", render);
genInput.addEventListener("input", render);
let timer = null;
document.getElementById("play").addEventListener("click", function () {
  if (timer) { clearInterval(timer); timer = null; this.textContent = "▶ Play"; return; }
  if (+genInput.value >= maxGen) genInput.value = 0;
  this.textContent = "■ Stop";
  timer = setInterval(() => { if (+genInput.value >= maxGen) { clearInterval(timer); timer = null; this.textContent = "▶ Play"; return; } genInput.value = +genInput.value + 1; render(); }, 700);
});
render();
</script>
</body>
